<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 장비 / 인벤토리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/mobile.css">
<style>
.invtabs{display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line-soft);flex:none}
.inv{display:grid;grid-template-columns:150px 1fr 206px 206px 390px;grid-template-rows:1fr auto;
  gap:12px;padding:10px 18px;flex:1;min-height:0}
.inv__l{display:flex;flex-direction:column;min-height:0;grid-row:1/span 2}

/* 캐릭터 선택 */
.chars{display:flex;flex-direction:column;gap:6px}
.chip-char{display:flex;flex-direction:column;border:1px solid var(--line);cursor:pointer;position:relative;transition:.15s}
.chip-char:hover{border-color:var(--line-hard)}
.chip-char.is-on{border-color:var(--line-red);box-shadow:inset 0 0 16px rgba(165,28,28,.16)}
.chip-char__art{height:64px;position:relative}
.chip-char__nm{padding:4px 6px 5px;font-size:11.5px;color:var(--tx-hi);font-family:var(--f-serif)}
.chip-char__nm span{display:block;font-family:var(--f-sans);font-size:10px;color:var(--tx-faint);margin-top:1px}
.chip-char__ic{position:absolute;right:4px;top:4px;color:rgba(255,255,255,.35)}
.unlock{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;color:var(--tx-ghost)}
.unlock i{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}

/* 페이퍼돌 */
.doll{display:grid;grid-template-columns:78px 1fr 78px;gap:8px;min-height:0;position:relative;grid-row:1/span 2}
.eqcol{display:flex;flex-direction:column;gap:17px;padding-top:17px}
.eqcol--r{align-items:flex-end}
.eq{position:relative;width:62px}
.eq .slot{width:62px;height:62px;aspect-ratio:auto}
.eq .slot .ico{width:34px;height:34px}
.slot__name{text-align:left;padding-left:1px}
.dollart{position:relative;max-width:430px;width:100%;margin:0 auto;border:1px solid var(--line-soft)}
#doll3d{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0c0f}
.doll3d__tg{position:absolute;right:8px;top:8px;z-index:2}
.art--doll>img{object-fit:contain;object-position:center bottom;padding:18px 0 6px}
.art--doll::after{background:radial-gradient(60% 18% at 50% 96%,rgba(0,0,0,.6),transparent 70%)}
/* 캐릭터 칩은 가로 박스 → 얼굴 크롭의 눈 높이에 맞춤 */
.chip-char__art.art--avatar>img{object-position:center 38%}
.dollstats{margin-top:auto;padding-top:10px;border-top:1px solid var(--line-soft)}
.dollstats .stat{padding:2.5px 0;font-size:11.5px}

/* 아이템 정보 */
.iname{font-family:var(--f-serif);font-size:15px;letter-spacing:.03em;line-height:1.35}
.iname--legend{color:#D9A94E}
.iname--hero{color:#A97FE0}
.bigcp{font-family:var(--f-serif);font-size:30px;line-height:1;letter-spacing:.02em}
.iart{height:96px;position:relative;display:grid;place-items:center;color:#8C9098}
.iart .ico{width:52px;height:52px;stroke-width:.9}
.iart .itart{width:84px;height:84px}
.flavor{font-size:10.5px;color:var(--tx-faint);line-height:1.75;font-style:italic}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;grid-column:3 / span 2;grid-row:2}
.invpanel{grid-row:1/span 2}

/* 인벤토리 */
.invhead{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.ifilters{display:flex;align-items:center;gap:5px;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.ifilter{width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--tx-faint);background:rgba(0,0,0,.3);cursor:pointer}
.ifilter:hover{color:var(--tx);border-color:var(--line-hard)}
.ifilter.is-on{color:#D9A9A7;border-color:var(--line-red);background:rgba(165,28,28,.16)}
.invgrid{--cols:5;gap:5px;padding:9px 10px}
.matgrid{--cols:5;gap:5px;padding:9px 10px}
</style>
</head>
<body>
<script src="js/icons.js"></script>

<div class="stage">
  <header class="topbar" style="padding-bottom:9px">
    <svg class="topbar__sigil"><use href="#i-sigil"/></svg>
    <div><h1 class="topbar__title">장비 / 인벤토리</h1></div>
    <div class="topbar__spacer"></div>
    <div class="topbar__right">
      <span class="currency"><svg class="ico"><use href="#i-coin"/></svg><span class="num">75,300</span></span>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-mail"/></svg><i class="iconbtn__dot"></i></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-book"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <div class="invtabs">
    <span class="key">Q</span>
    <div class="tabs" data-tabs="" style="border:0">
      <button class="tab is-on" data-tab="eq">장비</button>
      <button class="tab" data-tab="inv">인벤토리</button>
      <button class="tab" data-tab="use">소모품</button>
      <button class="tab" data-tab="mat">재료</button>
      <button class="tab" data-tab="quest">임무 아이템</button>
    </div>
    <span class="key">E</span>
  </div>

  <main class="inv" data-mdefault="장비">
    <!-- ===== 캐릭터 선택 ===== -->
    <div class="inv__l" data-mpane="캐릭터">
      <div class="label-ko">캐릭터 선택</div>
      <div class="chars" data-pick>
        <div class="chip-char is-on" data-pickitem data-char="ain">
          <div class="chip-char__art art art--avatar"><img src="art/face-ain.webp" alt="ain"></div>
          <div class="chip-char__nm">아인<span data-grade="ain">등급 A</span></div>
          <svg class="ico ico--xs chip-char__ic"><use href="#i-scythe"/></svg>
        </div>
        <div class="chip-char" data-pickitem data-char="kain">
          <div class="chip-char__art art art--avatar"><img src="art/face-kain.webp" alt="kain"></div>
          <div class="chip-char__nm">카인<span>등급 S</span></div>
          <svg class="ico ico--xs chip-char__ic"><use href="#i-sword"/></svg>
        </div>
        <div class="chip-char" data-pickitem data-char="ryu">
          <div class="chip-char__art art art--avatar"><img src="art/face-ryu.webp" alt="ryu"></div>
          <div class="chip-char__nm">류<span>등급 A</span></div>
          <svg class="ico ico--xs chip-char__ic"><use href="#i-crosshair"/></svg>
        </div>
        <div class="chip-char" data-pickitem data-char="sera">
          <div class="chip-char__art art art--avatar"><img src="art/face-sera.webp" alt="sera"></div>
          <div class="chip-char__nm">세라<span>등급 A</span></div>
          <svg class="ico ico--xs chip-char__ic"><use href="#i-seal"/></svg>
        </div>
      </div>
      <div class="unlock">
        <i><svg class="ico ico--sm"><use href="#i-lock"/></svg></i>
        <span class="xs">잠금 해제</span>
      </div>
      <div class="dollstats">
          <div class="stat" style="border-bottom:1px solid var(--line-soft);padding-bottom:5px">
            <span class="stat__k">전투력</span><span class="stat__v t-hi num" id="cp-total">24,650</span></div>
          <div class="stat"><span class="stat__k">HP</span><span class="stat__v num">24,450</span></div>
          <div class="stat"><span class="stat__k">공격력</span><span class="stat__v num">2,980</span></div>
          <div class="stat"><span class="stat__k">방어력</span><span class="stat__v num">1,780</span></div>
          <div class="stat"><span class="stat__k">치명타 확률</span><span class="stat__v num">18.2%</span></div>
          <div class="stat"><span class="stat__k">치명타 피해</span><span class="stat__v num">142.6%</span></div>
          <div class="stat"><span class="stat__k">공격 속도</span><span class="stat__v num">112.5%</span></div>
          <div class="stat"><span class="stat__k">이동 속도</span><span class="stat__v num">105.0%</span></div>
      </div>
    </div>

    <!-- ===== 페이퍼돌 ===== -->
    <div class="doll" data-mpane="장비">
      <div class="eqcol" id="eq-left" data-mgoto="아이템"></div>

      <div class="dollart art art--doll">
        <img id="doll" src="art/full-ain.webp" alt="아인">
        <iframe id="doll3d" title="장착 외형 3D" hidden loading="lazy"></iframe>
        <button type="button" class="btn btn--sm doll3d__tg" id="doll3d-tg">3D 외형</button>
      </div>

      <div class="eqcol eqcol--r" id="eq-right" data-mgoto="아이템"></div>
    </div>

    <!-- ===== 아이템 정보 ===== -->
    <section class="panel panel--framed" data-mpane="아이템">
      <div class="panel__head">
        <span class="panel__title">아이템 정보</span>
        <span class="chip chip--red" style="margin-left:auto" id="info-badge">장착 중</span>
      </div>
      <div class="panel__body panel__body--tight scroll" id="item-info"></div>
    </section>

    <!-- ===== 비교 대상 ===== -->
    <section class="panel panel--framed" data-mpane="아이템">
      <div class="panel__head"><span class="panel__title">비교 대상</span></div>
      <div class="panel__body panel__body--tight scroll" id="item-cmp"></div>
    </section>

    <!-- ===== 인벤토리 ===== -->
    <section class="panel panel--framed invpanel" data-mpane="가방">
      <div class="invhead">
        <span class="panel__title">인벤토리</span>
        <span class="panel__meta" style="margin-left:auto"><span class="num" id="bag-count">82 / 120</span></span>
        <button class="iconbtn" style="width:22px;height:22px"><svg class="ico ico--sm"><use href="#i-plus"/></svg></button>
      </div>
      <div class="ifilters" id="filters">
        <span class="ifilter is-on" data-filter="all" style="width:auto;padding:0 8px;font-size:11px">전체</span>
        <span class="ifilter" data-filter="weapon" title="무기"><svg class="ico ico--xs"><use href="#i-scythe"/></svg></span>
        <span class="ifilter" data-filter="armor" title="방어구"><svg class="ico ico--xs"><use href="#i-chest"/></svg></span>
        <span class="ifilter" data-filter="acc" title="악세서리"><svg class="ico ico--xs"><use href="#i-ring"/></svg></span>
        <span class="ifilter" data-filter="consumable" title="소모품"><svg class="ico ico--xs"><use href="#i-potion"/></svg></span>
        <select class="sel" style="margin-left:auto;width:96px"><option>정렬 : 등급</option><option>정렬 : 전투력</option></select>
        <span class="ifilter"><svg class="ico ico--xs"><use href="#i-filter"/></svg></span>
      </div>
      <div class="slotgrid invgrid scroll fill" id="bag" data-mgoto="아이템"></div>

      <div class="invhead" style="border-top:1px solid var(--line-soft)">
        <span class="panel__title">재료 보관함</span>
        <span class="panel__meta" style="margin-left:auto"><span class="num" id="mat-count">54 / 300</span></span>
        <button class="iconbtn" style="width:22px;height:22px"><svg class="ico ico--sm"><use href="#i-plus"/></svg></button>
      </div>
      <div class="slotgrid matgrid" id="mats"></div>
    </section>

    <!-- ===== 액션 버튼 ===== -->
    <div class="actions" data-mpane="아이템">
      <button class="btn">강화</button>
      <button class="btn">수리</button>
      <button class="btn">분해</button>
      <button class="btn btn--primary" id="act-equip">해제</button>
    </div>
  </main>

  <div class="hotbar">
    <a class="hot" href="office.html"><span class="key">ESC</span>뒤로</a>
    <a class="hot"><span class="key">F</span>프리셋 관리</a>
    <a class="hot"><span class="key">R</span>아이템 비교</a>
    <a class="hot"><span class="key">T</span>능력치 상세</a>
    <span class="hotbar__spacer"></span>
    <a class="hot"><span class="key">G</span>잠금 / 해제</a>
    <a class="hot"><span class="key">X</span>버리기</a>
    <button class="btn btn--primary btn--sm" style="width:132px" id="hot-equip" data-primary>장착</button>
  </div>
</div>
<script src="js/save.js"></script>
<script src="js/items.js"></script>
<script src="js/gear.js"></script>
<script src="js/grade.js"></script>
<script src="js/inventory.js"></script>
<script>
/* 3D 외형 미리보기: viewer.html 의 장착 모드. 장비를 바꾸면 다시 불러온다 */
(function(){ var fr=document.getElementById('doll3d'), tg=document.getElementById('doll3d-tg'), doll=document.getElementById('doll'); if(!fr||!tg) return; var on=false;
  function load(){ fr.src='viewer.html?equip=1&fit=1&t='+Date.now(); }
  tg.addEventListener('click', function(){ on=!on; fr.hidden=!on; doll.style.visibility=on?'hidden':''; tg.textContent=on?'2D 원화':'3D 외형'; if(on) load(); else fr.src='about:blank'; try{ localStorage.setItem('tw:doll3d', on?'1':'0'); }catch(e){} });
  document.addEventListener('tw:gear', function(){ if(on) load(); });
  try{ if(localStorage.getItem('tw:doll3d')==='1') tg.click(); }catch(e){} })();
</script>
<script>try{ document.querySelectorAll('[data-grade]').forEach(function(e){ e.textContent='등급 '+TW_GRADE.agent().g; }); }catch(e){}</script>
<script src="js/ui.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<script>
/* 캐릭터 선택 → 페이퍼돌 전환 (캐릭터 설정 시트 정면 뷰) */
document.querySelector('.chars').addEventListener('click', function(e){
  var c = e.target.closest('[data-char]'); if(!c) return;
  var d = document.getElementById('doll');
  d.style.opacity = 0;
  setTimeout(function(){ d.src = 'art/full-' + c.dataset.char + '.webp'; d.onload = function(){ d.style.opacity = 1; }; }, 120);
});
document.getElementById('doll').style.transition = 'opacity .18s';
</script>
</body>
</html>
