<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>황혼 보스 전투 언어 검수</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e8e4df;font-family:system-ui,"Noto Sans KR",sans-serif}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:100vh}.stage{position:relative;min-height:720px;background:radial-gradient(circle at 50% 38%,#273038 0,#101419 52%,#090b0e 100%);overflow:hidden}
canvas{width:100%;height:100%;display:block}.top{position:absolute;left:24px;top:20px;z-index:3}.top h1{margin:0;font-size:20px;letter-spacing:.08em}.top p{margin:5px 0 0;color:#9fa8b2;font-size:12px}
.side{padding:22px 20px;border-left:1px solid #2b3137;background:#11151a}.side h2{margin:0 0 6px;font-size:24px}.sub{color:#9ba4ad;font-size:13px;margin-bottom:18px}
label{display:block;color:#aeb6bf;font-size:12px;margin:14px 0 6px}select,button{font:inherit}select{width:100%;padding:11px;background:#191f25;color:#eee;border:1px solid #39424b;border-radius:7px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buttons button{border:1px solid #39424b;background:#181e24;color:#ddd;padding:10px;border-radius:7px;cursor:pointer}.buttons button.on{background:#e2ded6;color:#111;border-color:#e2ded6}
.card{border:1px solid #313840;background:#161b20;border-radius:8px;padding:13px;margin-top:15px}.card b{display:block;margin-bottom:8px}.patterns{display:grid;gap:6px}.pat{padding:8px 9px;border-left:3px solid #6e7781;background:#101419;font-size:12px}.pat strong{display:block;color:#eee}.pat span{color:#98a3ad}.legend{margin-top:16px;font-size:12px;line-height:1.6;color:#9aa4ad}.state{position:absolute;left:24px;bottom:22px;background:rgba(8,10,13,.8);border:1px solid #333b43;border-radius:8px;padding:10px 13px;font-size:13px}.state b{color:#f0b46f}
@media(max-width:850px){main{grid-template-columns:1fr}.stage{min-height:520px}.side{border-left:0;border-top:1px solid #2b3137}}
</style></head>
<body><main><section class="stage"><canvas id="c"></canvas><div class="top"><h1>BOSS COMBAT LANGUAGE · QA</h1><p>대기 → 접근 → 공격준비 → 접점 → 회수 → 카운터 반응</p></div><div class="state" id="state"></div></section>
<aside class="side"><h2 id="name">보스</h2><div class="sub" id="place"></div>
<label>보스 선택</label><select id="boss"></select>
<label>상태</label><div class="buttons" id="buttons">
<button data-mode="idle">대기</button><button data-mode="move">접근/배회</button><button data-mode="prep">공격 준비</button><button data-mode="rage">광란 대기</button><button data-mode="counter">카운터 반응</button><button data-mode="down">격추</button></div>
<div class="card"><b>현재 패턴</b><div id="current"></div></div>
<div class="card"><b>보유 공격</b><div class="patterns" id="patterns"></div></div>
<div class="legend">빨간 바닥 범위만 보고 피하는 보스전이 아니라, <b>보스 몸 자체가 공격 시점을 말하게</b> 하는 검수 화면이다.<br><br>공격 준비에서는 실제 attack clip을 접점 직전까지 스크럽하면서 캐릭터별 준비 자세 보정도 함께 적용한다.</div>
</aside></main>
<script src="js/dungeons.js"></script><script src="js/dungeon.js"></script><script src="js/dungeon-content.js"></script>
<script type="module">
import * as T from './vendor/three/three.module.js';
import {GLTFLoader} from './vendor/three/GLTFLoader.js';
import {createPumpBoss} from './js/pump-boss.js';import {createRelayBoss} from './js/relay-boss.js';
import {createRootBoss} from './js/root-boss.js';import {createHaulerBoss} from './js/hauler-boss.js';import {createWardBoss} from './js/ward-boss.js';
import {prepareMarshMotion,bossAttackSpec} from './js/marsh-motion.js';
import {createBossBehavior,BOSS_PROFILES} from './js/boss-motion.js';

const canvas=document.querySelector('#c'),renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(42,1,.1,100);cam.position.set(5.6,3.4,7.4);cam.lookAt(0,1.4,0);
scene.add(new T.HemisphereLight(0xc8d9e8,0x42372c,2.2));const key=new T.DirectionalLight(0xffd6b3,3.4);key.position.set(-5,9,6);scene.add(key);const rim=new T.DirectionalLight(0x89a6cf,2);rim.position.set(6,5,-5);scene.add(rim);
const floor=new T.Mesh(new T.CircleGeometry(5.6,64),new T.MeshStandardMaterial({color:0x23282d,roughness:.95,metalness:.08}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new T.GridHelper(10,20,0x4c555f,0x32383e);grid.position.y=.006;grid.material.transparent=true;grid.material.opacity=.3;scene.add(grid);
const A=window.TW_DUNGEONS.ARENAS, ids=['marsh','sewage','relay','grove','road','ward'],sel=document.querySelector('#boss');
for(const id of ids){const o=document.createElement('option');o.value=id;o.textContent=BOSS_PROFILES[id].name+' · '+A[id].name;sel.append(o);}
const qp=new URLSearchParams(location.search);
let holder=new T.Group(),mixer=null,model=null,behavior=null,clips={},mode=qp.get('mode')||'idle',patternI=Math.max(0,+(qp.get('pattern')||0)),clock=0,act=null;scene.add(holder);
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
async function asset(id){if(id==='marsh')return prepareMarshMotion(await new GLTFLoader().loadAsync('art/3d/boss_marsh_v2.glb'));if(id==='sewage')return createPumpBoss();if(id==='relay')return createRelayBoss();if(id==='grove')return createRootBoss();if(id==='road')return createHaulerBoss();return createWardBoss();}
function play(name,loop=true){if(!clips[name])return null;mixer.stopAllAction();const a=mixer.clipAction(clips[name]);a.reset().setLoop(loop?T.LoopRepeat:T.LoopOnce,loop?Infinity:1).play();return a;}
async function load(){
 const id=sel.value||ids[0],arena=A[id],g=await asset(id);holder.clear();model=g.scene;holder.add(model);clips={};for(const c of g.animations)clips[c.name]=c;mixer=new T.AnimationMixer(model);behavior=createBossBehavior(model,id);
 const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),ctr=box.getCenter(new T.Vector3()),scale=3.3/Math.max(size.y,2.5);model.scale.setScalar(scale);model.position.set(-ctr.x*scale,-box.min.y*scale,-ctr.z*scale);
 document.querySelector('#name').textContent=BOSS_PROFILES[id].name;document.querySelector('#place').textContent=arena.name+' · 2단계 보스전';
 renderPatterns();setMode(mode);
}
function pats(){return A[sel.value].stages[0].patterns;}
function renderPatterns(){document.querySelector('#patterns').innerHTML=pats().map((p,i)=>`<div class="pat"><strong>${p.name}</strong><span>${p.range||'any'} · ${p.counterable===false?'회피 전용':'반격 가능'}${p.hold?' · 지연타':''}${p.chain?' · '+(p.chain.length+1)+'연격':''}</span></div>`).join('');}
function setMode(v){mode=v;clock=0;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===v));behavior?.restore();
 const p=pats()[patternI%pats().length],spec=bossAttackSpec(A[sel.value],p.icon,1);
 if(v==='prep'){act=play(spec.clip,false);if(act)act.paused=true;}
 else if(v==='counter'){act=play('stagger',false);behavior?.react('clash',1);if(act)act.time=.12;}
 else if(v==='down'){act=play('down',false);if(act){act.paused=true;act.time=Math.max(0,act.getClip().duration*.8);}}
 else act=play(v==='move'?'walk':'idle',true);
 document.querySelector('#current').innerHTML=`<b>${p.name}</b><div style="color:#98a3ad;font-size:12px;margin-top:5px">${v==='prep'?'실제 공격 클립 + 준비 실루엣':v==='counter'?'맞대기 → 밀림 반응':v==='rage'?'2페이즈 템포/호흡 강화':v==='move'?'접근·배회 대기':'비전투 미세 동작'}</div>`;
}
sel.addEventListener('change',()=>{patternI=0;load()});document.querySelector('#buttons').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode)});
document.querySelector('#current').addEventListener('click',()=>{patternI=(patternI+1)%pats().length;setMode(mode)});
function frame(ms){requestAnimationFrame(frame);if(!mixer||!behavior)return;const dt=Math.min(.033,(ms-(frame.last||ms))/1000);frame.last=ms;clock+=dt;behavior.restore();
 const p=pats()[patternI%pats().length],spec=bossAttackSpec(A[sel.value],p.icon,1);
 let st={state:'idle',patIcon:p.icon,windup:0,recovery:0,recoveryDur:1,rage:mode==='rage'};
 if(mode==='prep'){const cyc=(clock%2.8)/2.8,w=Math.min(.9,cyc/.75);st={...st,state:'telegraph',windup:w};if(act){act.paused=true;act.time=act.getClip().duration*spec.hitFrac*w;}}
 else if(mode==='counter')st.state='stagger';else if(mode==='down')st.state='downed';else if(mode==='move')st.moving=true;
 mixer.update(mode==='prep'?0:dt);behavior.apply(st,clock,dt);
 holder.rotation.y=Math.sin(clock*.28)*.12;renderer.render(scene,cam);
 document.querySelector('#state').innerHTML=`<b>${mode.toUpperCase()}</b> · ${BOSS_PROFILES[sel.value].name} · ${p.name}`;
}
sel.value=ids.includes(qp.get('boss'))?qp.get('boss'):'marsh';await load();requestAnimationFrame(frame);
</script></body></html>
