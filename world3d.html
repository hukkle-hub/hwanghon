<style>

.tag{ position:absolute; transform:translate(-50%,-100%); font-size:11px; color:#e8f4ff; text-shadow:0 1px 3px #000; white-space:nowrap; }
.mobhp{position:absolute;transform:translate(-50%,-100%);width:46px;height:5px;background:rgba(10,4,4,.72);box-shadow:0 0 0 1px rgba(0,0,0,.8);pointer-events:none}.mobhp i{display:block;height:100%;width:100%;background:linear-gradient(#ff6a50,#b8281c)}
.tag.mob{ color:#d4dccb; } .tag.mob small{ display:block; font-size:9px; color:#a8b0a0; } .tag.mob.g4{ color:#c9a8ff; } .tag.mob.g3{ color:#ff9c90; }
#mini{ position:absolute; right:calc(12px + env(safe-area-inset-right)); top:calc(max(12px,env(safe-area-inset-top))); width:132px; border:1px solid rgba(201,164,94,.55); background:#140c10 center/100% 100% no-repeat; box-shadow:0 0 8px rgba(0,0,0,.6); overflow:hidden; pointer-events:auto; cursor:pointer; }
#mini[hidden]{ display:none; }
#mini.big{ right:auto; left:50%; top:50%; transform:translate(-50%,-50%); width:min(86vw,calc(78vh * var(--ar))); z-index:6; }
#mini i{ position:absolute; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#ffb070; pointer-events:none; }
#mini i.gt{ border-radius:1px; background:#40b8e8; } #mini i.gt.dg{ background:#ff6040; } #mini i.bs{ width:8px; height:8px; margin:-4px 0 0 -4px; background:#ff3a30; box-shadow:0 0 5px #ff3a30; } #mini i.pl{ background:#e8f4ff; } #mini i.mb{ display:none; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; background:#9aa890; } #mini.big i.mb{ display:block; } #mini i.mb.g4{ background:#b48cff; } #mini i.mb.g3{ background:#ff6a5a; }
#mini b.me{ position:absolute; width:0; height:0; margin:-7px 0 0 -5px; border:5px solid transparent; border-bottom:12px solid #5fe0ff; border-top:0; filter:drop-shadow(0 0 3px #5fe0ff); transform-origin:5px 7px; z-index:2; pointer-events:none; }

#mini.big span{ display:block; } #mini span.d2{ color:#ffb070; } #mini span.d3{ color:#ff6a50; } #mini span.rest{ color:#9fe0b0; }
#areaName{ position:absolute; left:50%; top:63%; transform:translateX(-50%); text-align:center; pointer-events:none; opacity:0; color:#f0e2d0; text-shadow:0 0 10px #000,0 0 4px #000,0 1px 2px #000; white-space:nowrap; }   /* 낮(밝은 길) 위에서도 읽히게 — 문서 217 */
@media (orientation:portrait){ #areaName{ top:40%; } }   /* 세로: 아래쪽은 스킬 단추 자리 */
#areaName b{ display:block; font-size:22px; letter-spacing:.12em; font-weight:800; } #areaName small{ display:block; font-size:11px; letter-spacing:.08em; opacity:.8; margin-top:2px; }
#areaName.d2 b{ color:#ffb070; } #areaName.d3 b{ color:#ff6a50; } #areaName.rest b{ color:#9fe0b0; }
@media (max-height:500px){ #areaName b{ font-size:18px; } #mini{ width:112px; } }
#osm{ position:absolute; right:12px; bottom:max(10px,env(safe-area-inset-bottom)); font-size:10px; color:var(--dim); opacity:.7; }

<body>
<canvas id="c"></canvas>
<div id="mini" hidden></div><div id="areaName"></div>
<div id="hud"><div id="title">—<small>3D 필드 시험판</small></div><div id="ring"><i></i></div><div id="hpw"><i id="hp"></i></div><div id="dead" hidden>쓰러졌다<br><small>5초 뒤 출발점</small></div><div id="dmgs"></div><div id="net"></div><div id="dbg" hidden></div><div id="toast" hidden></div><div id="gatebtn" hidden></div><div class="btn" id="dodge">회피</div><div class="btn none" id="pot"><b>회복약</b><em>—</em></div><div class="btn" id="atk">공격</div><div class="btn" id="bagBtn">가방</div><div class="btn skb" id="sk1" hidden></div><div class="btn skb" id="sk2" hidden></div><div class="btn skb" id="sk3" hidden></div><div class="btn skb" id="sk4" hidden></div><div id="hint">왼쪽: 이동 · 오른쪽 끌기: 카메라 · 두 손가락/휠: 거리 — PC: WASD · J/Space 공격 · K 회피 · E 이동</div><div id="osm">지도 데이터 © OpenStreetMap contributors</div></div>
<div id="hurt"></div><div id="load">3D 필드를 세우는 중…</div>

<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<script type="module">
/* 황혼 3D 필드 (문서 206) — 디렉터 2026-10-08 «맵을 좀 3d로 구현하고 뽑아보자».
   구운 2D 맵의 «원본 장면»(js/mmo/env-*.js, OSM 실측 건물·도로·소품)을 그대로 실시간으로 세우고, 고정 55° 대신 3인칭 카메라로 걷는다.
   같은 장면·같은 충돌(js/mmo/field-collide.js)·같은 영웅·장비·지배형 — 2D 필드(mmo.html)와 자리가 1:1 로 맞는다.
   점광은 수십 개라 실시간에선 가까운 8개만 옮겨 쓴다 (mmo.html nearLights 와 같은 수법). 해 그림자는 내 둘레 60 m 만.
   ?zone=<id> · ?char=ain|kain|ryu|sera · 검수: window.__W3D (hold · dtCap · view · teleport) */
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/GLTFLoader.js';
import * as SkeletonUtils from './vendor/three/SkeletonUtils.js';
import { createBloom } from './js/bloom.js';
import { createDayCycle, tOf } from './js/mmo/daycycle.js';
import { ZONES } from './js/mmo/zones.js';
import { createCollide } from './js/mmo/field-collide.js';
import { setView3d } from './js/mmo/env-lib.js';
import { mountAinScythe } from './js/ain-scythe-mount.js';
import { setupDominator, updateDominator, applyDominatorAction, hideDominator, flinchDominator } from './js/mmo/dominator-motion.js';
import { loadCjs } from './js/mmo/cjs-browser.js';
import { isPerfect, perfectDodgeFx } from './js/mmo/perfect-dodge.js';
import { createMobView, mobsFromPacket, PRACTICE_HP, ecologyCatalog } from './js/mmo/field-mobs.js'; import { createMobPractice } from './js/mmo/field-mob-practice.js'; import { createPerfMeter } from './js/mmo/perf-meter.js'; import { createBagUI } from './js/mmo/field-bag-ui.js';
import { CATALOG } from './js/mmo/monster-catalog.js';
import { setupBossMotion, applyBossAction, prepareBossMotion, updateBossMotion, bossHitReact, bossCounterBurst, hideBossMotion } from './js/mmo/boss-motion.js';
import { createFieldFeel, contactOf } from './js/mmo/field-feel.js';
import { connectField, serverClock } from './js/mmo/field-net.js';
import { mergeStatic, firstHit } from './js/mmo/static-merge.js';
import { Animated } from './js/party-avatar.js';
const q = new URLSearchParams(location.search), ZONE = /^[a-z0-9_-]{1,24}$/.test(q.get('zone') || '') ? q.get('zone') : 'seogwipo';
const ME = ['ain', 'kain', 'ryu', 'sera'].includes(q.get('char')) ? q.get('char') : 'ain';
const MOBILE = matchMedia('(pointer:coarse)').matches, REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Z = ZONES[ZONE] || { env: 'osm', osm: ZONE };
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: !MOBILE, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(MOBILE ? 1.5 : 2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.55;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
/* ---------- 원본 장면 — 굽기(tools/2d/bake-map.html)와 같은 빌더 ---------- */
const ENV_FILE = { osm: './js/mmo/env-osm.js', dungeon: './js/mmo/env-dungeon.js', namsan: './js/mmo/env-namsan.js', indoor: './js/mmo/env-indoor.js', field: './js/mmo/env-field.js' };
await document.fonts.load('900 96px "Noto Sans KR"').catch(() => {});   /* 간판 글씨가 캔버스에 구워진다 */
const osm = Z.osm ? await (await fetch('maps/2d/' + Z.osm + '/osm.json')).json() : null;
const meta = await (await fetch('maps/2d/' + ZONE + '/map.json')).json();   /* 보스·사냥터 자리 (서버와 같은 표) */
const { build } = await import(ENV_FILE[Z.env] || ENV_FILE.osm);
setView3d(true);   /* 장면 빌더(공용)에 3D 라고 알린다 — 바위·덤불·잎·잔해를 울퉁불퉁하게 (문서 215) */
const env = build(THREE, scene, osm, { id: ZONE, ...Z, view3d: true });   /* view3d: 카메라 쪽 벽을 자르지 않고 실내엔 천장 (굽기 그림은 그대로) */
document.getElementById('title').firstChild.textContent = env.title || Z.title || meta.title || ZONE;
if (!/OpenStreetMap/.test(env.license || meta.license || '')) document.getElementById('osm').style.display = 'none';
const skyCol = new THREE.Color(env.sky ? env.sky.fog : 0x140c12);
scene.background = skyCol; scene.fog = new THREE.Fog(skyCol, 70, 230);
/* 하늘 돔 (바깥만) — 굽기는 내려다봐서 하늘이 필요 없었다. 3인칭은 늘 지평선이 보인다: 안개색(땅 끝) → 지평선 노을 → 위 보랏빛, 해 쪽으로 빛무리.
   색은 장면이 정한 env.sky (top · horizon · fog) 그대로 */
if (env.sky && env.sky.top && env.sky.horizon) { const sd = env.sun ? new THREE.Vector3(...env.sun.dir).normalize() : new THREE.Vector3(0, 0.2, 1);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(480, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
    uniforms: { top: { value: new THREE.Color(env.sky.top) }, hor: { value: new THREE.Color(env.sky.horizon) }, fogc: { value: skyCol.clone() }, sun: { value: sd }, sunc: { value: new THREE.Color(env.sun && env.sun.color || '#ff8a50') } },
    vertexShader: 'varying vec3 vd; void main(){ vd = normalize(position); vec4 p = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * p; gl_Position.z = gl_Position.w; }',
    fragmentShader: 'uniform vec3 top, hor, fogc, sun, sunc; varying vec3 vd; void main(){ float y = vd.y; vec3 c = mix(fogc, hor, smoothstep(-0.02, 0.10, y)); c = mix(c, top, smoothstep(0.10, 0.55, y)); float a = max(dot(vd, sun), 0.0); c += sunc * (pow(a, 64.0) * 1.6 + pow(a, 6.0) * 0.28) * smoothstep(-0.05, 0.05, y); gl_FragColor = vec4(c, 1.0); }' }));
  dome.frustumCulled = false; dome.renderOrder = -10; dome.name = 'sky'; scene.add(dome); window.__sky = dome; }   /* 굽기엔 없던 것 — 3인칭은 지평선까지 보인다. 먼 경계(잘린 블록·띠 끝)를 노을 안개로 덮는다 */
/* 점광 정리: 장면의 점광을 빼고 데이터만 남긴다 → 가까운 8개만 */
const pointData = []; scene.traverse(o => { if (o.isPointLight) pointData.push(o); });
for (const L of pointData) L.parent.remove(L);
/* 정적 메시 합치기 — 그리기 호출 수천 → 수백. 카메라 막이 상자도 여기서 모은다 */
const MERGE = q.get('merge') === '0' ? { before: 0, after: 0, camBoxes: [] } : mergeStatic(scene, { skip: o => o.name === 'sky' });
const POOL = [...Array(MOBILE ? 4 : 8)].map(() => { const L = new THREE.PointLight(0xffffff, 0, 8, 1.6); scene.add(L); return L; });
function nearLights(p) { const s = pointData.map(l => [l, (l.position.x - p.x) ** 2 + (l.position.z - p.z) ** 2]).sort((a, b) => a[1] - b[1]);
  POOL.forEach((L, i) => { const l = s[i] && s[i][0]; if (!l) { L.intensity = 0; return; } L.position.copy(l.position); L.color.copy(l.color); L.intensity = l.intensity * lampK; L.distance = l.distance; L.decay = l.decay; }); }
const sun = env.sunLight || null, sunDir = env.sun ? new THREE.Vector3(...env.sun.dir) : new THREE.Vector3(0, 1, 0);
if (sun) { sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048); const sc = sun.shadow.camera; sc.left = sc.bottom = -34; sc.right = sc.top = 34; sc.near = 1; sc.far = 400; sc.updateProjectionMatrix(); }
const fillL = new THREE.DirectionalLight(0xffe8d8, 0.9); scene.add(fillL.translateX(-3).translateY(9).translateZ(8));   /* 노을이 등 뒤여도 얼굴이 보이게 (mmo.html 의 front 와 같은 몫) */
const bloom = createBloom(renderer, { div: MOBILE ? 4 : 2, threshold: 0.72, soft: 0.28, amount: MOBILE ? 0.7 : 0.8, samples: 4 });
/* ---------- 시간대 (문서 217) — 48분 한 바퀴, 서버 시각. 실내는 안 돌린다. ?tod=밤|night|0.45 로 고정 ---------- */
