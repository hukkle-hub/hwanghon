<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 장비 관리 / 제작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/mobile.css">
<style>
.fgtabs{display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line-soft);flex:none}
.fgtabs .tab{padding:9px 30px}
.fgtabs .sepbar{color:var(--tx-ghost);font-size:11px}
.cf .tabs--pill{flex-wrap:wrap}
.cf{display:grid;grid-template-columns:300px 1fr 330px;gap:12px;padding:12px 18px;flex:1;min-height:0}

/* 레시피 목록 */
.rrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;
  border-bottom:1px solid var(--line-soft);cursor:pointer;transition:.15s}
.rrow:hover{background:rgba(255,255,255,.03)}
.rrow.is-on{border-color:var(--line-red);background:linear-gradient(90deg,rgba(165,28,28,.2),rgba(165,28,28,.04));box-shadow:inset 2px 0 0 var(--red-lit)}
.rrow .slot{width:40px;height:40px;aspect-ratio:auto;flex:none;cursor:inherit}
.rrow .slot .ico{width:22px;height:22px}
.rrow__nm{font-size:12.5px;color:var(--tx-hi)}
.rrow__sub{font-size:10.5px;color:var(--tx-faint);margin-top:2px}
.rrow__ok{margin-left:auto;font-size:10px;letter-spacing:.06em;padding:2px 6px;border:1px solid;flex:none}
.rrow__ok.ok{color:#8FBF8F;border-color:rgba(91,163,91,.4)}
.rrow__ok.no{color:#C9534E;border-color:rgba(192,57,43,.4)}

/* 중앙 */
.cf__c{display:grid;grid-template-rows:auto 1fr auto;gap:11px;min-height:0}
.result{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 16px}
.result__art{height:150px;position:relative;border:1px solid var(--line);display:grid;place-items:center;
  background:radial-gradient(60% 60% at 50% 55%,rgba(201,138,43,.14),transparent 70%),rgba(0,0,0,.35);color:#B9A46E}
.result__art .ico{width:74px;height:74px;stroke-width:.8}
.result__nm{font-family:var(--f-serif);font-size:20px;letter-spacing:.03em}
.result__meta{font-size:11.5px;color:var(--tx-faint);margin-top:3px}
.result__stats{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:10px}
.result__stats .stat{padding:3px 0}
.matrow{display:grid;grid-template-columns:44px 1fr 120px 96px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.matrow:last-child{border:0}
.matrow .slot{width:44px;height:44px;aspect-ratio:auto;cursor:default}
.matrow__nm{font-size:12.5px;color:var(--tx-hi)}
.matrow__d{font-size:10.5px;color:var(--tx-faint);margin-top:2px}
.matrow__n{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.matrow__n b{font-weight:500}
.matrow__n.no b{color:#C9534E}
.matrow__n.ok b{color:#8FBF8F}
.craftbar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 14px}
.craftbar__k{font-size:11px;color:var(--tx-faint)}
.craftbar__v{font-size:14px;color:var(--tx-hi);font-variant-numeric:tabular-nums;margin-top:2px}
.qty{display:flex;align-items:center;border:1px solid var(--line);background:rgba(0,0,0,.4)}
.qty button{width:30px;height:32px;color:var(--tx-dim)}
.qty button:hover{color:var(--tx-hi);background:rgba(255,255,255,.05)}
.qty input{width:44px;height:32px;text-align:center;background:none;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);color:var(--tx-hi);outline:none;font-size:13px}
.btn--craft{height:44px;padding:0 34px;font-family:var(--f-serif);font-size:17px;letter-spacing:.2em}

/* 우측 */
.matgrid{--cols:5;gap:5px}
.log{font-size:11px;color:var(--tx-faint);line-height:1.8;max-height:120px;overflow:auto}
.log b{color:#D9C07A;font-weight:400}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:300;padding:9px 18px;
  background:rgba(10,11,14,.94);border:1px solid var(--line-gold);color:#E8D9A8;font-size:12.5px;letter-spacing:.04em;
  box-shadow:var(--sh-pop);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<script src="js/icons.js"></script>

<div class="stage">
  <header class="topbar" style="padding-bottom:10px">
    <svg class="topbar__sigil"><use href="#i-sigil"/></svg>
    <div>
      <h1 class="topbar__title">장비 관리</h1>
      <div class="topbar__sub">장비의 제작, 강화, 수리 및 분해를 진행합니다.</div>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__right">
      <span class="currency"><svg class="ico"><use href="#i-coin"/></svg><span class="num" id="gold">75,300</span></span>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-mail"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-book"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <div class="fgtabs">
    <a class="tab" href="inventory.html">장비</a><span class="sepbar">|</span>
    <a class="tab is-on" href="craft.html">제작</a><span class="sepbar">|</span>
    <a class="tab" href="forge.html">강화</a>
  </div>

  <main class="cf" data-mdefault="제작">
    <!-- 레시피 목록 -->
    <section class="panel panel--framed" data-mpane="목록">
      <div class="panel__head"><span class="panel__title">제작 목록</span><span class="panel__meta" id="rcount"></span></div>
      <div class="panel__body panel__body--tight none">
        <div class="tabs tabs--pill" id="rcat">
          <button class="tab is-on" data-cat="all">전체</button>
          <button class="tab" data-cat="weapon">무기</button>
          <button class="tab" data-cat="armor">방어구</button>
          <button class="tab" data-cat="acc">장신구</button>
          <button class="tab" data-cat="material">재료</button>
          <button class="tab" data-cat="consumable">소모품</button>
        </div>
      </div>
      <div class="panel__body panel__body--flush fill scroll" id="rlist" data-mgoto="제작"></div>
    </section>

    <!-- 제작 상세 -->
    <div class="cf__c" data-mpane="제작">
      <section class="panel panel--framed">
        <div class="result">
          <div class="result__art" id="r-art"></div>
          <div>
            <div class="flex ac g2">
              <span class="result__nm" id="r-nm"></span>
              <span class="chip" id="r-rar"></span>
              <span class="chip" id="r-src"></span>
            </div>
            <div class="result__meta" id="r-meta"></div>
            <div class="result__stats" id="r-stats"></div>
            <div class="xs t-dim mt2" id="r-effect"></div>
          </div>
        </div>
      </section>

      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">필요 재료</span>
          <span class="panel__meta">보유 / 필요</span></div>
        <div class="panel__body scroll" id="r-mats"></div>
      </section>

      <section class="panel panel--framed">
        <div class="craftbar">
          <div class="flex g4">
            <div><div class="craftbar__k">제작 비용</div>
              <div class="craftbar__v flex ac g1"><svg class="ico ico--sm t-gold"><use href="#i-coin"/></svg><span id="r-cost"></span></div></div>
            <div><div class="craftbar__k">제작 시간</div><div class="craftbar__v" id="r-time"></div></div>
            <div><div class="craftbar__k">요구 제작 숙련</div><div class="craftbar__v" id="r-lv"></div></div>
            <div><div class="craftbar__k">산출</div><div class="craftbar__v" id="r-yield"></div></div>
          </div>
          <div class="qty">
            <button id="q-minus">−</button><input id="q" value="1"><button id="q-plus">+</button>
          </div>
          <button class="btn btn--primary btn--craft" id="do-craft" data-primary>제작</button>
        </div>
      </section>
    </div>

    <!-- 보유 재료 -->
    <div class="flex col g3" style="min-height:0" data-mpane="재료">
      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">재료 보관함</span><span class="panel__meta" id="mcount"></span></div>
        <div class="panel__body panel__body--tight">
          <div class="slotgrid matgrid" id="mgrid"></div>
        </div>
      </section>
      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">재료 정보</span></div>
        <div class="panel__body panel__body--tight" id="minfo">
          <div class="xs t-faint">재료를 선택하면 설명과 획득처가 표시됩니다.</div>
        </div>
      </section>
      <section class="panel panel--framed fill">
        <div class="panel__head"><span class="panel__title">제작 기록</span></div>
        <div class="panel__body panel__body--tight log" id="log">아직 제작 기록이 없습니다.</div>
      </section>
    </div>
  </main>

  <div class="hotbar">
    <a class="hot" href="forge.html"><span class="key">ESC</span>뒤로</a>
    <a class="hot"><span class="key">R</span>재료 정렬</a>
    <span class="hotbar__spacer"></span>
    <span class="hot xs t-ghost">데이터: js/items.js (시트 기준 · 실자료 교체 예정)</span>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/items.js"></script>
<script src="js/ui.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<script>
(function(){
  var T = window.TW_ITEMS, $ = function(s){ return document.querySelector(s); };
  var cat = 'all', cur = null;

  function rarChip(it){ var r=T.RARITY[it.rarity]; return '<span class="chip" style="color:'+r.color+';border-color:'+r.color+'55">'+r.name+'</span>'; }

  function renderList(){
    var rs = T.RECIPE.filter(function(r){ return cat==='all' || r.cat===cat; });
    $('#rcount').textContent = rs.length + ' / ' + T.RECIPE.length;
    $('#rlist').innerHTML = rs.map(function(r){
      var it = T.get(r.result), ok = T.canCraft(r);
      return '<div class="rrow'+(cur&&cur.id===r.id?' is-on':'')+'" data-id="'+r.id+'">'+T.slotHTML(r.result,{noTag:true})+
        '<div><div class="rrow__nm">'+it.name+'</div><div class="rrow__sub">'+T.RARITY[it.rarity].name+' · 숙련 '+r.craftLv+(r.yield?' · ×'+r.yield:'')+'</div></div>'+
        '<span class="rrow__ok '+(ok?'ok':'no')+'">'+(ok?'제작 가능':'재료 부족')+'</span></div>';
    }).join('');
    if (!cur && rs.length) select(rs[0].id);
  }

  function select(id){
    cur = T.RECIPE.filter(function(r){ return r.id===id; })[0]; if(!cur) return;
    var it = T.get(cur.result), r = T.RARITY[it.rarity];
    $('#r-art').innerHTML = '<svg class="ico"><use href="#i-'+it.icon+'"/></svg>';
    $('#r-art').style.color = r.color;
    $('#r-nm').textContent = it.name; $('#r-nm').style.color = r.color;
    $('#r-rar').outerHTML = rarChip(it).replace('class="chip"','class="chip" id="r-rar"');
    $('#r-src').textContent = cur.src==='sheet' ? '시트 수치' : '가안';
    $('#r-meta').textContent = (it.kind?it.kind+' · ':'') + (T.TYPE[it.type]||'') + (it.reqLv?' · 요구 레벨 '+it.reqLv:'') + (it.cp?' · 전투력 '+T.fmt(it.cp):'');
    var s = it.stats||{}, rows=[];
    if(s.atk!=null) rows.push(['기본 공격력',T.fmt(s.atk)]); if(s.atkEx!=null) rows.push(['추가 공격력',T.fmt(s.atkEx)]);
    if(s.def!=null) rows.push(['방어력',T.fmt(s.def)]); if(s.hp!=null) rows.push(['HP',T.fmt(s.hp)]);
    if(s.crit) rows.push(['치명타 확률',s.crit+'%']); if(s.critDmg) rows.push(['치명타 피해',s.critDmg+'%']);
    if(s.skill) rows.push(['스킬 피해 증가',s.skill+'%']); if(s.bleed) rows.push(['출혈 적중',s.bleed]);
    if(it.desc) rows.push(['효과',it.desc]);
    $('#r-stats').innerHTML = rows.map(function(x){ return '<div class="stat"><span class="stat__k">'+x[0]+'</span><span class="stat__v num">'+x[1]+'</span></div>'; }).join('');
    $('#r-effect').innerHTML = it.effect || '';
    $('#r-mats').innerHTML = cur.mats.map(function(m){
      var mi = T.get(m[0]), have = mi.qty||0, ok = have>=m[1];
      return '<div class="matrow">'+T.slotHTML(m[0],{qty:have})+
        '<div><div class="matrow__nm">'+mi.name+'</div><div class="matrow__d">'+T.RARITY[mi.rarity].name+' 재료</div></div>'+
        '<div class="bar bar--gold" style="height:6px"><i class="bar__fill" style="width:'+Math.min(100,have/m[1]*100)+'%"></i></div>'+
        '<div class="matrow__n '+(ok?'ok':'no')+'"><b>'+T.fmt(have)+'</b> <span class="t-faint">/ '+T.fmt(m[1])+'</span></div></div>';
    }).join('');
    $('#r-cost').textContent = T.fmt(cur.cost);
    $('#r-time').textContent = cur.time;
    $('#r-lv').textContent = cur.craftLv + ' / ' + T.PLAYER.craftLv;
    $('#r-yield').textContent = (cur.yield||1) + ' 개';
    $('#do-craft').disabled = !T.canCraft(cur);
    $('#do-craft').classList.toggle('btn--off', !T.canCraft(cur));
    [].forEach.call(document.querySelectorAll('#rlist .rrow'), function(x){ x.classList.toggle('is-on', x.dataset.id===id); });
  }

  function renderMats(){
    var ms = T.MATERIAL;
    $('#mcount').textContent = ms.length + ' / 300';
    $('#mgrid').innerHTML = ms.map(function(m){ return T.slotHTML(m.id); }).join('');
    $('#gold').textContent = T.fmt(T.PLAYER.gold);
  }

  function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },1600); }

  $('#rcat').addEventListener('click', function(e){
    var b=e.target.closest('[data-cat]'); if(!b) return;
    cat=b.dataset.cat; cur=null;
    [].forEach.call(this.children, function(x){ x.classList.toggle('is-on', x===b); });
    renderList();
  });
  $('#rlist').addEventListener('click', function(e){ var r=e.target.closest('[data-id]'); if(r) select(r.dataset.id); });
  $('#mgrid').addEventListener('click', function(e){
    var s=e.target.closest('[data-id]'); if(!s) return;
    var m=T.get(s.dataset.id);
    $('#minfo').innerHTML = '<div class="flex ac g2">'+T.slotHTML(m.id)+'<div><div class="sm t-hi">'+m.name+'</div>'+
      '<div class="xs" style="color:'+T.RARITY[m.rarity].color+'">'+T.RARITY[m.rarity].name+' · 보유 '+T.fmt(m.qty)+'</div></div></div>'+
      '<div class="xs t-faint mt2" style="line-height:1.7">'+m.desc+'</div>';
    [].forEach.call(document.querySelectorAll('#mgrid .slot'), function(x){ x.classList.toggle('is-on', x===s); });
  });
  $('#q-minus').onclick = function(){ var q=$('#q'); q.value=Math.max(1,(+q.value||1)-1); };
  $('#q-plus').onclick  = function(){ var q=$('#q'); q.value=Math.min(99,(+q.value||1)+1); };
  $('#do-craft').onclick = function(){
    if(!cur) return;
    var n=Math.max(1,+$('#q').value||1), made=T.craft(cur,n), it=T.get(cur.result);
    if(!made){ toast('재료가 부족합니다'); return; }
    var log=$('#log'); if(/아직/.test(log.textContent)) log.textContent='';
    log.insertAdjacentHTML('afterbegin','<div><b>'+it.name+'</b> ×'+(made*(cur.yield||1))+' 제작 — '+T.fmt(cur.cost*made)+' G</div>');
    toast(it.name+' 제작 완료');
    renderMats(); renderList(); select(cur.id);
  };
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') location.href='forge.html'; });

  renderMats(); renderList();
})();
</script>
</body>
</html>
