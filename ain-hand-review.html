<!doctype html><html lang="ko"><meta charset="utf-8"><title>아인 손 메시 검수</title>
<style>body{margin:0;background:#182029;color:#eee;font:16px system-ui}header{padding:12px}button,select{padding:8px}#stage{height:80vh}canvas{display:block}</style>
<header>아인 원본 손 메시 / 가역 그립 교정 <select id="side" aria-label="손"><option value="Left">왼손</option><option value="Right">오른손</option></select> <select id="shape" aria-label="그립"><option value="0">원본 손</option><option value="1">닫힌 손 교정</option></select> <select id="view" aria-label="방향"><option value="front">정면</option><option value="back">후면</option><option value="side">바깥쪽</option></select><span id="status">로딩</span></header><div id="stage"></div>
<script type="module">
import * as T from './vendor/three/three.module.js';import{GLTFLoader}from './vendor/three/GLTFLoader.js';import{OrbitControls}from './vendor/three/OrbitControls.js';import{repairAinBind}from './js/ain-bind-repair.js';
const $=id=>document.getElementById(id),scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.001,20),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);$('stage').append(renderer.domElement);scene.background=new T.Color('#26323e');const controls=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x665544,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,3,5);scene.add(light);let report;
function view(){const sg=$('side').value==='Left'?1:-1,p=new T.Vector3(sg*.318,.935,.025);controls.target.copy(p);camera.position.copy(p).add(new T.Vector3(...({front:[0,0,.36],back:[0,0,-.36],side:[sg*.36,0,0]}[$('view').value])));controls.update();}
function size(){const b=$('stage').getBoundingClientRect();renderer.setSize(b.width,b.height);camera.aspect=b.width/b.height;camera.updateProjectionMatrix();}addEventListener('resize',size);size();view();
const asset=await new GLTFLoader().loadAsync('art/3d/ain_anim.glb');scene.add(asset.scene);report=repairAinBind(asset.scene);asset.scene.traverse(o=>{if(o.isMesh)o.material=new T.MeshStandardMaterial({color:0xb7c4d0,roughness:.7,side:T.DoubleSide});});const shafts=[];asset.scene.traverse(o=>{if(/Hand$/.test(o.name)){const side=o.name.includes('Left')?'Left':'Right',slot=o.children.find(c=>c.name.endsWith('HandSlot')),shaft=new T.Mesh(new T.CylinderGeometry(.012,.012,.16,24),new T.MeshStandardMaterial({color:0x44cc88,roughness:.6}));shaft.position.copy(slot.position);shaft.rotation.x=Math.PI/2;o.add(shaft);shafts.push(shaft);}});$('status').textContent='원본 형상 보존 · 녹색: 자루 접촉 기준';
$('side').onchange=view;$('view').onchange=view;$('shape').onchange=()=>{for(const mesh of report.grips)mesh.morphTargetInfluences.fill(+$('shape').value);};
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></html>
