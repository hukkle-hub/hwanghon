<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05060a">
<title>황혼 — 2D 맵 MMORPG 시제품</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:'Noto Sans KR',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;color:#e8dede}
.hud .hit{pointer-events:auto}
.top{position:absolute;left:calc(12px + env(safe-area-inset-left));top:8px;display:flex;gap:10px;align-items:center;font-size:12px}
.face{width:40px;height:40px;border-radius:50%;border:2px solid #a51c1c;background:#1a1b1f center/cover}
.bars{display:grid;gap:3px}.bar{width:150px;height:8px;background:#1b1d24;border:1px solid #3a2a2a}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a1414,#e03a3a)}
.bar.st i{background:linear-gradient(90deg,#8a6a20,#e0c050)}
.zone{position:absolute;right:calc(14px + env(safe-area-inset-right));top:8px;text-align:right;font-size:11px;letter-spacing:.12em;color:#9fd8e8}
.zone b{display:block;font-size:15px;letter-spacing:.06em;color:#fff}
#stick{position:absolute;left:0;bottom:0;width:45%;height:70%}
.ring{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(10,12,18,.35);left:calc(86px + env(safe-area-inset-left));top:calc(100% - 80px)}
.ring i{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.28)}
.btns{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:14px;width:200px;height:160px}
.b{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,12,18,.5);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:#e8dede}
.b:active{background:rgba(165,28,28,.45)}
.b.atk{right:0;bottom:0;width:80px;height:80px;border-color:rgba(255,70,70,.65);color:#ff9a9a;font-size:13px}
.b.s{width:52px;height:52px}
/* 스킬 1~4: 누르면 «장전»(금색) → 공격을 누르면 그 스킬이 나간다 (디렉터 2026-10-07) */
.b.sk{flex-direction:column;gap:0;line-height:1}.b.sk b{font-size:15px}.b.sk em{font-style:normal;font-size:9px;letter-spacing:-.02em;opacity:.8;max-width:50px;white-space:nowrap;overflow:hidden;margin-top:2px}
.b.sk.armed{border-color:#ffcf40;color:#ffe9a8;box-shadow:0 0 0 2px rgba(255,207,64,.35),0 0 14px rgba(255,190,60,.55);background:rgba(60,42,8,.72)}
.b.sk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(6,8,12,.78) calc(var(--p,0)*360deg),transparent 0);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700;color:#fff}
.b.sk .cd[hidden]{display:none}
.b.atk.armed{border-color:#ffcf40;color:#ffe9a8;font-size:12px;box-shadow:0 0 16px rgba(255,190,60,.5)}
.gear{position:absolute;right:calc(14px + env(safe-area-inset-right));top:58px;padding:8px 12px;border:1px solid rgba(255,255,255,.22);background:rgba(10,12,18,.6);font-size:12px;border-radius:4px}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.tag .title{display:block;margin-bottom:1px;color:#ffb071;font-size:9px;font-weight:700;letter-spacing:.06em;text-shadow:0 0 7px rgba(255,55,24,.8),0 1px 2px #000}.tag .title[data-tier="3"]{color:#fff0dc;text-shadow:0 0 9px #ff3a20,0 1px 2px #000}
.tag .prestige{display:inline-block;margin-left:4px;padding:0 3px;border:1px solid rgba(220,110,45,.7);border-radius:2px;color:#ffad62;background:rgba(30,10,5,.82);font-size:8px;line-height:11px;letter-spacing:.03em;text-shadow:0 0 5px rgba(255,90,35,.7),0 1px 2px #000;vertical-align:1px}.tag .prestige[data-tier="2"]{border-color:#e83b27;color:#ff725c;text-shadow:0 0 7px #c21c12,0 1px 2px #000}.tag .prestige[data-tier="3"]{border-color:#ffe4c4;color:#fff5e8;background:rgba(72,12,8,.88);text-shadow:0 0 8px #ff3b24,0 1px 2px #000}
.tag .hp{width:54px;height:4px;margin:2px auto 0;background:#20222a;border:1px solid #000}.tag .hp i{display:block;height:100%;background:#d03838}
.tag.me .hp i{background:#40c060}
#dbg{position:absolute;left:calc(12px + env(safe-area-inset-left));top:56px;font:11px/1.5 monospace;color:#9fd8e8;background:rgba(0,0,0,.45);padding:4px 6px;display:none}
.gatebtn{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:64px;min-width:220px;padding:0 22px;box-sizing:border-box;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(64,216,255,.75);background:rgba(6,18,26,.82);color:#bff2ff;font-size:14px;font-weight:700;letter-spacing:.04em;border-radius:6px;box-shadow:0 0 18px rgba(64,216,255,.25)}
.gatebtn:not([hidden]){display:flex}   /* [hidden] 을 이기지 않게 (CLAUDE.md §1) */
@media (orientation:portrait){ .gatebtn{bottom:calc(196px + env(safe-area-inset-bottom))} }   /* 세로: 스틱·공격 단추 위로 */
.gatebtn.dg{border-color:rgba(255,96,64,.8);color:#ffd2c4;background:rgba(26,8,6,.85);box-shadow:0 0 18px rgba(255,80,48,.3)}
.gatebtn small{display:block;font-size:10px;font-weight:500;opacity:.7;letter-spacing:.1em}
#boss{position:absolute;left:50%;top:6px;transform:translateX(-50%);text-align:center;color:#ffb0a0;font-size:10px;letter-spacing:.2em;text-shadow:0 0 8px #000;white-space:nowrap}   /* 작게 — 보스는 대개 화면 위쪽에 있다(가리면 안 된다) */
#boss b{display:inline;font-size:14px;letter-spacing:.08em;color:#fff;margin:0 6px;text-shadow:0 0 12px #a51c1c,0 1px 2px #000}
@media (orientation:portrait){ #boss{top:104px} .hud #ann{top:132px} }   /* 세로: 캐릭터·지역·보스 이름이 윗줄에서 겹치지 않게 */
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(120,8,8,.55) 100%)}
#hurtfx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(220,40,20,0) 44%,rgba(220,32,20,.72) 100%);mix-blend-mode:screen}
#death{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);min-width:260px;padding:18px 28px;text-align:center;border-top:1px solid rgba(255,72,48,.7);border-bottom:1px solid rgba(255,72,48,.7);background:linear-gradient(90deg,rgba(18,2,2,0),rgba(18,2,2,.9) 20%,rgba(18,2,2,.9) 80%,rgba(18,2,2,0));color:#d8b8b0;letter-spacing:.12em;font-size:12px;text-shadow:0 1px 3px #000;z-index:8}
#death b{display:block;margin-bottom:5px;color:#ff5a42;font-size:22px;letter-spacing:.18em}#death span{color:#fff;font-weight:700}
#dark{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0}
/* 필드 보스 (docs/design/188) — 서버 전체 알림 · 피해 숫자 · 바닥 장비 빛기둥 · 줍기 단추 */
#ann{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5}
#ann div{padding:6px 16px;background:linear-gradient(90deg,rgba(20,4,4,0),rgba(20,4,4,.86) 18%,rgba(20,4,4,.86) 82%,rgba(20,4,4,0));color:#f2dcd6;font-size:13px;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 2px #000;transition:opacity .6s}
#ann div b{color:#ff6a50;margin:0 4px}#ann div.legend b{color:#f0b040}#ann div.myth b{color:#ff4030;text-shadow:0 0 10px #ff2010}
#ann div.big{font-size:16px;padding:8px 22px;border-top:1px solid rgba(255,90,60,.5);border-bottom:1px solid rgba(255,90,60,.5)}
@media (max-height:500px){ #ann{top:34px;gap:2px} #ann div{font-size:11px;padding:4px 12px} #ann div.big{font-size:13px;padding:5px 16px} }   /* 휴대폰 가로 — 세 줄이 이름표를 덮었다 */
.dmg{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:15px;color:#ffe2c8;text-shadow:0 0 3px #000,0 1px 2px #000;pointer-events:none;white-space:nowrap}
.dmg.crit{font-size:21px;color:#ffcf40;text-shadow:0 0 8px #ff6010,0 1px 2px #000}
.dmg.taken{font-size:18px;color:#ff6b52;text-shadow:0 0 8px #b01008,0 1px 2px #000}.dmg.evade{font-size:14px;color:#7ee8ff;text-shadow:0 0 8px #1680a0,0 1px 2px #000}
.tag.loot{font-size:12px;letter-spacing:.04em}.tag.loot small{display:block;font-size:9px;opacity:.75;font-weight:500}
.gatebtn.loot{border-color:rgba(240,176,64,.85);color:#ffe6b8;background:rgba(26,18,4,.86);box-shadow:0 0 18px rgba(240,170,60,.3);bottom:calc(90px + env(safe-area-inset-bottom))}
@media (orientation:portrait){ .gatebtn.loot{bottom:calc(270px + env(safe-area-inset-bottom))} }
/* 사냥터 하위 구역 이름 (docs/design/190 §4 — 리니지처럼 들어서면 가운데에 지역 이름) */
#areaName{position:absolute;left:50%;top:63%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;color:#f0e2d0;text-shadow:0 0 10px #000,0 1px 2px #000;white-space:nowrap}
#areaName b{display:block;font-size:22px;letter-spacing:.12em;font-weight:800}#areaName small{display:block;font-size:11px;letter-spacing:.08em;opacity:.8;margin-top:2px}
#areaName.d2 b{color:#ffb070}#areaName.d3 b{color:#ff6a50}#areaName.rest b{color:#9fe0b0}
@media (max-height:500px){ #areaName b{font-size:18px} }
/* 미니맵 (docs/design/190 §5) — 넓은 필드에서 내 자리·문·사람. 누르면 크게(구역 이름) */
#mini{position:absolute;left:calc(12px + env(safe-area-inset-left));top:58px;width:132px;border:1px solid rgba(201,164,94,.55);background:#140c10 center/100% 100% no-repeat;box-shadow:0 0 8px rgba(0,0,0,.6);overflow:hidden;cursor:pointer}
#mini.big{left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,calc(78vh * var(--ar)));z-index:6}
#mini i{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#ffb070;pointer-events:none}
#mini i.me{width:8px;height:8px;margin:-4px 0 0 -4px;background:#5fe0ff;box-shadow:0 0 6px #5fe0ff;z-index:2}
#mini i.gt{border-radius:1px;background:#40b8e8}#mini i.gt.dg{background:#ff6040}
#mini span{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:#f0e2d0;text-shadow:0 0 4px #000,0 1px 2px #000;white-space:nowrap;display:none;pointer-events:none}
#mini.big span{display:block}#mini span.d2{color:#ffb070}#mini span.d3{color:#ff6a50}#mini span.rest{color:#9fe0b0}
/* 전국 지도 (docs/design/192) — 실제 지형 음영 위의 지역. 만든 곳 금색 · 계획 흐림 · 지금 하늘색. 누르면 길잡이 빠른 이동 */
.gear.wm{top:100px}
#world{position:fixed;inset:0;z-index:20;background:rgba(6,8,12,.94);display:flex;align-items:center;justify-content:center}
#world[hidden]{display:none}
#world .wmap{position:relative;height:min(92vh,calc(96vw * var(--ar)));aspect-ratio:var(--ar0);background:center/100% 100% no-repeat}
#world .wx{position:absolute;right:calc(14px + env(safe-area-inset-right));top:10px;min-width:64px;min-height:44px;padding:0 14px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,18,.8);color:#eee;font-size:14px;border-radius:6px}
#world .wt{position:absolute;left:calc(14px + env(safe-area-inset-left));top:12px;color:#f0e2d0;font-size:15px;font-weight:800;letter-spacing:.1em;text-shadow:0 1px 3px #000}
#world .wt small{display:block;font-size:10px;font-weight:500;letter-spacing:.04em;opacity:.7;margin-top:2px}
#world .rg{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#55534e;border:1px solid #000;cursor:pointer}
#world .rg.built{background:#ffcf40;width:13px;height:13px;box-shadow:0 0 8px rgba(255,200,60,.7)}
#world .rg.hub{border-radius:2px}
#world .rg.here{background:#5fe0ff;box-shadow:0 0 12px #5fe0ff}
#world .rg::after{content:'';position:absolute;inset:-14px}   /* 손가락으로 누르기 쉽게 */
#world .rn{position:absolute;font-size:11px;color:#bbb;white-space:nowrap;text-shadow:0 0 3px #000,0 1px 2px #000;pointer-events:none;line-height:1.15}
#world .rn.built{color:#ffe9b0;font-weight:700;font-size:12px}#world .rn small{opacity:.75;margin-left:3px;font-weight:500}
#world .rn.off{display:none}
#world .rn em.own{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em}#world .rn em.own.boss{color:#ff7a60}#world .rn em.own.guild{color:#7fe0c0}
.tag.gt.siege{color:#c8f0e0}.tag.gt.siege.boss{color:#ffb0a0}
#world .rg.clu{width:18px;height:18px;background:#ffcf40;border:2px solid #2a1c04;box-shadow:0 0 10px rgba(255,200,60,.8);color:#2a1c04;font:800 10px/14px sans-serif;text-align:center}
#world .rg.clu.here{background:#5fe0ff}
#world .wgo{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:56px;min-width:240px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(240,176,64,.85);background:rgba(26,18,4,.92);color:#ffe6b8;font-size:14px;font-weight:700;border-radius:8px}
#world .wgo[hidden]{display:none}
#world .wgo .wz{min-height:48px;min-width:64px;padding:0 10px;border:1px solid rgba(240,176,64,.6);background:rgba(60,40,8,.9);color:#ffe6b8;font:700 13px sans-serif;border-radius:6px}
#world .wgo .wz.here{border-color:#5fe0ff;color:#bff3ff}
#world .wgo.multi{flex-wrap:wrap;padding:8px;gap:6px;max-width:calc(100vw - 28px)}
@media (orientation:landscape){ #world .wt{max-width:calc(50vw - 46vh - 24px)} #world .wgo{left:auto;right:calc(14px + env(safe-area-inset-right));transform:none;min-width:0;max-width:calc(50vw - 46vh - 28px);flex-direction:column;align-items:stretch;text-align:center} #world .wgo.multi{max-width:calc(50vw - 46vh - 28px)} }
/* ---------- 가방 · 상점 · 창고 (문서 198) ---------- */
.gear.bagb{top:142px}.gear.bagb.safe{border-color:rgba(120,230,190,.75);color:#bff5e2;box-shadow:0 0 12px rgba(80,220,170,.35)}
.b.pot{right:156px;bottom:2px;border-color:rgba(255,110,110,.5);flex-direction:column;gap:0;line-height:1;color:#ffd0d0}.b.pot b{font-size:11px}.b.pot em{font-style:normal;font-size:10px;opacity:.85;margin-top:2px}.b.pot.none{opacity:.45}
#bag{position:fixed;inset:0;z-index:21;background:rgba(4,6,10,.72);display:flex;align-items:center;justify-content:center}
#bag[hidden]{display:none}
#bag .bp{width:min(780px,calc(100vw - 20px));height:min(560px,calc(100dvh - 16px));display:flex;flex-direction:column;background:linear-gradient(#1a1714,#100e0c);border:1px solid #5a4a32;border-radius:8px;box-shadow:0 10px 40px #000;color:#e8dede;overflow:hidden}
#bag .bh{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-bottom:1px solid #3a3024;flex:none}
#bag .bh>b{font-size:16px;letter-spacing:.12em;color:#f0e2d0}
#bag .gold{font-size:13px;color:#ffd77a;font-weight:700}
#bag .safe{font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(40,120,90,.35);color:#9ff0d0}#bag .safe.no{background:rgba(120,40,30,.35);color:#ffb4a0}
#bag .bx{margin-left:auto;min-width:64px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-size:14px}
#bag .btabs{display:flex;gap:4px;padding:6px 8px;flex:none;overflow-x:auto}
#bag .btabs button{flex:1 0 auto;min-width:64px;min-height:44px;border:1px solid #4a3e2c;background:#1f1a14;color:#cbbba0;font:700 13px sans-serif;border-radius:6px}
#bag .btabs button.on{background:#4a3818;border-color:#c99a40;color:#ffe6b0}
#bag .btabs button:disabled{opacity:.35}
#bag .bbody{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 8px}
#bag .eqrow{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 8px;border-bottom:1px dashed #3a3024;margin-bottom:8px}
#bag .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
#bag .it{position:relative;min-height:76px;border:1px solid #3a3226;border-left:3px solid var(--rc,#6e7078);background:#16130f;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px 2px 4px;overflow:hidden}
#bag .eqrow .it{width:68px;flex:none}
#bag .it.sel{outline:2px solid #ffcf40;background:#2a2112}
#bag .it img{width:40px;height:40px;object-fit:contain;margin-bottom:2px}
#bag .it .ph{width:40px;height:40px;display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--rc);margin-bottom:2px}
#bag .it b{font-size:10px;font-weight:600;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bag .it i{position:absolute;right:4px;top:3px;font-style:normal;font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 3px #000}
#bag .it u{position:absolute;left:4px;top:3px;text-decoration:none;font-size:9px;font-weight:800;padding:1px 3px;border-radius:3px;background:#c99a40;color:#1a1206}
#bag .it.empty{opacity:.4;border-style:dashed}
#bag .it small{font-size:10px;color:#ffd77a;font-weight:700}
#bag .empty-msg{padding:28px 10px;text-align:center;color:#9a8e7c;font-size:13px;line-height:1.6}
#bag .bdet{flex:none;border-top:1px solid #3a3024;padding:8px 10px;display:flex;gap:10px;align-items:center;min-height:64px;background:#14110e}
#bag .bdet .tx{flex:1;min-width:0;font-size:12px;line-height:1.4}
#bag .bdet .tx b{font-size:14px}#bag .bdet .tx span{color:#a89c88}
#bag .bdet .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#bag .bdet button{min-width:64px;min-height:44px;padding:0 12px;border:1px solid #c99a40;background:#3a2a10;color:#ffe6b0;font:700 13px sans-serif;border-radius:6px}
#bag .bdet button.sub{border-color:#5a5048;background:#221d18;color:#d8ccb8}
@media (orientation:portrait){ #bag .bp{height:min(780px,calc(100dvh - 16px))} #bag .bdet{flex-direction:column;align-items:stretch} #bag .bdet .acts{justify-content:stretch} #bag .bdet button{flex:1} }
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);padding:8px 14px;background:rgba(0,0,0,.7);color:#e8dede;font-size:13px;border-radius:4px}
.tag.gt{color:#bff2ff;font-size:12px;letter-spacing:.06em}.tag.gt.dg{color:#ffc0b0}
.tag.bs{color:#ff8a7a;font-size:13px}.tag.bs small{display:block;font-size:10px;color:#e8c0b8;font-weight:500}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#05060a;color:#c9a45e;letter-spacing:.3em;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>

/* 황혼 2D 맵 MMORPG 시제품 (docs/design/185 §6, 디렉터 2026-10-06 «LoL 와일드리프트를 MMORPG 로»)

import { contactOf } from './js/mmo/field-feel.js';   /* 손맛 — 접점 시각·히트스톱·궤적·불꽃 (문서 205) */
const q=new URLSearchParams(location.search), ME=['ain','kain','ryu','sera'].includes(q.get('char'))?q.get('char'):'ain', ZOOM=+(q.get('zoom')||1), DEBUG=q.get('debug')==='1';
const PARTY_DEFAULT='hwanghon-party.onrender.com';
/* 맵을 받는 동안 파티 서버를 미리 깨운다 — 잠든 Render 는 첫 요청에 30초쯤 걸린다 */
if(q.get('online')!=='0'&&!q.has('offline')&&!q.get('server')&&/\.github\.io$/.test(location.hostname)) fetch('https://'+PARTY_DEFAULT+'/healthz',{ mode:'no-cors', cache:'no-store' }).catch(()=>{});
const MOBILE=matchMedia('(pointer:coarse)').matches, REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 휴대폰은 가벼운 모델(art/3d/lod, tools/2d/make-lod.mjs — 삼각형 약 1/4, 텍스처 512 webp). ?lod=0|1 로 강제 */

/* 카메라는 타일을 놓은 면(P·D = −L)보다 뒤에 있어야 한다 — 실제 공간 맵은 L=200 이라 150 m 에서는 타일이 카메라 뒤로 잘렸다 */
const CAM_BACK=meta.L+150, cam=new THREE.OrthographicCamera(-1,1,1,-1,1,CAM_BACK+meta.far+100); cam.up.copy(U);
const VIEW_H=5.6/ZOOM;     /* 화면 높이(그림 면 m). 55° 에서 1.7 m 인물이 그림 면 0.98 m → 화면 높이의 약 18% (와일드리프트 약 12%보다 크게 — 장비가 보여야 한다) */
let viewW=VIEW_H;
let viewH=VIEW_H;

function resize(){ renderer.setSize(innerWidth,innerHeight,false); const a=innerWidth/innerHeight; if(a>=1){ viewH=VIEW_H; viewW=VIEW_H*a; } else { viewW=VIEW_H*(a<.75?1.14:1); viewH=viewW/a; } cam.left=-viewW/2; cam.right=viewW/2; cam.top=viewH/2; cam.bottom=-viewH/2; cam.updateProjectionMatrix(); }
resize(); addEventListener('resize',resize);
function follow(p){ /* 그림 범위 밖이 보이지 않게 그림 좌표에서 자른다 */
  let u=p.x*R.x+(p.y+0.9)*R.y+p.z*R.z, v=p.x*U.x+(p.y+0.9)*U.y+p.z*U.z;

const map=await createMap(THREE, scene, meta, 'maps/2d/'+ZONE+'/', cam);
/* ---------- 캐릭터 빛: 맵에 구운 빛과 같은 자리 ---------- */
/* 맵에 구운 빛과 맞춘다: 황혼 하늘빛 + 낮게 깔린 노을(해 방향은 맵 굽기가 정한 것) */
/* 던전(지하): 형광등 아래 — 차고 어둡게. 구운 맵(env-dungeon)의 반구광 0x9ab0c0/0x1a1816 과 같은 색 */
scene.add(DUNGEON?new THREE.HemisphereLight(0x9ab0c0,0x1a1816,1.3):meta.sky?new THREE.HemisphereLight(0xb08ac0,0x3a2428,1.6):new THREE.HemisphereLight(0x5a6488,0x140c10,0.9));
const key=new THREE.DirectionalLight(meta.sun?meta.sun.color:0xfff0e0,DUNGEON?1.8:meta.sun?3.2:2.4); if(meta.sun) key.position.set(meta.sun.dir[0]*10,Math.max(4,meta.sun.dir[1]*10),meta.sun.dir[2]*10); else key.position.set(-4,9,6); scene.add(key);
if(meta.sun){ const front=new THREE.DirectionalLight(DUNGEON?0xdff4ff:0xffe8d8,DUNGEON?0.9:1.4); front.position.set(-3,9,8); scene.add(front); }   /* 노을이 등 뒤일 때도 얼굴이 보이게 */
const rimR=new THREE.DirectionalLight(0xff3a3a,2.6); rimR.position.set(6,4,-6); scene.add(rimR);
const rimC=new THREE.DirectionalLight(0x40d8ff,2.0); rimC.position.set(-6,4,-5); scene.add(rimC);
/* 간판·가로등 빛 — 개수가 바뀌면 셰이더를 다시 짜므로 4개를 두고 가까운 것으로 옮긴다 */
const near=[0,1,2,3].map(()=>{ const L=new THREE.PointLight(0xffffff,0,8,1.6); scene.add(L); return L; });
function nearLights(p){ const s=meta.lights.map(l=>[l,(l.x-p.x)**2+(l.z-p.z)**2]).sort((a,b)=>a[1]-b[1]);
  near.forEach((L,i)=>{ const l=s[i][0]; L.position.set(l.x,l.y,l.z); L.color.set(l.color); L.intensity=l.intensity*0.8; L.distance=l.distance; }); }
/* ---------- 발밑 그림자 (맵은 그림이라 실시간 그림자가 없다) ---------- */
const blobTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,4,64,64,62); gr.addColorStop(0,'rgba(0,0,0,.75)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
/* 물에 잠긴 곳(던전): 그림자 대신 발 둘레 물결 — 물이 허리까지라 발밑은 안 보인다 */
const rippleTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); for(const [r,a] of [[58,.55],[44,.35],[30,.2]]){ g.strokeStyle='rgba(190,235,245,'+a+')'; g.lineWidth=3; g.beginPath(); g.arc(64,64,r,0,Math.PI*2); g.stroke(); } return new THREE.CanvasTexture(c); })();
const FLOOR=meta.water?meta.water.y:0;
/* 물면: 구운 그림에는 물이 없다(바닥 높이 0) — 여기서 반투명하게 그려 물 밑 다리가 비쳐 보이게 한다.
   깊이 시험을 켜 두면 물면보다 아래 있는 다리만 물빛을 덮어쓰고, 위는 그대로 (docs/design/185 §6.6) */
let waterMesh=null;
if(meta.water){ const wt=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); g.fillStyle='#1a3a42'; g.fillRect(0,0,256,256);
    for(let i=0;i<70;i++){ g.strokeStyle='rgba(150,220,230,'+(0.05+Math.random()*0.12)+')'; g.lineWidth=1+Math.random()*2; const x0=Math.random()*256, y0=Math.random()*256, r=8+Math.random()*30; for(const ox of [-256,0,256]) for(const oy of [-256,0,256]){ g.beginPath(); g.ellipse(x0+ox,y0+oy,r,r*0.45,0,0,Math.PI*2); g.stroke(); } }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(160,160); t.colorSpace=THREE.SRGBColorSpace; return t; })();
  waterMesh=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshBasicMaterial({ map:wt, transparent:true, opacity:0.5, depthWrite:false }));
  waterMesh.rotation.x=-Math.PI/2; waterMesh.position.y=meta.water.y; waterMesh.renderOrder=2; scene.add(waterMesh); }
/* 안개 (여의도 «가시거리 스무 걸음») — 무릎 높이 반투명 층. 물과 같은 원리: 그 아래 다리만 뿌옇게 */
let mistMesh=null;

    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(60,60); t.colorSpace=THREE.SRGBColorSpace; return t; })();

/* ---------- 영웅 ---------- */
const loader=new GLTFLoader();
if(LOD){ const raw=loader.load.bind(loader); loader.load=(u,...a)=>raw(String(u).replace(/^art\/3d\/gear\/(?!w_red_tension)/,'art/3d/lod/gear/').replace(/^art\/3d\/(ain|kain|ryu|sera)_anim\.glb/,'art/3d/lod/$1_anim.glb'),...a); }

/* 온라인 외형은 서버 장착 장비가 권위다. 옛 데모 프리셋(look)은 키에 넣지 않는다 — 반복 패킷으로 같은 GLB를 다시 만들 수 없다. */

/* 영웅별 기본 장비 + 갈아입을 세트 (장비가 그대로 보이는지 — 문서 185 §4.1) */

  { head:'a_sluice_helm', chest:'a_sluice_cuirass', legs:'a_sluice_greaves', gloves:'a_sluice_gauntlet', boots:'a_sluice_boots' },

  window.TW_HAIR&&TW_HAIR.sync(h.root, eq); TW_LOOKS.attach(THREE, loader, h.root, eq, { charId:h.id, reduced:REDUCED, onMain:wr=>{ h.weapon=wr; }, prepareMain:(model,spec)=>h.id==='ain'&&spec.glb==='art/3d/ain_scythe_tex.glb'?mountAinScythe(model):null,   /* 솔로와 같은 낫 장착: 자루를 손 축에 맞추고 날 시작·끝 표식을 단다 — 궤적이 자루가 아니라 날을 따른다 */

  let b=null; for(const o of bosses){ const bx=o.root?.position.x??o.b.x,bz=o.root?.position.z??o.b.z,d=Math.hypot(bx-p.x,bz-p.z); if(d<o.b.r) b=o;

let hold=false, dtCap=0.05;   /* 검수용: 찍는 동안 게임 시간을 멈춘다 (__MMO.hold) — 스크린샷 한 장에 헤드리스 몇 프레임이 지나간다. __MMO.dtCap=1/60 이면 헤드리스에서도 60 fps 의 한 걸음씩 (궤적 모양 확인) */
function tick(){ const dt=hold?(clock.getDelta(),0):Math.min(clock.getDelta(),dtCap); frames++; if(frames%4===0) skFrame(); skBuffFx(dt);
  let ix=input.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0), iy=input.y+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);

  if(REDUCED) shakeT=0;

  heroes.forEach(tagPos); gateFx.forEach(f=>tagAt(f.tag,f.g.x,FLOOR+3.2,f.g.z)); if(siegeFx&&hubOwner) tagAt(siegeFx.tag,SIEGE.circle[0],FLOOR+3.3,SIEGE.circle[1]); bosses.forEach(o=>{ if(o.tag){ if(o===inBoss||!o.alive)o.tag.style.display='none';else tagAt(o.tag,o.root?.position.x??o.b.x,(o.b.fly||0)+(o.h||3)+0.4,o.root?.position.z??o.b.z); } });

renderer.info.autoReset=true;
window.__MMO={ get frames(){ return frames; }, get me(){ return me; }, heroes, cam, renderer, map, scene, info(){ renderer.render(scene,cam); const i=renderer.info.render; return { calls:i.calls, triangles:i.triangles }; },

  feel, get hold(){ return hold; }, set hold(v){ hold=!!v; }, set dtCap(v){ dtCap=Math.max(0.001,Math.min(0.05,+v||0.05)); }, teleport(x,z,yaw){ me.root.position.set(x,0,z); if(yaw!=null){ me.yaw=yaw; me.root.rotation.y=yaw; } }, toRoad, fromRoad, set:nextSet, meta, get net(){ return net; }, remotes };
