<!doctype html>
<html lang="ko">
<head>

<title>황혼 — 2D 맵 MMORPG 시제품</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:'Noto Sans KR',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;color:#e8dede}
.hud .hit{pointer-events:auto}
.top{position:absolute;left:calc(12px + env(safe-area-inset-left));top:8px;display:flex;gap:10px;align-items:center;font-size:12px}
.face{width:40px;height:40px;border-radius:50%;border:2px solid #a51c1c;background:#1a1b1f center/cover}
.bars{display:grid;gap:3px}.bar{width:150px;height:8px;background:#1b1d24;border:1px solid #3a2a2a}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a1414,#e03a3a)}
.bar.st i{background:linear-gradient(90deg,#8a6a20,#e0c050)}
.zone{position:absolute;right:calc(14px + env(safe-area-inset-right));top:8px;text-align:right;font-size:11px;letter-spacing:.12em;color:#9fd8e8}
.zone b{display:block;font-size:15px;letter-spacing:.06em;color:#fff}
#stick{position:absolute;left:0;bottom:0;width:45%;height:70%}
.ring{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(10,12,18,.35);left:calc(86px + env(safe-area-inset-left));top:calc(100% - 80px)}
.ring i{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.28)}
.btns{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:14px;width:200px;height:160px}
.b{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,12,18,.5);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:#e8dede}
.b:active{background:rgba(165,28,28,.45)}
.b.atk{right:0;bottom:0;width:80px;height:80px;border-color:rgba(255,70,70,.65);color:#ff9a9a;font-size:13px}
.b.s{width:52px;height:52px}
.gear{position:absolute;right:calc(14px + env(safe-area-inset-right));top:58px;padding:8px 12px;border:1px solid rgba(255,255,255,.22);background:rgba(10,12,18,.6);font-size:12px;border-radius:4px}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.tag .hp{width:54px;height:4px;margin:2px auto 0;background:#20222a;border:1px solid #000}.tag .hp i{display:block;height:100%;background:#d03838}
.tag.me .hp i{background:#40c060}
#dbg{position:absolute;left:calc(12px + env(safe-area-inset-left));top:56px;font:11px/1.5 monospace;color:#9fd8e8;background:rgba(0,0,0,.45);padding:4px 6px;display:none}
.gatebtn{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:64px;min-width:220px;padding:0 22px;box-sizing:border-box;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(64,216,255,.75);background:rgba(6,18,26,.82);color:#bff2ff;font-size:14px;font-weight:700;letter-spacing:.04em;border-radius:6px;box-shadow:0 0 18px rgba(64,216,255,.25)}
.gatebtn:not([hidden]){display:flex}   /* [hidden] 을 이기지 않게 (CLAUDE.md §1) */
@media (orientation:portrait){ .gatebtn{bottom:calc(196px + env(safe-area-inset-bottom))} }   /* 세로: 스틱·공격 단추 위로 */
.gatebtn.dg{border-color:rgba(255,96,64,.8);color:#ffd2c4;background:rgba(26,8,6,.85);box-shadow:0 0 18px rgba(255,80,48,.3)}
.gatebtn small{display:block;font-size:10px;font-weight:500;opacity:.7;letter-spacing:.1em}
#boss{position:absolute;left:50%;top:6px;transform:translateX(-50%);text-align:center;color:#ffb0a0;font-size:10px;letter-spacing:.2em;text-shadow:0 0 8px #000;white-space:nowrap}   /* 작게 — 보스는 대개 화면 위쪽에 있다(가리면 안 된다) */
#boss b{display:inline;font-size:14px;letter-spacing:.08em;color:#fff;margin:0 6px;text-shadow:0 0 12px #a51c1c,0 1px 2px #000}
#boss .hp{width:200px;height:5px;margin:3px auto 0;background:#1b1012;border:1px solid #5a1c1c}#boss .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a1414,#ff4a3a)}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(120,8,8,.55) 100%)}
#dark{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);padding:8px 14px;background:rgba(0,0,0,.7);color:#e8dede;font-size:13px;border-radius:4px}
.tag.gt{color:#bff2ff;font-size:12px;letter-spacing:.06em}.tag.gt.dg{color:#ffc0b0}
.tag.bs{color:#ff8a7a;font-size:13px}.tag.bs small{display:block;font-size:10px;color:#e8c0b8;font-weight:500}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#05060a;color:#c9a45e;letter-spacing:.3em;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">
  <div class="top"><div class="face" id="face"></div><div><b id="who">아인 · Lv 8</b><div class="bars"><div class="bar"><i id="hpb" style="width:86%"></i></div><div class="bar st"><i style="width:64%"></i></div></div></div></div>
  <div class="zone"><span id="place">강남대로 · 강남역</span><b id="risk">위험 B</b><span id="net" style="display:block;margin-top:2px;color:#c9a45e">오프라인</span></div>
  <div id="dbg"></div>
  <div id="osm" style="position:absolute;left:calc(8px + env(safe-area-inset-left));bottom:4px;font-size:9px;color:rgba(255,255,255,.45)">지도 데이터 © OpenStreetMap contributors</div>
  <div class="gear hit" id="gearBtn">장비 바꾸기</div>
  <div id="boss" hidden></div>
  <div id="toast" hidden></div>

  <div class="btns hit"><div class="b atk" id="atk">공격</div>
    <div class="b s" style="right:96px;bottom:2px" id="dodge">회피</div><div class="b s" style="right:88px;bottom:62px">1</div>
    <div class="b s" style="right:44px;bottom:100px">2</div><div class="b s" style="right:-6px;bottom:108px">3</div></div>
</div>
<div id="dark"></div><div id="vig"></div>
<div id="load">강남대로로 나가는 중…</div>

<script src="js/save.js"></script>
<script src="js/gear.js"></script>
<script src="js/looks.js"></script>
<script src="js/hair.js"></script>
<script src="js/pose-fix.js"></script>
<script src="js/mat-fix.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<script type="module">
/* 황혼 2D 맵 MMORPG 시제품 (docs/design/185 §6, 디렉터 2026-10-06 «LoL 와일드리프트를 MMORPG 로»)
   맵 = 구운 2D 그림(색 + 깊이) · 캐릭터 = 실시간 3D(장비가 입은 그대로) · 카메라 = 고정 내려다보기 55°, 회전 없음.
   ?char=ain|kain|ryu|sera · ?zoom=1 · ?debug=1 · ?online=1 (이 페이지를 서빙한 파티 서버) · ?server=<주소> (GitHub Pages 에서 파티 서버로) */
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/GLTFLoader.js';
import * as SkeletonUtils from './vendor/three/SkeletonUtils.js';
import { createBloom } from './js/bloom.js';
import { basis, createMap } from './js/mmo/map2d.js';
const q=new URLSearchParams(location.search), ME=['ain','kain','ryu','sera'].includes(q.get('char'))?q.get('char'):'ain', ZOOM=+(q.get('zoom')||1), DEBUG=q.get('debug')==='1';
const MOBILE=matchMedia('(pointer:coarse)').matches;
/* 휴대폰은 가벼운 모델(art/3d/lod, tools/2d/make-lod.mjs — 삼각형 약 1/4, 텍스처 512 webp). ?lod=0|1 로 강제 */
const LOD=q.has('lod')?q.get('lod')==='1':MOBILE;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:!MOBILE,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,devicePixelRatio)); renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.35;
const scene=new THREE.Scene();
/* 지역: 실제 공간 맵(OSM 실측, 문서 185 §6.5). ?zone=<id> */
const ZONE=/^[a-z0-9_-]{1,24}$/.test(q.get('zone')||'')?q.get('zone'):'gangnam';
const meta=await (await fetch('maps/2d/'+ZONE+'/map.json')).json();
meta.gates=meta.gates||[]; meta.bosses=meta.bosses||[]; const DUNGEON=meta.kind==='dungeon';
document.getElementById('load').textContent=(meta.title||'강남대로')+' — 들어가는 중…';
document.getElementById('risk').textContent=DUNGEON?'위험 A · 던전':'위험 B';
scene.background=new THREE.Color(meta.sky?meta.sky.fog:0x05060a);
const {R,U,D}=basis(THREE, meta.pitch), T=meta.tile/meta.pxPerM;
const MAP={ u0:meta.u0, u1:meta.u0+meta.cols*T, v0:meta.v1-meta.rows*T, v1:meta.v1 };
/* ---------- 카메라 ---------- */
/* 카메라는 타일을 놓은 면(P·D = −L)보다 뒤에 있어야 한다 — 실제 공간 맵은 L=200 이라 150 m 에서는 타일이 카메라 뒤로 잘렸다 */
const CAM_BACK=meta.L+150, cam=new THREE.OrthographicCamera(-1,1,1,-1,1,CAM_BACK+meta.far+100); cam.up.copy(U);
const VIEW_H=5.6/ZOOM;     /* 화면 높이(그림 면 m). 55° 에서 1.7 m 인물이 그림 면 0.98 m → 화면 높이의 약 18% (와일드리프트 약 12%보다 크게 — 장비가 보여야 한다) */
let viewW=VIEW_H;
let viewH=VIEW_H;
/* 짧은 변이 VIEW_H 를 덮는다 — 세로 화면에서 인물이 화면을 꽉 채우지 않게 */
function resize(){ renderer.setSize(innerWidth,innerHeight,false); const a=innerWidth/innerHeight; if(a>=1){ viewH=VIEW_H; viewW=VIEW_H*a; } else { viewW=VIEW_H; viewH=VIEW_H/a; } cam.left=-viewW/2; cam.right=viewW/2; cam.top=viewH/2; cam.bottom=-viewH/2; cam.updateProjectionMatrix(); }
resize(); addEventListener('resize',resize);
function follow(p){ /* 그림 범위 밖이 보이지 않게 그림 좌표에서 자른다 */
  let u=p.x*R.x+(p.y+0.9)*R.y+p.z*R.z, v=p.x*U.x+(p.y+0.9)*U.y+p.z*U.z;
  u=Math.min(MAP.u1-viewW/2,Math.max(MAP.u0+viewW/2,u)); v=Math.min(MAP.v1-viewH/2,Math.max(MAP.v0+viewH/2,v));
  cam.position.copy(R).multiplyScalar(u).addScaledVector(U,v).addScaledVector(D,-CAM_BACK); cam.lookAt(cam.position.clone().add(D)); cam.updateMatrixWorld(); }
/* ---------- 2D 맵 ---------- */
const map=await createMap(THREE, scene, meta, 'maps/2d/'+ZONE+'/', cam);
/* ---------- 캐릭터 빛: 맵에 구운 빛과 같은 자리 ---------- */
/* 맵에 구운 빛과 맞춘다: 황혼 하늘빛 + 낮게 깔린 노을(해 방향은 맵 굽기가 정한 것) */
/* 던전(지하): 형광등 아래 — 차고 어둡게. 구운 맵(env-dungeon)의 반구광 0x9ab0c0/0x1a1816 과 같은 색 */
scene.add(DUNGEON?new THREE.HemisphereLight(0x9ab0c0,0x1a1816,1.3):meta.sky?new THREE.HemisphereLight(0xb08ac0,0x3a2428,1.6):new THREE.HemisphereLight(0x5a6488,0x140c10,0.9));
const key=new THREE.DirectionalLight(meta.sun?meta.sun.color:0xfff0e0,DUNGEON?1.8:meta.sun?3.2:2.4); if(meta.sun) key.position.set(meta.sun.dir[0]*10,Math.max(4,meta.sun.dir[1]*10),meta.sun.dir[2]*10); else key.position.set(-4,9,6); scene.add(key);
if(meta.sun){ const front=new THREE.DirectionalLight(DUNGEON?0xdff4ff:0xffe8d8,DUNGEON?0.9:1.4); front.position.set(-3,9,8); scene.add(front); }   /* 노을이 등 뒤일 때도 얼굴이 보이게 */
const rimR=new THREE.DirectionalLight(0xff3a3a,2.6); rimR.position.set(6,4,-6); scene.add(rimR);
const rimC=new THREE.DirectionalLight(0x40d8ff,2.0); rimC.position.set(-6,4,-5); scene.add(rimC);
/* 간판·가로등 빛 — 개수가 바뀌면 셰이더를 다시 짜므로 4개를 두고 가까운 것으로 옮긴다 */
const near=[0,1,2,3].map(()=>{ const L=new THREE.PointLight(0xffffff,0,8,1.6); scene.add(L); return L; });
function nearLights(p){ const s=meta.lights.map(l=>[l,(l.x-p.x)**2+(l.z-p.z)**2]).sort((a,b)=>a[1]-b[1]);
  near.forEach((L,i)=>{ const l=s[i][0]; L.position.set(l.x,l.y,l.z); L.color.set(l.color); L.intensity=l.intensity*0.8; L.distance=l.distance; }); }
/* ---------- 발밑 그림자 (맵은 그림이라 실시간 그림자가 없다) ---------- */
const blobTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,4,64,64,62); gr.addColorStop(0,'rgba(0,0,0,.75)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
/* 물에 잠긴 곳(던전): 그림자 대신 발 둘레 물결 — 물이 허리까지라 발밑은 안 보인다 */
const rippleTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); for(const [r,a] of [[58,.55],[44,.35],[30,.2]]){ g.strokeStyle='rgba(190,235,245,'+a+')'; g.lineWidth=3; g.beginPath(); g.arc(64,64,r,0,Math.PI*2); g.stroke(); } return new THREE.CanvasTexture(c); })();
const FLOOR=meta.water?meta.water.y:0;
/* ---------- 영웅 ---------- */
const loader=new GLTFLoader();
if(LOD){ const raw=loader.load.bind(loader); loader.load=(u,...a)=>raw(String(u).replace(/^art\/3d\/gear\/(?!w_red_tension)/,'art/3d/lod/gear/').replace(/^art\/3d\/(ain|kain|ryu|sera)_anim\.glb/,'art/3d/lod/$1_anim.glb'),...a); }
const load=u=>new Promise((ok,no)=>loader.load(u,ok,undefined,no));
const NAMES={ ain:'아인', kain:'카인', ryu:'류', sera:'세라' };
/* 영웅별 기본 장비 + 갈아입을 세트 (장비가 그대로 보이는지 — 문서 185 §4.1) */
const WEAPON={ ain:'w_marsh_scythe', kain:'w_kain_greatsword', ryu:'w_ryu_twinfang', sera:'w_sera_reagent' };
const SETS=[ {}, { chest:'a_reed_cuirass', legs:'a_black_greaves', gloves:'a_steel_gauntlet', boots:'a_ranger_boots' },
  { head:'a_sluice_helm', chest:'a_sluice_cuirass', legs:'a_sluice_greaves', gloves:'a_sluice_gauntlet', boots:'a_sluice_boots' },
  { head:'a_ward_mask', chest:'a_ward_coat', legs:'a_ward_greaves', gloves:'a_ward_gloves', boots:'a_ward_boots' } ];
const START_SET={ ain:1, kain:2, ryu:3, sera:0 };
const heroes=[];
function dress(h, k){ h.set=k; const eq=Object.assign({ main:WEAPON[h.id] }, SETS[k]||{}, h.eqNet||{}); window.TW_HAIR&&TW_HAIR.sync(h.root, eq); TW_LOOKS.attach(THREE, loader, h.root, eq, { charId:h.id }); }
/* 영웅 GLB 는 영웅마다 한 번만 받고, 사람마다 뼈대째 복제한다 — 같은 영웅이 여럿이어도 내려받기 1번 */
const gltfs={};
function heroGltf(id){ return gltfs[id]||(gltfs[id]=load('art/3d/'+id+'_anim.glb').then(g=>{ if(window.TW_POSE) TW_POSE.repair(THREE,g); return g; })); }
async function hero(id, x, z, me, o={}){ const g=await heroGltf(id); const root=SkeletonUtils.clone(g.scene); if(window.TW_MATFIX) TW_MATFIX.repair(THREE,root);
  root.position.set(x,0,z); scene.add(root); root.traverse(o2=>{ if(o2.isMesh) o2.frustumCulled=false; });
  const mixer=new THREE.AnimationMixer(root), clip=n=>g.animations.find(a=>a.name===n), act={};
  for(const n of ['idle','run','walk','attack1','dodgeB']){ const c=clip(n); if(c) act[n]=mixer.clipAction(c); }
  ['attack1','dodgeB'].forEach(n=>{ if(act[n]){ act[n].setLoop(THREE.LoopOnce); act[n].clampWhenFinished=true; } });
  act.idle.play(); mixer.setTime(Math.random()*2);
  const blob=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3),meta.water?new THREE.MeshBasicMaterial({map:rippleTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.55}):new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false})); blob.rotation.x=-Math.PI/2; blob.renderOrder=1; scene.add(blob);
  const tag=document.createElement('div'); tag.className='tag'+(me?' me':''); const label=String(o.name||NAMES[id]).replace(/[<>&]/g,'');
  tag.innerHTML=(me?'':'<span style="color:#9fd8e8">'+(o.net?NAMES[id]:'[황혼]')+'</span> ')+label+'<div class="hp"><i style="width:'+(me?86:o.net?100:60+Math.random()*40|0)+'%"></i></div>'; document.getElementById('hud').appendChild(tag);
  const h={ id, root, mixer, act, cur:'idle', blob, tag, me, vx:0, vz:0, yaw:0, busy:0, goal:null, wait:Math.random()*2, set:0, net:!!o.net, eqNet:o.eq||null, target:null };
  dress(h, o.look!=null?o.look:START_SET[id]); heroes.push(h); return h; }
function removeHero(h){ const i=heroes.indexOf(h); if(i<0) return; scene.remove(h.root); scene.remove(h.blob); h.tag.remove(); heroes.splice(i,1); }
function play(h, n, fade=0.18){ if(h.cur===n||!h.act[n]) return; const a=h.act[n], b=h.act[h.cur]; a.reset().play(); if(b) a.crossFadeFrom(b,fade,false); h.cur=n; }
/* ---------- 걷기: 길 좌표 띠 + 상자 충돌 ---------- */
const ANG=meta.road.ang, ca=Math.cos(ANG), sa=Math.sin(ANG);
function toRoad(x,z){ return [x*ca - z*sa, -x*sa - z*ca]; }           /* (s, t) — env-gangnam 의 DIR·SIDE 기준 */
function fromRoad(s,t){ return [s*ca - t*sa, -s*sa - t*ca]; }
/* 실측 건물 윤곽(다각형) — 안이면 가장 가까운 변 밖으로, 밖이라도 반지름 안이면 밀어낸다 */
function polyPush(p, poly, r){ let inside=false, best=1e9, bx=0, bz=0;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i], b=poly[j];
    if((a[1]>p.z)!==(b[1]>p.z) && p.x<(b[0]-a[0])*(p.z-a[1])/(b[1]-a[1])+a[0]) inside=!inside;

  let ix=input.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0), iy=input.y+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  /* 화면 오른쪽 = +x, 화면 위 = 월드 -z (카메라 방위 0) */
  step(me, ix, -iy, dt, 4.8);
  heroes.forEach(h=>{ if(h.net) follow2(h,dt); else if(!h.me) wander(h,dt); h.mixer.update(dt); h.blob.position.set(h.root.position.x,FLOOR+0.03,h.root.position.z); });
  nearLights(me.root.position); follow(me.root.position); map.update(cam); placeT-=dt; if(placeT<=0){ placeT=0.5; place(); }
  zones(dt);
  if(net){ sendT+=dt; if(sendT>=0.1){ sendT=0; const p=me.root.position; net.send({type:'fieldMove',x:+p.x.toFixed(2),z:+p.z.toFixed(2),yaw:+me.yaw.toFixed(2),anim:me.cur}); } }
  heroes.forEach(tagPos); gateFx.forEach(f=>tagAt(f.tag,f.g.x,FLOOR+3.2,f.g.z)); bosses.forEach(o=>{ if(o.tag){ if(o===inBoss) o.tag.style.display='none'; else tagAt(o.tag,o.b.x,(o.b.fly||0)+(o.h||3)+0.4,o.b.z); } });
  if(bloom) bloom.render(scene,cam); else renderer.render(scene,cam);
  fpsT+=dt; fpsN++; if(fpsT>=1){ fps=fpsN/fpsT; fpsT=0; fpsN=0; if(dbgOn){ const i=renderer.info.render; dbg.textContent='fps '+fps.toFixed(0)+(LOD?' · LOD':'')+' · 콜 '+i.calls+' · 삼각형 '+(i.triangles/1000).toFixed(0)+'k · 픽셀비 '+renderer.getPixelRatio(); } }
  requestAnimationFrame(tick); }
renderer.info.autoReset=true;
window.__MMO={ get frames(){ return frames; }, get me(){ return me; }, heroes, cam, renderer, info(){ renderer.render(scene,cam); const i=renderer.info.render; return { calls:i.calls, triangles:i.triangles }; },
  gates:gateFx, bosses, get gateNear(){ return gateNear; }, get inBoss(){ return inBoss; }, goGate,
  teleport(x,z,yaw){ me.root.position.set(x,0,z); if(yaw!=null){ me.yaw=yaw; me.root.rotation.y=yaw; } }, toRoad, fromRoad, set:nextSet, meta, get net(){ return net; }, remotes };
tick();
</script>
