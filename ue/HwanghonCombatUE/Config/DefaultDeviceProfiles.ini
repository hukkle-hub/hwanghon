; 품질 tier (docs/design/118 §5·§14). Device Profile 로 분리 — 코드에서는 tier 를 모른다.
;   Android_High : Vulkan + Mobile Deferred 후보, 동적 그림자(hero), MSAA 4, 화면 배율 1.0
;   Android_Mid  : Forward, 제한된 동적 그림자, MSAA 2, 화면 배율 0.85
;   Android_Low  : Forward, 베이크 조명 중심, 그림자 caster 최소, 배율 0.7
; 기기 → tier 매칭은 DeviceProfileMatchingRules(GPU 계열) 로, 첫 slice 는 수동 지정(-dp=Android_Mid) 도 허용.

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.MobileContentScaleFactor=0.85
+CVars=r.Mobile.ShadingPath=0
+CVars=r.MSAACount=2
+CVars=sg.ShadowQuality=2
+CVars=sg.EffectsQuality=2
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=2
+CVars=sg.FoliageQuality=0
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.DistanceScale=0.7
+CVars=r.Mobile.MaxVisibleMovableSpotLightShadows=1
+CVars=r.ParticleLODBias=1
+CVars=r.Mobile.SceneColorFormat=1
+CVars=t.MaxFPS=60

[Android_High DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Mobile.ShadingPath=1
+CVars=r.MSAACount=4
+CVars=sg.ShadowQuality=3
+CVars=sg.EffectsQuality=3
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=3
+CVars=r.Shadow.MaxCSMResolution=2048
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.DistanceScale=1.0
+CVars=r.Mobile.MaxVisibleMovableSpotLightShadows=2
+CVars=r.Mobile.AmbientOcclusion=1
+CVars=r.ParticleLODBias=0

[Android_Mid DeviceProfile]
DeviceType=Android
BaseProfileName=Android

[Android_Low DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.MobileContentScaleFactor=0.7
+CVars=r.Mobile.ShadingPath=0
+CVars=r.MSAACount=1
+CVars=sg.ShadowQuality=1
+CVars=sg.EffectsQuality=1
+CVars=sg.PostProcessQuality=0
+CVars=sg.TextureQuality=1
+CVars=r.Shadow.MaxCSMResolution=512
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.DistanceScale=0.5
+CVars=r.Mobile.MaxVisibleMovableSpotLightShadows=0
+CVars=r.ParticleLODBias=2
+CVars=r.Mobile.SceneColorFormat=0
+CVars=t.MaxFPS=30
