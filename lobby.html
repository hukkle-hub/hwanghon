<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 메인 로비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<style>
/* ===== 메인 로비 (컨셉 시트 1. MAIN LOBBY) — 스테이지 축소 없이 뷰포트를 그대로 채운다 ===== */
html,body{height:100%;margin:0;background:#07080B;color:var(--tx-hi);font-family:var(--f-sans);overflow:hidden;-webkit-user-select:none;user-select:none}
.lb{position:fixed;inset:0;overflow:hidden}
.lb__bg{position:absolute;inset:0;background:#07080B url(art/lobby-bg.webp) no-repeat 50% 50%/cover}
.lb__bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(7,8,11,.78) 0%,rgba(7,8,11,.28) 22%,rgba(7,8,11,0) 45%,rgba(7,8,11,0) 70%,rgba(7,8,11,.55) 100%),
  linear-gradient(0deg,rgba(7,8,11,.85) 0%,rgba(7,8,11,.2) 22%,rgba(7,8,11,0) 55%,rgba(7,8,11,.55) 100%)}
.lb>*{position:relative;z-index:1}
.lb>.lb__bg{position:absolute;z-index:0}
/* 상단: 아바타 · 레벨 · 자원 · 아이콘 */
.lb__top{position:absolute;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:14px}
.lb__me{display:flex;align-items:center;gap:10px}
.lb__face{width:50px;height:50px;border:1px solid var(--line-gold);background:#111 center/cover;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.lb__lv{font-size:11px;color:#C93F3B;letter-spacing:.1em;font-family:var(--f-serif)}
.lb__nm{font-family:var(--f-serif);font-size:18px;color:var(--tx-hi);letter-spacing:.06em;line-height:1.1}
.lb__res{margin-left:auto;display:flex;align-items:center;gap:6px}
.res{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);background:rgba(6,7,10,.55);font-size:12.5px;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.res .ico{width:14px;height:14px;color:var(--gold-dim)}
.res--gem .ico{color:#7B9BD6}
.res--stam .ico{color:#C9A45E}
.res__plus{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(6,7,10,.55);color:var(--tx-faint);font-size:16px;cursor:pointer}
.res__plus:hover{color:var(--tx-hi)}
.lb__icons{display:flex;gap:2px;margin-left:6px}
.lb__icons .iconbtn{background:rgba(6,7,10,.45);border:1px solid var(--line)}
/* 좌측 세로 메뉴 */
.lb__menu{position:absolute;left:max(18px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.lb__menu a{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px 0 8px;color:var(--tx-dim);text-decoration:none;border-left:2px solid transparent;transition:.15s;cursor:pointer}
.lb__menu a .ico{width:22px;height:22px;color:#B9A46E;flex:none}
.lb__menu a b{font-weight:500;font-size:15px;color:var(--tx-hi);letter-spacing:.06em;line-height:1}
.lb__menu a small{display:block;font-size:9px;letter-spacing:.2em;color:var(--tx-faint);margin-top:3px;font-family:var(--f-sans)}
.lb__menu a:hover,.lb__menu a:active{border-left-color:var(--red-lit);background:linear-gradient(90deg,rgba(165,28,28,.28),transparent)}
.lb__menu a:hover .ico{color:#E0625B}
/* 우측 이벤트 카드 */
.lb__cards{position:absolute;right:max(18px,env(safe-area-inset-right));top:50%;transform:translateY(-58%);display:flex;flex-direction:column;gap:10px;width:200px}
.card{position:relative;height:66px;border:1px solid var(--line);background:rgba(6,7,10,.7);overflow:hidden;display:flex;align-items:center;padding:0 12px;text-decoration:none;color:inherit;transition:.15s}
.card img{position:absolute;right:0;top:0;height:100%;width:78px;object-fit:cover;object-position:center top;opacity:.85;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.card b{display:block;font-family:var(--f-serif);font-size:14.5px;color:var(--tx-hi);letter-spacing:.04em;font-weight:500}
.card span{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--tx-faint);margin-top:3px}
.card i{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red-lit);opacity:0}
.card:hover,.card:active{border-color:var(--line-red)}
.card:hover i{opacity:1}
.card .dot{position:absolute;left:8px;top:8px;width:6px;height:6px;border-radius:50%;background:#E0625B;box-shadow:0 0 6px #E0625B}
/* 하단: 인용구 · 출정 */
.lb__quote{position:absolute;left:50%;bottom:max(64px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);font-family:var(--f-serif);font-size:15px;color:#D9D2C6;letter-spacing:.12em;text-shadow:0 1px 6px #000;white-space:nowrap}
.lb__deploy{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:188px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(199,58,54,.75);background:linear-gradient(180deg,rgba(120,20,20,.75),rgba(60,10,10,.8));color:#F6E7E7;text-decoration:none;
  box-shadow:0 0 28px rgba(165,28,28,.3),inset 0 0 0 1px rgba(0,0,0,.4);transition:.15s}
.lb__deploy b{font-family:var(--f-serif);font-size:24px;letter-spacing:.34em;font-weight:500;text-indent:.34em}
.lb__deploy small{font-size:9.5px;letter-spacing:.3em;color:rgba(246,231,231,.6);margin-top:2px}
.lb__deploy:hover,.lb__deploy:active{filter:brightness(1.25);box-shadow:0 0 36px rgba(165,28,28,.5)}
.lb__build{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:10px;color:var(--tx-faint);letter-spacing:.06em}
.lb__build a{color:var(--tx-faint);text-decoration:none}
/* 세로 짧은 가로 화면(폰): 압축 */
@media (max-height:520px){
  .lb__top{top:max(6px,env(safe-area-inset-top))}
  .lb__face{width:40px;height:40px}
  .lb__nm{font-size:15px}
  .res{height:28px;font-size:12px;padding:0 8px}
  .lb__menu{top:54%;gap:0}
  .lb__menu a{height:34px;gap:10px;padding-right:10px}
  .lb__menu a b{font-size:13px}
  .lb__menu a small{display:none}
  .lb__menu a .ico{width:18px;height:18px}
  .lb__cards{width:160px;gap:6px;transform:translateY(-54%)}
  .card{height:52px}
  .card b{font-size:13px}
  .card img{width:60px}
  .lb__quote{font-size:12px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));left:auto;right:calc(max(18px,env(safe-area-inset-right)) + 176px);transform:none;max-width:44vw;white-space:normal;text-align:right;line-height:1.5}
  .lb__deploy{width:160px;height:54px;bottom:max(10px,env(safe-area-inset-bottom))}
  .lb__deploy b{font-size:20px}
  .lb__build{display:none}
}
/* 세로 화면: 메뉴는 아래 그리드, 카드는 가로 스크롤 */
@media (orientation:portrait){
  .lb__bg{background-position:32% 20%;background-size:auto 62%}
  .lb__bg::after{background:linear-gradient(0deg,rgba(7,8,11,.98) 0%,rgba(7,8,11,.9) 40%,rgba(7,8,11,.25) 62%,rgba(7,8,11,.5) 100%)}
  .lb__top{flex-wrap:wrap;gap:8px}
  .lb__res{margin-left:auto;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
  .lb__icons{margin-left:0}
  .lb__menu{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:auto;bottom:max(100px,calc(env(safe-area-inset-bottom) + 94px));transform:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .lb__menu a{height:58px;flex-direction:column;justify-content:center;gap:4px;padding:0;border:1px solid var(--line);border-left:1px solid var(--line);background:rgba(6,7,10,.6)}
  .lb__menu a b{font-size:13px}
  .lb__menu a small{display:none}
  .lb__cards{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:auto;bottom:max(300px,calc(env(safe-area-inset-bottom) + 294px));transform:none;width:auto;flex-direction:row;gap:6px}
  .card{flex:1;height:56px;padding:0 8px}
  .card b{font-size:12.5px}
  .card img{width:44px}
  .lb__quote{display:none}
  .lb__deploy{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));width:auto;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px))}
  .lb__build{display:none}
}
</style>
</head>
<body data-nomobile data-nonav>
<script src="js/icons.js"></script>
<div class="lb">
  <div class="lb__bg"></div>

  <header class="lb__top topbar" style="padding:0;border:0;background:none">
    <div class="lb__me">
      <div class="lb__face" style="background-image:url(art/face-ain.webp)"></div>
      <div><div class="lb__lv" id="lb-lv">LV.26</div><div class="lb__nm">Ain</div></div>
    </div>
    <div class="lb__res">
      <span class="res res--stam"><svg class="ico"><use href="#i-bolt"/></svg><span id="lb-stam">125/120</span></span>
      <span class="res currency"><svg class="ico"><use href="#i-coin"/></svg><span class="num" id="lb-gold">0</span></span>
      <span class="res res--gem"><svg class="ico"><use href="#i-gem"/></svg><span id="lb-gem">8,450</span></span>
      <a class="res__plus" href="shop.html" title="보급소">+</a>
      <span class="lb__icons">
        <button class="iconbtn" title="우편"><svg class="ico ico--lg"><use href="#i-mail"/></svg></button>
        <button class="iconbtn" title="기록"><svg class="ico ico--lg"><use href="#i-book"/></svg></button>
        <button class="iconbtn" title="설정"><svg class="ico ico--lg"><use href="#i-gear"/></svg></button>
      </span>
    </div>
  </header>

  <nav class="lb__menu" aria-label="메인 메뉴">
    <a href="characters.html"><svg class="ico"><use href="#i-book"/></svg><span><b>스토리</b><small>STORY</small></span></a>
    <a href="quest.html"><svg class="ico"><use href="#i-target"/></svg><span><b>퀘스트</b><small>QUEST</small></span></a>
    <a href="inventory.html"><svg class="ico"><use href="#i-bag"/></svg><span><b>인벤토리</b><small>INVENTORY</small></span></a>
    <a href="profile.html"><svg class="ico"><use href="#i-user"/></svg><span><b>캐릭터</b><small>CHARACTER</small></span></a>
    <a href="profile.html#skill"><svg class="ico"><use href="#i-bolt"/></svg><span><b>스킬</b><small>SKILL</small></span></a>
    <a href="forge.html"><svg class="ico"><use href="#i-hammer"/></svg><span><b>대장간</b><small>FORGE</small></span></a>
    <a href="shop.html"><svg class="ico"><use href="#i-shop"/></svg><span><b>상점</b><small>SHOP</small></span></a>
    <a data-records><svg class="ico"><use href="#i-medal"/></svg><span><b>기록</b><small>RECORD</small></span></a>
    <a href="party.html"><svg class="ico"><use href="#i-users"/></svg><span><b>길드</b><small>GUILD</small></span></a>
  </nav>

  <aside class="lb__cards">
    <a class="card" href="quest.html"><i></i><span class="dot"></span><div><b>이벤트</b><span>EVENT</span></div><img src="art/face-sera.webp" alt=""></a>
    <a class="card" href="arena.html"><i></i><div><b>황혼의 전장</b><span>PVP</span></div><img src="art/face-kain.webp" alt=""></a>
    <a class="card" href="office.html"><i></i><div><b>오늘의 의뢰</b><span>DAILY QUEST</span></div><img src="art/face-ryu.webp" alt=""></a>
  </aside>

  <div class="lb__quote">“낫을 든 순간, 그것은 심판이 된다.”</div>
  <a class="lb__deploy" href="office.html"><b>출정</b><small>DEPLOY</small></a>
  <div class="lb__build"><a href="index.html">타이틀</a> · <span id="lb-build">황혼 프로토타입</span></div>
</div>

<script src="js/items.js"></script>
<script src="js/save.js"></script>
<script src="js/gear.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/sfx.js"></script>
<script>
(function(){
  var W=window.TW_WORLD, SV=window.TW_SAVE, $=function(s){return document.querySelector(s);};
  var me=W&&W.CHARS&&W.CHARS.ain; var sv=SV.get();
  $('#lb-lv').textContent='LV.'+(me?me.lv:26)+(sv.lv>1?' · 훈련 Lv.'+sv.lv:'');
  $('#lb-gold').textContent=(window.TW_ITEMS?TW_ITEMS.fmt:String)(SV.wallet());
  document.addEventListener('tw:wallet', function(){ $('#lb-gold').textContent=TW_ITEMS.fmt(SV.wallet()); });
  var rec=$('[data-records]'); if(rec) rec.addEventListener('click', function(){ if(window.TW&&TW.records) TW.records(); });
  fetch('version.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(v){ $('#lb-build').textContent='황혼 프로토타입 · build '+v.build; }).catch(function(){});
  /* 로비에 들어오면 타이틀은 지나간 것 — 뒤로가기는 타이틀로 */
  try{ sessionStorage.setItem('tw:lobby','1'); }catch(e){}
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
