<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황혼 4캐릭터 시네마틱 모션 v01</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c10;color:#eef;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}#ui{position:absolute;left:22px;top:18px;background:#0c1016d9;border:1px solid #39424d;border-radius:11px;padding:15px 16px;min-width:330px;backdrop-filter:blur(10px)}h1{font-size:17px;margin:0 0 10px}select,button{background:#171d25;color:#eef;border:1px solid #475261;border-radius:7px;padding:7px 9px;margin:2px;font:inherit}#title{font-size:25px;font-weight:800;margin-top:10px}#desc{font-size:12px;color:#aab4c0;max-width:400px;line-height:1.5}.bar{height:4px;background:#252c35;margin-top:12px}.bar i{display:block;height:100%;background:#c84751;width:0}.hint{position:absolute;right:20px;bottom:18px;background:#0c1016bb;padding:10px 12px;border:1px solid #303843;border-radius:8px;color:#aeb7c2;font-size:12px}</style></head><body><canvas id="c"></canvas><div id="ui"><h1>HWANGHON · CHARACTER CINEMATIC MOTION v01</h1><select id="char"><option value="ain">아인 · 월광 유도형</option><option value="kain">카인 · 철괴 압축형</option><option value="ryu">류 · 연속 탄성형</option><option value="sera">세라 · 정밀 제어형</option></select><select id="state"></select><button id="play">자동 재생</button><div id="title">LOADING</div><div id="desc">실제 캐릭터 GLB + 캐릭터별 시네마 모션 레이어</div><div class="bar"><i></i></div></div><div class="hint">판정·피해·이동 거리 불변<br>골반·척추·목·머리의 관성만 추가</div>
<script src="./js/looks.js"></script>
<script type="module">
import * as T from './vendor/three/three.module.js';import {GLTFLoader} from './vendor/three/GLTFLoader.js';import {repairAinBind,repairAinClips} from './js/ain-bind-repair.js';import {smoothCharacterClips} from './js/clip-smooth.js';import {mountAinScythe} from './js/ain-scythe-mount.js';import {makeAinRigAdapter} from './js/ain-two-hand.js';import {makeRigAdapter} from './js/combat-motion.js';import {createCharacterCinema,transitionFor,CINEMA_STYLE} from './js/character-cinema.js';
const STATES=[['combat_idle','idle','전투 대기'],['idle_variation','idle2','대기 변화'],['walk','walk','보행'],['run','run','달리기'],['backstep','dodgeB','백스텝'],['evade_left','dodgeL','좌 회피'],['evade_right','dodgeR','우 회피'],['hit_light','hit','약 피격'],['hit_heavy','hit2','강 피격'],['attack1','attack1','기본 1타'],['attack2','attack2','기본 2타'],['attack3','attack3','기본 3타'],['counter','counter','카운터'],['skill1','skill1','스킬 1'],['skill3','skill3','스킬 3'],['ult','ult','궁극기']];
const cvs=document.querySelector('#c'),r=new T.WebGLRenderer({canvas:cvs,antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.shadowMap.enabled=true;r.outputColorSpace=T.SRGBColorSpace;const sc=new T.Scene();sc.background=new T.Color(0x090c10);sc.fog=new T.Fog(0x090c10,8,16);const cam=new T.PerspectiveCamera(32,1,.05,30);cam.position.set(3.1,1.7,5.2);cam.lookAt(0,1.05,0);sc.add(new T.HemisphereLight(0xcbd8ed,0x201b19,1.7));const dl=new T.DirectionalLight(0xffffff,3.2);dl.position.set(4,5,4);sc.add(dl);const rim=new T.DirectionalLight(0x779eff,1.9);rim.position.set(-4,3,-3);sc.add(rim);const gnd=new T.Mesh(new T.CircleGeometry(4.5,64),new T.MeshStandardMaterial({color:0x14191f,roughness:.95}));gnd.rotation.x=-Math.PI/2;sc.add(gnd);const loader=new GLTFLoader();
let model,mixer,clips={},rig,cinema,weapon,currentAction,cid='ain',stateI=0,clock=new T.Clock(),auto=true,elapsed=0;const grp=new T.Group();sc.add(grp);
function fit(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',fit);fit();document.querySelector('#state').innerHTML=STATES.map((x,i)=>`<option value="${i}">${x[2]}</option>`).join('');
function proxyWeapons(id,root){let rs,ls;root.traverse(o=>{if(o.isBone&&/RightHandSlot/.test(o.name))rs=o;if(o.isBone&&/LeftHandSlot/.test(o.name))ls=o;});/* 게임과 같은 손 그립(docs/design/93) */if(window.TW_LOOKS){if(rs)rs=TW_LOOKS.anchor(T,rs);if(ls)ls=TW_LOOKS.anchor(T,ls);}if(id==='kain'&&rs){const w=new T.Group(),blade=new T.Mesh(new T.BoxGeometry(.12,1.55,.055),new T.MeshStandardMaterial({color:0x818892,metalness:.8,roughness:.4}));blade.position.y=.75;w.add(blade);rs.add(w);weapon=w;}else if(id==='ryu'){for(const [s,sg] of [[rs,1],[ls,-1]])if(s){const w=new T.Mesh(new T.BoxGeometry(.035,.55,.025),new T.MeshStandardMaterial({color:0xb8bec6,metalness:.8,roughness:.35}));w.position.y=.25;w.rotation.z=sg*.1;s.add(w);}}else if(id==='sera'){for(const s of [rs,ls])if(s){const w=new T.Mesh(new T.TorusGeometry(.13,.025,8,24),new T.MeshStandardMaterial({color:0x91d3d6,emissive:0x174448,emissiveIntensity:.7}));w.rotation.x=Math.PI/2;s.add(w);}}return {rs,ls};}
async function load(id){cid=id;clips={};mixer=null;rig=null;cinema=null;currentAction=null;while(grp.children.length)grp.remove(grp.children[0]);const gl=await new Promise((res,rej)=>loader.load(`./art/3d/${id}_anim.glb`,res,undefined,rej));model=gl.scene;model.scale.setScalar(1.14);grp.add(model);let anim=gl.animations;if(id==='ain')anim=repairAinClips(anim,repairAinBind(model));else anim=smoothCharacterClips(id,anim,{});mixer=new T.AnimationMixer(model);anim.forEach(c=>clips[c.name]=c);const {rs}=proxyWeapons(id,model);if(id==='ain'&&rs){const sw=await new Promise((res,rej)=>loader.load('./art/3d/ain_scythe_tex.glb',res,undefined,rej));weapon=mountAinScythe(sw.scene);rs.add(weapon);}rig=(id==='ain'?makeAinRigAdapter:makeRigAdapter)(model,grp,rs,{twoHand:id==='kain'});cinema=createCharacterCinema(model,grp,id);stateI=0;elapsed=0;setState(0,false);document.documentElement.dataset.ready='1';}
function setState(i,fade=true){stateI=(+i+STATES.length)%STATES.length;const [label,clip,ko]=STATES[stateI],c=clips[clip]||clips.idle;if(!c)return;const a=mixer.clipAction(c);a.reset().enabled=true;a.setEffectiveWeight(1).setLoop(T.LoopRepeat,Infinity);if(currentAction&&currentAction!==a&&fade)a.crossFadeFrom(currentAction,transitionFor(cid,clip).base,true);a.play();currentAction=a;elapsed=0;document.querySelector('#title').textContent=`${CINEMA_STYLE[cid]?.label||cid} · ${ko}`;document.querySelector('#desc').textContent=`${label.toUpperCase()} · 실제 ${cid}_anim.glb 위에 시네마 관성 레이어 적용`;document.querySelector('#state').value=stateI;}
document.querySelector('#char').onchange=e=>load(e.target.value);document.querySelector('#state').onchange=e=>setState(e.target.value);document.querySelector('#play').onclick=()=>{auto=!auto;document.querySelector('#play').textContent=auto?'자동 재생':'수동 재생'};
function frame(){requestAnimationFrame(frame);if(!mixer||!rig||!cinema||!currentAction||!clips.idle)return;const dt=Math.min(.033,clock.getDelta());elapsed+=dt;if(auto&&elapsed>1.8)setState(stateI+1);cinema.restore();rig.restore();mixer.update(dt);const [label,clip]=STATES[stateI],dur=(clips[clip]||clips.idle).duration,ph=(currentAction.time%dur)/dur,isAction=/attack|skill|ult|counter|smash|exec/.test(clip),moving=clip==='walk'||clip==='run';const a=isAction?{id:1,clip,kind:'attack',duration:dur,elapsed:ph*dur}:null;rig.apply(a,moving,false,dt,clip,null);cinema.apply({dt,clip,clipTime:ph,moving,speed:moving?1:0,localX:0,localZ:moving?1:0,guard:false,action:a});document.querySelector('.bar i').style.width=(ph*100)+'%';r.render(sc,cam)}load('ain');frame();
</script></body></html>
