<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 의뢰 상세 / 보스 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<style>
.qs{display:grid;grid-template-columns:300px 1fr 302px;gap:11px;padding:10px 18px;flex:1;min-height:0}
.qs__l{display:grid;grid-template-rows:1fr 186px;gap:10px;min-height:0}
.qs__c{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;min-height:0}
.qs__r{display:grid;grid-template-rows:auto auto auto 1fr auto;gap:10px;min-height:0}

/* 보스 헤더 */
.bosshead{padding:11px 15px 0}
.bosshead__t{display:flex;align-items:center;gap:10px}
.bosshead__t h2{font-size:18px;color:var(--tx-hi);letter-spacing:.05em}
.bosshead__d{font-size:11px;color:var(--tx-dim);line-height:1.55;margin-top:6px}
.bossart{height:110px;margin:9px 15px 12px;border:1px solid var(--line);position:relative}
.bossart img{object-position:center 40%}

/* 약점 다이어그램 */
.weak{position:relative;height:156px}
.weak__fig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:212px;height:116px;
  background:radial-gradient(60% 60% at 50% 55%,rgba(90,95,110,.22),transparent 70%)}
.weak__fig img{width:100%;height:100%;object-fit:contain;opacity:.92}
.callout{position:absolute;min-width:146px;border:1px solid var(--line-gold);background:rgba(20,18,12,.72);padding:6px 9px}
.callout b{display:block;font-size:11.5px;color:#D6C68E;font-weight:500;letter-spacing:.03em}
.callout span{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--tx-faint);margin-top:4px}
.callout span i{color:var(--gold);font-style:normal}
.callout--tl{left:8px;top:10px}
.callout--tr{right:8px;top:6px}
.callout--bl{left:22px;bottom:10px}
.callout--br{right:22px;bottom:14px}
.weak__dot{position:absolute;width:6px;height:6px;border:1px solid var(--gold);border-radius:50%;
  background:rgba(201,162,39,.3)}
.weak__line{position:absolute;inset:0;pointer-events:none}
.weak__line line{stroke:rgba(201,162,39,.34);stroke-width:1;stroke-dasharray:3 3}

/* 3분할 하위 패널 */
.trio{display:grid;grid-template-columns:1.5fr 1fr .82fr;gap:10px;min-height:0}
.atk{display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.atk:last-child{border:0}
.atk__ic{width:22px;height:22px;display:grid;place-items:center;color:#B4726C;flex:none}
.atk__nm{font-size:12px;color:var(--tx);white-space:nowrap}
.atk__d{font-size:10px;color:var(--tx-faint);margin-left:auto;text-align:right;white-space:nowrap}
.trait{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.trait:last-child{border:0}
.trait__ic{width:24px;height:24px;display:grid;place-items:center;color:#9AA0AC;flex:none;
  border:1px solid var(--line);background:rgba(0,0,0,.3)}
.mrow{display:flex;align-items:flex-start;gap:10px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border:0}
.mrow__g{width:20px;text-align:center;font-family:var(--f-serif);font-size:15px;font-weight:700;flex:none}

/* 하단 3분할 */
.qs__bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* 우측 */
.dropline{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.dropline:last-child{border:0}
.dropline__k{width:40px;flex:none;font-size:11px;color:var(--tx-faint)}
.dropline .slotgrid{flex:1;--cols:6;gap:4px}
.note{display:flex;gap:10px}
.note__img{width:78px;height:56px;border:1px solid var(--line);flex:none}
.charsel{display:flex;align-items:center;gap:10px;padding:8px 11px}
.charsel__face{width:46px;height:46px;border:1px solid var(--line);flex:none}
.codex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.codex .art{aspect-ratio:1/1;border:1px solid var(--line)}
.codex .art:first-child{border-color:var(--line-red)}
.backbar{display:flex;align-items:center;padding:9px 24px;flex:none}
.pair{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12px}
.pair>div{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<script src="js/icons.js"></script>

<div class="stage">
  <header class="topbar">
    <svg class="topbar__sigil"><use href="#i-sigil"/></svg>
    <div>
      <h1 class="topbar__title">의뢰 상세 / 보스 도감</h1>
      <div class="topbar__sub">의뢰 내용과 목표, 위험 요소를 확인하고 출격 준비를 진행합니다.</div>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__right">
      <span class="currency"><svg class="ico"><use href="#i-coin"/></svg><span class="num">75,300</span></span>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-mail"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-book"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <main class="qs">
    <!-- ============ 좌측 ============ -->
    <div class="qs__l">
      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">의뢰 목록</span></div>
        <div class="panel__body panel__body--tight none">
          <div class="flex g2 ac">
            <select class="sel fill"><option>전체</option><option>보스 의뢰</option><option>토벌</option></select>
            <select class="sel fill"><option>추천 순</option><option>보수 순</option><option>위험도 순</option></select>
            <button class="iconbtn"><svg class="ico ico--sm"><use href="#i-filter"/></svg></button>
          </div>
        </div>
        <div class="panel__body panel__body--flush scroll fill" data-pick>
          <div id="q-rows"></div>
          <div style="padding:11px">
            <button class="btn btn--sm btn--block btn--ghost">
              <svg class="ico ico--sm"><use href="#i-refresh"/></svg>의뢰 새로고침</button>
          </div>
        </div>
      </section>

      <section class="panel panel--framed">
        <div class="panel__head">
          <span class="panel__title">보스 도감</span>
          <span class="panel__meta">수집 현황 <span class="num t-dim" id="codex-n">24 / 47</span></span>
        </div>
        <div class="panel__body">
          <div class="codex" id="codex"></div>
          <button class="btn btn--sm btn--block btn--ghost mt3">
            <svg class="ico ico--sm"><use href="#i-refresh"/></svg>도감 보기</button>
        </div>
      </section>
    </div>

    <!-- ============ 중앙 ============ -->
    <div class="qs__c">
      <section class="panel panel--framed">
        <div class="bosshead" id="bosshead"></div>
        <div class="bossart art art--beast" id="bossart"></div>
      </section>

      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">약점 및 파괴 부위</span></div>
        <div class="panel__body panel__body--flush">
          <div class="weak" id="weak"></div>
        </div>
      </section>

      <div class="trio">
        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">공격 패턴 요약</span></div>
          <div class="panel__body panel__body--tight scroll" id="patterns"></div>
        </section>

        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">추천 파티 특성</span></div>
          <div class="panel__body panel__body--tight scroll" id="traits"></div>
        </section>

        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">마스터리 등급</span></div>
          <div class="panel__body panel__body--tight scroll" id="mastery"></div>
        </section>
      </div>

      <div class="qs__bottom">
        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">의뢰 정보</span></div>
          <div class="panel__body panel__body--tight" id="qinfo"></div>
</section>

        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">클리어 조건</span></div>
          <div class="panel__body panel__body--tight" id="clear"></div>
</section>

        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">출격 준비 체크리스트</span></div>
          <div class="panel__body panel__body--tight" id="checklist"></div>
</section>
      </div>
    </div>

    <!-- ============ 우측 ============ -->
    <div class="qs__r">
      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">획득 가능 보상</span></div>
        <div class="panel__body panel__body--tight" id="loot"></div>
</section>

      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">드롭 정보</span></div>
        <div class="panel__body panel__body--tight" id="drops"></div>
</section>

      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">정찰 경로 노트</span></div>
        <div class="panel__body panel__body--tight" id="note"></div>
</section>

      <section class="panel panel--framed">
        <div class="panel__head"><span class="panel__title">선택 캐릭터</span></div>
        <div class="charsel">
          <div class="charsel__face art art--avatar"><img src="art/face-ain.webp" alt="ain"></div>
          <div class="fill">
            <div class="flex ac jb"><span class="sm t-hi f-serif">아인</span><span class="xs t-faint">LV.26</span></div>
            <div class="xs t-faint mt1">전투력 <span class="num t-dim">24,650</span></div>
          </div>
          <svg class="ico t-ghost"><use href="#i-scythe"/></svg>
        </div>
        <div style="padding:0 11px 11px">
          <button class="btn btn--sm btn--block btn--ghost">캐릭터 변경</button>
        </div>
      </section>

      <button class="btn btn--deploy">
        <span class="flex ac g2"><svg class="ico ico--lg"><use href="#i-sword"/></svg>출격 준비</span>
      </button>
    </div>
  </main>

  <div class="backbar">
    <a class="hot" href="office.html"><svg class="ico"><use href="#i-arrowl"/></svg>뒤로</a>
  </div>
</div>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script>
/* 의뢰 상세 / 보스 도감 — world.js · items.js 에서 렌더 */
(function(){
  var W=window.TW_WORLD, T=window.TW_ITEMS, $=function(s){return document.querySelector(s);}, cur='q_marsh';
  var LINES={tl:'<line x1="20%" y1="24%" x2="44%" y2="42%"/>',tr:'<line x1="80%" y1="18%" x2="56%" y2="40%"/>',bl:'<line x1="23%" y1="80%" x2="45%" y2="62%"/>',br:'<line x1="78%" y1="76%" x2="56%" y2="64%"/>'};
  function slot(id,extra){ return T.slotHTML(id, extra||{noTag:true}); }
  function rows(){
    $('#q-rows').innerHTML=W.QUESTS.map(function(q){ return '<div class="row'+(q.id===cur?' is-on':'')+'" data-q="'+q.id+'">'+W.artDiv(q.art,'row__thumb')+
      '<div class="row__main"><div class="row__name">'+q.name+'</div><div class="row__sub">'+q.area+' &gt; '+q.sub+'</div></div><div class="row__right">'+(q.id===cur?'<span class="risk">위험도 '+W.riskBadge(q.risk)+'</span>':W.riskBadge(q.risk))+'</div></div>'; }).join('');
  }
  function detail(){
    var q=W.quest(cur), b=q.boss?W.BOSSES[q.boss]:null;
    $('#bosshead').innerHTML='<div class="bosshead__t"><h2>'+q.name+'</h2><span class="risk">위험도 '+W.riskBadge(q.risk)+'</span></div><div class="xs t-faint mt1">'+q.area+' &gt; '+q.sub+'</div>'+
      '<p class="bosshead__d">'+q.desc+'</p><div class="flex g2 mt3">'+q.tags.map(function(t){return '<span class="chip chip--red">'+t+'</span>';}).join('')+'</div>';
    $('#bossart').innerHTML='<img src="art/'+q.art+'.webp" alt="'+q.name+'">';
    if(b){
      $('#weak').innerHTML='<svg class="weak__line">'+b.weakpoints.map(function(w){return LINES[w.pos];}).join('')+'</svg><div class="weak__fig"><img src="art/'+b.anatomy+'.webp" alt="부위 구조"></div>'+
        b.weakpoints.map(function(w){ return '<div class="callout callout--'+w.pos+'"><b>'+w.part+' ('+w.tag+')</b><span><i>★</i>'+w.effect+'</span></div>'; }).join('');
      $('#patterns').innerHTML=b.patterns.map(function(p){ return '<div class="atk"><span class="atk__ic"><svg class="ico ico--sm"><use href="#i-'+p[0]+'"/></svg></span><span class="atk__nm">'+p[1]+'</span>'+W.riskBadge(p[2])+'<span class="atk__d">'+p[3]+'</span></div>'; }).join('');
      $('#traits').innerHTML=b.traits.map(function(t){ return '<div class="trait"><span class="trait__ic"><svg class="ico ico--sm"><use href="#i-'+t[0]+'"/></svg></span><div><div class="sm t-hi">'+t[1]+'</div><div class="xs t-faint mt1">'+t[2]+'</div></div></div>'; }).join('');
      $('#mastery').innerHTML=b.mastery.map(function(m){ return '<div class="mrow"><span class="mrow__g g-'+m[0].toLowerCase()+'">'+m[0]+'</span><div class="xs t-faint">'+m[1]+'</div></div>'; }).join('');
    } else {
      $('#weak').innerHTML='<div class="xs t-faint tc" style="padding:40px 0">보스 의뢰가 아닙니다 — 부위 정보 없음</div>';
      $('#patterns').innerHTML=$('#traits').innerHTML=$('#mastery').innerHTML='<div class="xs t-faint">정보 없음</div>';
    }
    $('#qinfo').innerHTML='<div class="pair"><div><span class="stat__k">권장 레벨</span><span class="stat__v">'+q.recLv+'</span></div><div><span class="stat__k">권장 전투력</span><span class="stat__v num">'+W.fmt(q.recCp)+'</span></div></div>'+
      '<div class="pair"><div><span class="stat__k">의뢰 보수</span><span class="stat__v flex ac g1"><svg class="ico ico--xs t-gold"><use href="#i-coin"/></svg>'+W.fmt(q.reward)+'</span></div><div><span class="stat__v num t-dim">'+q.time+'</span></div></div>'+
      '<div class="pair"><div><span class="stat__k">출격 인원</span><span class="stat__v">'+q.party+'</span></div></div><div class="pair"><div><span class="stat__k">실패 페널티</span><span class="stat__v xs">'+q.penalty+'</span></div></div>';
    $('#clear').innerHTML='<div class="flex g2 ac"><span class="xs t-red">필수 목표</span><span class="sm t-dim">• '+q.objectives.must.join(' · ')+'</span></div><div class="hr"></div><div class="xs t-faint mb2">선택 목표</div>'+
      q.objectives.optional.map(function(o){ return '<div class="flex ac g2 mb2"><svg class="ico ico--sm t-faint"><use href="#i-skull"/></svg><span class="sm t-dim fill">'+o[0]+'</span><span class="xs t-faint num">('+o[1]+'/'+o[2]+')</span></div>'; }).join('');
    $('#checklist').innerHTML=(q.checklist.length?q.checklist:[['장비 내구도 100% 이상',true],['소모품 전부 보유',true]]).map(function(c){ return '<label class="check'+(c[1]?' is-on':'')+' mb2" style="display:flex"><i></i>'+c[0]+'</label>'; }).join('');
    $('#loot').innerHTML='<div class="slotgrid" style="--cols:6" data-pick>'+q.loot.map(function(id,i){ return T.slotHTML(id,{noTag:true,on:i===0}); }).join('')+'</div>'+
      '<div class="flex ac g2 mt3"><span class="xs t-faint fill">최초 클리어 보상</span><div style="width:34px">'+T.slotHTML(q.firstClear,{noTag:true})+'</div></div>';
    $('#drops').innerHTML=[['일반','common'],['희귀','rare'],['낮은 확률','low']].map(function(k){ return '<div class="dropline"><span class="dropline__k">'+k[0]+'</span><div class="slotgrid">'+q.drops[k[1]].map(function(id){return T.slotHTML(id,{noTag:true});}).join('')+'</div></div>'; }).join('');
    $('#note').innerHTML='<div class="note">'+W.artDiv(q.art==='boss-marsh'?'lobby-city':q.art,'note__img')+'<p class="t-faint" style="font-size:10.5px;line-height:1.6;margin:0">'+(q.note||'정찰 기록 없음')+'</p></div>';
  }
  $('#codex-n').textContent=W.CODEX.collected+' / '+W.CODEX.total;
  $('#codex').innerHTML=W.CODEX.thumbs.map(function(a){ return W.artDiv(a,''); }).join('');
  $('#q-rows').addEventListener('click', function(e){ var r=e.target.closest('[data-q]'); if(!r) return; cur=r.dataset.q; rows(); detail(); });
  rows(); detail();
})();
</script>
<script src="js/ui.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
