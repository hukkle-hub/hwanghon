<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 인력사무실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/mobile.css">
<style>
.office{display:grid;grid-template-columns:344px 1fr 374px;gap:14px;padding:14px 20px 12px;flex:1;min-height:0}
.office__l{display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0}
.office__c{position:relative;display:flex;flex-direction:column;min-height:0}
.office__r{display:grid;grid-template-rows:1fr auto auto;gap:12px;min-height:0}

/* 중앙 아트 + 파티 정보 */
.hero{position:absolute;inset:0}
.hero .moon{right:14%;top:9%;width:54px;height:54px;opacity:.55}
.office__c .party{margin-top:auto;position:relative;z-index:2}
.party__cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pcard{
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(22,23,28,.94),rgba(12,13,17,.96));
  border:1px solid var(--line);padding:9px 9px 8px;cursor:pointer;transition:.15s
}
.pcard:hover{border-color:var(--line-hard)}
.pcard.is-on{border-color:var(--line-red);box-shadow:inset 0 0 18px rgba(165,28,28,.14)}
.pcard__top{display:flex;gap:9px;align-items:flex-start}
.pcard__face{width:44px;height:44px;flex:none;border:1px solid var(--line)}
.pcard__nm{font-family:var(--f-serif);font-size:14px;color:var(--tx-hi);letter-spacing:.03em}
.pcard__lv{font-size:11px;color:var(--tx-faint);margin-top:2px}
.pcard__cp{font-size:11.5px;color:var(--tx-dim);margin-top:3px;font-variant-numeric:tabular-nums}
.pcard__role{margin-left:auto;color:var(--tx-ghost)}
.pcard__ready{
  margin-top:8px;height:24px;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:11.5px;color:#D9A9A7;border:1px solid var(--line-red);background:rgba(165,28,28,.16);
  letter-spacing:.05em
}

/* 사무소 등급 */
.rank__row{display:flex;align-items:center;gap:10px;padding:7px 0}
.rank__ico{width:26px;height:26px;color:var(--gold-dim);flex:none}
.rank__k{font-size:11.5px;color:var(--tx-faint)}
.rank__v{font-size:12px;color:var(--tx);letter-spacing:.03em}
.rank__num{font-size:11px;color:var(--tx-faint);font-variant-numeric:tabular-nums;margin-left:auto}

/* 의뢰 정보 */
.qart{height:118px;border:1px solid var(--line);position:relative}
.rewards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rw{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 6px;
  border:1px solid var(--line);background:rgba(0,0,0,.3)
}
.rw .ico{color:#9AA0AC;width:20px;height:20px}
.rw .itart{width:26px;height:26px}
.rw b{font-size:11.5px;color:var(--tx);font-weight:500;font-variant-numeric:tabular-nums}
.rw[data-r="hero"]{border-color:rgba(139,91,214,.4)}
.rw[data-r="legend"]{border-color:rgba(201,138,43,.4)}
.enemies{display:flex;gap:6px}
.enemy{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:#8C9098}

/* 전투 준비 */
.prep{display:flex;align-items:center;gap:11px;padding:10px 12px}
/* 시트의 의뢰 카드: 제목과 위험도가 같은 줄, 그 아래 지역, 가는 구분선, 의뢰 보수 */
.qrow{align-items:stretch}
.qrow__t{display:flex;align-items:center;gap:8px}
.qrow__t .row__name{flex:1;min-width:0}
.qrow__t .risk{flex:none}
.qrow__hr{height:1px;background:var(--line-soft);margin:7px 0 6px}
.qrow__pay{margin:0}
.qrow.is-locked{opacity:.45}
.qrow.is-locked.is-on{opacity:.62}
/* 시트의 «전투 준비» — 금빛 띠 한 줄. 선택한 의뢰의 출격지를 따라간다. */
.prepbar{display:flex;align-items:center;gap:12px;padding:9px 13px;text-decoration:none;color:inherit;
  border:1px solid var(--line-gold);position:relative;overflow:hidden;
  background:linear-gradient(100deg,rgba(94,74,38,.55),rgba(52,42,24,.38) 62%,rgba(24,20,14,.3))}
.prepbar__ico{width:28px;height:28px;color:#D9C49A;flex:none}
.prepbar__k{font-size:13px;color:#EADFC4;letter-spacing:.06em}
.prepbar__v{font-size:11px;color:var(--tx-dim);margin-top:3px}
.prepbar__art{position:absolute;right:0;top:0;bottom:0;width:150px;opacity:.28;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.prepbar__art img{width:100%;height:100%;object-fit:cover}
.prepbar.is-locked{filter:grayscale(.7);opacity:.6;pointer-events:none}
/* 시트의 이 칸은 «전투 준비» 한 줄 높이다. 목록이 길어져도 스테이지 952px 예산을
   넘기면 안 된다 — 넘기면 fitStage 가 화면 전체를 축소한다. 넘치면 여기서 스크롤. */
.preplist{max-height:150px;overflow-y:auto}
.prep__thumb{width:58px;height:40px;border:1px solid var(--line);flex:none}
.prep__ico{width:30px;height:30px;color:var(--gold-dim);flex:none}

</style>
</head>

<script>
/* 인력사무실 — 의뢰 목록·의뢰 정보·파티 카드를 world.js 에서 렌더 */
(function(){
  var W=window.TW_WORLD, T=window.TW_ITEMS, $=function(s){return document.querySelector(s);}, cur=W.QUESTS[0].id;
  var coin='<svg class="ico ico--xs" style="color:var(--gold-dim)"><use href="#i-coin"/></svg>';
  function rows(){
    $('#q-rows').innerHTML = W.QUESTS.map(function(q){
      var st=window.TW_STORY?TW_STORY.questState(q.id):'available';
      /* 시트에는 상태 칩이 없다. 눌러서 할 일이 있는 «보수 미수령» 만 남기고,
         잠김은 칩 대신 카드를 흐리게 해서 보인다 — 여섯 줄 전부 「잠김」은 소음이다. */
      var chip=st==='cleared'?'<span class="qstate qstate--cleared">보수 미수령</span>':'';
      return '<div class="row qrow'+(q.id===cur?' is-on':'')+(st==='locked'?' is-locked':'')+'" data-q="'+q.id+'"><div class="row__main">'+
        '<div class="qrow__t"><span class="row__name">'+q.name+'</span><span class="risk">위험도 '+W.riskBadge(q.risk)+'</span></div>'+
        '<div class="row__sub">'+q.area+' &gt; '+q.sub+'</div><div class="qrow__hr"></div>'+
        '<div class="row__sub qrow__pay">의뢰 보수 '+coin+'<span class="num t-dim">'+W.fmt(q.reward)+'</span></div>'+chip+'</div></div>'; }).join('');
  }
  function info(){
    var q=W.quest(cur); $('#q-risk').innerHTML='위험도 '+W.riskBadge(q.risk);
    var rw=q.rewards.map(function(r){ var it=r[0]==='exp'?null:T.get(r[0]); var ic=it?it.icon:'exp'; var rar=it&&(it.rarity==='hero'||it.rarity==='legend')?' data-r="'+it.rarity+'"':'';
      return '<div class="rw"'+rar+'>'+(it?T.artHTML(it.id):'<svg class="ico"><use href="#i-'+ic+'"/></svg>')+'<b>'+(typeof r[1]==='number'?W.fmt(r[1]):r[1])+'</b></div>'; }).join('');
    /* 시트의 «주요 적» 은 네 칸이 서로 다른 실루엣이다. 같은 해골 네 개는 정보가 0이다. */
    var FOE=['skull','tree','bolt','anvil'],en='';
    for(var i=0;i<q.enemies;i++) en+='<span class="enemy"><svg class="ico ico--sm"><use href="#i-'+FOE[i%FOE.length]+'"/></svg></span>';
    $('#q-info').innerHTML='<h2 class="lg" style="color:var(--tx-hi);letter-spacing:.04em">'+q.name+'</h2><div class="xs t-faint mt1">'+q.area+' &gt; '+q.sub+'</div>'+
      '<div class="qart art art--beast mt3"><img src="art/'+q.art+'.webp" alt=""></div><div class="hr"></div><div class="label-ko">의뢰 목표</div><div class="sm t-dim">'+q.goal+'</div>'+
      '<div class="hr"></div><div class="label-ko">주요 적</div><div class="enemies">'+en+'</div><div class="hr"></div>'+
      '<div class="flex ac jb"><span class="label-ko" style="margin:0">의뢰 보수</span><span class="currency"><svg class="ico ico--sm"><use href="#i-coin"/></svg><span class="num">'+W.fmt(q.reward)+'</span></span></div>'+
      '<div class="rewards mt3">'+rw+'</div>'+questAction(q)+'<div class="field mt3"><input placeholder="출현 변이체 정보"><svg class="ico ico--sm t-faint"><use href="#i-search"/></svg></div>';
    var cb=$('#q-claim'); if(cb) cb.addEventListener('click', function(){ var got=TW_STORY.claim(q.id); if(!got) return; if(window.TW_SFX) TW_SFX.play('clear'); rows(); info();
      var T2=window.TW_ITEMS; TW_STORY.play([['matteo','보수다. '+W.fmt(q.reward)+' 골드'+got.filter(function(g){ return g[0]!=='gold'; }).map(function(g){ return ' · '+(g[0]==='exp'?'경험치':T2.get(g[0]).name)+' ×'+W.fmt(g[1]); }).join('')+'. 다음 의뢰는 준비되면 열린다.']]); });
    var gb=$('#q-go'); if(gb) gb.addEventListener('click', function(){ var route=TW_STORY.routeForQuest(q.id);if(!route||TW_STORY.questState(q.id)==='locked')return;TW_STORY.brief(route.id,function(){location.href=route.dungeon;}); });
  }
  function questAction(q){ var ST=window.TW_STORY; if(!ST) return ''; var st=ST.questState(q.id);
    if(st==='available') return '<button type="button" class="btn btn--primary mt3" id="q-go" style="width:100%">출격 — '+q.sub+'</button>';
    if(st==='cleared') return '<button type="button" class="btn btn--primary mt3" id="q-claim" style="width:100%">의뢰 보수 수령 · '+W.fmt(q.reward)+' G</button>';
    if(st==='claimed') return '<button type="button" class="btn mt3" id="q-go" style="width:100%">재출격 — '+q.sub+'</button>';
    return '<div class="xs t-faint mt3">잠김 — 다음 장에서 열린다</div>'; }
  function cards(){
    $('#p-cards').innerHTML = W.PARTY_ORDER.map(function(id,i){ var c=W.CHARS[id];
      return '<div class="pcard'+(i===0?' is-on':'')+'"><div class="pcard__top">'+W.face(id,'pcard__face')+'<div class="fill"><div class="pcard__nm">'+c.nm+'</div><div class="pcard__lv">'+(id==='ain'&&window.TW_GRADE?'등급 '+TW_GRADE.agent().g:'등급 '+(window.TW_GRADE?TW_GRADE.lvGrade(c.lv):c.lv))+'</div><div class="pcard__cp">전투력 '+W.fmt(c.cp)+'</div></div>'+
        '<svg class="ico pcard__role"><use href="#i-'+c.icon+'"/></svg></div><div class="pcard__ready"><svg class="ico ico--xs"><use href="#i-check"/></svg>준비 완료</div></div>'; }).join('');
  }
  /* 시트의 «전투 준비» 띠 — 지금 무엇과 싸우러 가는지 한 줄. 훈련 미수료면 훈련장을 가리킨다. */
  function prepBar(){
    var ST=window.TW_STORY, bar=$('#of-prep-bar'); if(!bar) return;
    var ch=ST&&(ST.cleared('tutorial')?ST.routeForQuest(cur):ST.ch('ch1'))||null;
    var locked=!ch||(ST&&ch.quest&&ST.questState(ch.quest)==='locked');
    bar.classList.toggle('is-locked',!!locked);
    $('#of-prep').textContent=ch?ch.title:W.PARTY.office.prep;
    $('#of-prep-art').src='art/'+((ch&&ch.art)||'forge-kain')+'.webp';
    bar.setAttribute('href',(ch&&ch.dungeon)||'game3d.html');
    bar.dataset.ch=(ch&&ch.id)||'ch1';
  }
  $('#of-prep-bar').addEventListener('click', function(e){
    var ST=window.TW_STORY; if(!ST) return; var href=this.getAttribute('href');
    if(ST.brief(this.dataset.ch||'ch1', function(){ location.href=href; })) e.preventDefault(); });
  $('#q-rows').addEventListener('click', function(e){ var r=e.target.closest('[data-q]'); if(!r) return; cur=r.dataset.q; rows(); info(); prepBar(); });
  var o=W.PARTY.office;
  $('#of-owner').textContent=o.owner;
  $('#of-lv').textContent='사무소 '+o.lv+'등급'; $('#of-exp').textContent=W.fmt(o.exp[0])+' / '+W.fmt(o.exp[1]);
