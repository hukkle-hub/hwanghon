<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황혼 N01 · 5급 6종 동작 검수</title>
<style>body{overflow:hidden;margin:0;background:#10161c;color:#e7edf2;font:14px system-ui}canvas{display:block}header{position:absolute;inset:12px 12px auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{min-height:64px;padding:8px 12px;background:#293541;color:white;border:1px solid #6a7d8c;border-radius:6px}#hud{overflow:hidden;position:absolute;inset:0;pointer-events:none}.tag{position:absolute;text-align:center;white-space:nowrap;font-weight:600;text-shadow:0 1px 4px black}.tag small{display:block;font-size:11px;color:#9ab0c2}.mobhp{position:absolute;width:70px;height:4px;background:#501a22}.mobhp i{display:block;height:100%;background:#e94a57}#note{position:absolute;bottom:10px;left:12px;right:12px;color:#bac8d5;font-size:12px;max-height:100px;overflow:auto}#status{color:#9cddc9} @media(max-width:700px){header{font-size:12px}#note{font-size:10px}.tag{font-size:10px}.tag small{font-size:8px}}</style>
<div id="hud"></div><header><b>N01 · 5급 6종 검수 후보</b><select id="mode" aria-label="검수 동작"><option value="skill">전용 스킬</option><option value="walk">이동</option><option value="idle">대기</option><option value="hit">피격</option><option value="die">쓰러짐</option><option value="ai">역할 AI</option></select><select id="focus" aria-label="확대 대상"><option value="all">6종 전체</option></select><button id="view">정면 / 후면</button><button id="pause">일시 정지</button><button id="reset">다시 재생</button><span id="status">로딩 중</span></header><div id="note">실제 게임의 몸 로더·동작 선택·예고 고리와 순수 전투 모듈을 사용합니다. 역할 AI의 시설·대상은 검수용이며 운영 N01 이벤트가 아닙니다. 기기 실측·최종 승인 전 후보입니다.</div>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {clone} from '../../vendor/three/SkeletonUtils.js';
import {createMobView} from '../../js/mmo/field-mobs.js';
import {N01_BODIES} from '../../js/mmo/n01-body-catalog.js';
import {CATALOG} from '../../js/mmo/monster-catalog.js';
import {loadCjs} from '../../js/mmo/cjs-browser.js';
const defaultNote=document.querySelector('#note').textContent;
const detail=new URLSearchParams(location.search).get('detail')==='high'?'high':'mobile',quality=document.createElement('select');quality.setAttribute('aria-label','모델 품질');quality.innerHTML='<option value="mobile">모바일 경량본</option><option value="high">확대 검수 원본</option>';quality.value=detail;document.querySelector('header').insertBefore(quality,document.querySelector('#status'));quality.onchange=e=>{const u=new URL(location.href);u.searchParams.set('detail',e.target.value);location.href=u;};
const MOB=await loadCjs('../../server/field-mob-combat.cjs'),ids=Object.keys(N01_BODIES),names=ids.map(id=>CATALOG.find(m=>m.id===id).name),loader=new GLTFLoader(),assets=new Map();
const scene=new T.Scene();scene.background=new T.Color(0x10161c);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xd5e5ff,0x27303b,1.6));for(const [pos,color,power] of [[[2,5,5],0xffffff,3],[[-4,3,-3],0xffcf9d,1]]){const l=new T.DirectionalLight(color,power);l.position.set(...pos);scene.add(l);}
const floor=new T.Mesh(new T.PlaneGeometry(80,40),new T.MeshStandardMaterial({color:0x252e37,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new T.GridHelper(40,40,0x4e5f6e,0x303d48));
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);let focus='all',rear=false,mode='skill',paused=false,time=0,nextBeat=0,beat=0,generation=1,frames=0;
const positions=ids.map((_,i)=>(i-2.5)*3),props=[];
function fit(){const idx=ids.indexOf(focus),x=idx<0?0:mobs[idx].x,z=idx<0?0:mobs[idx].z,dist=idx<0?Math.max(18,9/(Math.tan(35*Math.PI/360)*camera.aspect)):Math.max(5.3,1.15/(Math.tan(35*Math.PI/360)*camera.aspect));camera.position.set(x,idx<0?5:2.0,z+(rear?-dist:dist));camera.lookAt(x,idx<0?.8:1.0,z);}
fit();function tagAt(el,x,y,z){const p=new T.Vector3(x,y,z).project(camera);el.style.left=(p.x*.5+.5)*innerWidth+'px';el.style.top=(-p.y*.5+.5)*innerHeight+'px';el.style.transform='translate(-50%,-100%)';}
await Promise.all(ids.map(async id=>{const a=N01_BODIES[id];assets.set(id,await loader.loadAsync('../../'+(detail==='high'?a.highUrl:a.url)));}));
const view=createMobView({THREE:T,clone,scene,loadBody:async()=>assets.get(ids[0]),loadBodyFor:id=>({...N01_BODIES[id],load:async()=>assets.get(id)}),hud:document.querySelector('#hud'),tagAt,catalog:CATALOG});
const stats=ids.map(id=>MOB.validateStats(MOB.statsFor(id))),mobs=[],states=[],hits=[];const nav={legal:()=>true,canTraverse:()=>true,safe:()=>false,route:(_a,_p,q)=>[q]};
function restart(){generation++;time=0;nextBeat=0;beat=0;hits.length=0;mobs.length=0;states.length=0;document.querySelector('#note').textContent=defaultNote;for(const p of props)scene.remove(p);props.length=0;
 for(let i=0;i<ids.length;i++){const x=positions[i],m={id:'review:'+i+':0',catalogId:ids[i],x,z:0,alive:true,generation,anim:'idle',group:{area:'review'}};mobs.push(m);states.push(MOB.reset(m,0));
 if(mode==='ai'){const isWalker=ids[i]==='G5_WALKER',prop=new T.Mesh(isWalker?new T.CapsuleGeometry(.25,.95,4,12):new T.BoxGeometry(.45,ids[i]==='G5_ARMORED'?1.4:1,.35),new T.MeshStandardMaterial({color:ids[i]==='G5_BREAKER'?0x527a9d:0x7e6e52,transparent:isWalker,opacity:isWalker?.4:1}));prop.position.set(x,isWalker?.95:.5,ids[i].includes('RUNNER')||ids[i].includes('STALKER')?3.5:2);scene.add(prop);props.push(prop);}}
}
const skillKeys={G5_WALKER:['slow_combo'],G5_RUNNER:['flank_swipe'],G5_BREAKER:['structure_slam','heavy_slam'],G5_STALKER:['tracking_strike'],G5_ARMORED:['shield_bash','heavy_charge','overhead_crush'],G5_RESONATOR:['aura_cast','self_defence']};
function step(dt){time+=dt;const now=Math.round(time*1000);if(mode==='ai'){
 for(let i=0;i<mobs.length;i++){const m=mobs[i],x=positions[i],id=m.catalogId,p={id:'player:'+i,x,z:2,alive:true},npc={id:'npc:'+i,x,z:3.5,role:'technician',alive:true},f={id:'facility:'+i,x,z:2,kind:id==='G5_ARMORED'?'gate':'generator',alive:true};
 const context={facilities:['G5_BREAKER','G5_ARMORED'].includes(id)?[f]:[],npcs:['G5_STALKER','G5_RUNNER'].includes(id)?[npc]:[],flankPoints:[{id:'flank:'+i,x:x+1.1,z:1,alive:true}],allies:id==='G5_RESONATOR'?[{id:'support-target',catalogId:'G5_WALKER',alive:true,x,z:3.5}]:[]};
 const hit=MOB.tick(m,states[i],stats[i],['G5_RUNNER','G5_STALKER','G5_RESONATOR'].includes(id)?[]:[p],now,nav,context);if(hit){hits.push(names[i]+' → '+(hit.targetKind||'player')+' / '+hit.skill+' / 피해 '+hit.damage);if(hits.length>4)hits.shift();}}
 }else if(time>=nextBeat){beat++;nextBeat=time+(mode==='skill'?3.5:mode==='die'?4.8:mode==='hit'?2:999);for(let i=0;i<mobs.length;i++){const m=mobs[i],a=states[i];a.seq++;m.alive=true;m.engaged=mode==='walk';m.anim=mode==='skill'?'attack':mode==='patrol'?'walk':mode;
 if(mode==='skill'){const keys=skillKeys[m.catalogId],key=keys[(beat-1)%keys.length],windupMs=key==='heavy_charge'?1000:key==='overhead_crush'?1200:key==='shield_bash'?800:600;a.action={key,clip:key,seq:a.seq,windupMs,startAt:now,targetX:m.x,targetZ:m.z+2};if(key==='aura_cast'){m.anim='idle';a.action.support=true;}}
 if(mode==='die'){m.generation++;m.anim='idle';a.reviewDieAt=now+400;}}}
 if(mode==='die')for(let i=0;i<mobs.length;i++)if(now>=states[i].reviewDieAt){mobs[i].alive=false;mobs[i].anim='die';}
 const rows=mobs.map((m,i)=>({...m,hp:m.alive?100:0,seq:states[i].seq,action:MOB.visualAction(m,states[i],now)})).filter(m=>focus==='all'||m.catalogId===focus);view.update(rows,dt);
 const perf=renderer.info.render,shown=[...view.views.values()].find(v=>v.cat.id===focus);document.querySelector('#status').textContent=assets.size+'종 · '+Math.round(perf.triangles).toLocaleString()+' 화면 삼각형 · '+perf.calls+' 그리기'+(shown?' · 재생 '+(shown.current?.getClip().name||'idle'):'');
 if(mode==='ai')document.querySelector('#note').textContent='검수용 시설·NPC (운영 이벤트 아님) | '+hits.join(' | ');}
const patrolOption=document.createElement('option');patrolOption.value='patrol';patrolOption.textContent='순찰 이동';document.querySelector('#mode').append(patrolOption);document.querySelector('#mode option[value="walk"]').textContent='전투 이동';
for(let i=0;i<ids.length;i++){const o=document.createElement('option');o.value=ids[i];o.textContent=names[i]+' 확대';document.querySelector('#focus').append(o);}document.querySelector('#focus').onchange=e=>{focus=e.target.value;fit();};document.querySelector('#mode').onchange=e=>{mode=e.target.value;restart();};document.querySelector('#view').onclick=()=>{rear=!rear;fit();};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시 정지';};document.querySelector('#reset').onclick=restart;
const deathInspect=document.createElement('button');deathInspect.textContent='쓰러짐 1초';deathInspect.onclick=()=>{mode='die';document.querySelector('#mode').value=mode;restart();for(let n=0;n<42;n++)step(1/30);paused=true;document.querySelector('#pause').textContent='재생';};document.querySelector('header').insertBefore(deathInspect,document.querySelector('#status'));
restart();let prev=performance.now();function draw(){requestAnimationFrame(draw);const n=performance.now(),dt=Math.min(.05,(n-prev)/1000);prev=n;if(!paused)step(dt);if(focus!=='all')fit();renderer.render(scene,camera);frames++;}draw();function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fit();}addEventListener('resize',resize);resize();
window.N01_REVIEW={get frames(){return frames;},get mode(){return mode;},get bodies(){return assets.size;},get hits(){return hits.slice();},get triangles(){return renderer.info.render.triangles;},get calls(){return renderer.info.render.calls;}};
</script></html>
