<!doctype html><meta charset="utf-8"><title>보스 5종 실제 필드 검수</title>
<style>body{margin:0;background:#111;color:white;font:12px sans-serif}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}aside{position:absolute;z-index:5;left:4px;top:4px;background:#10151dea;padding:6px;max-width:95vw}button,select{min-height:32px;margin:2px}output{display:block;max-width:550px}a{color:#bdf}</style>
<iframe id="world" title="실제 3D 필드"></iframe>
<aside><select id="boss" aria-label="보스"><option value="leviathan">레비아탄</option><option value="aegis">에이지스</option><option value="celestial2">셀레스티얼</option><option value="arsenal">아스널</option><option value="nova">노바</option></select><button id="near">보스 앞으로</button><button id="phase">단계 기술</button><button id="pause">일시정지</button><button id="record">15초 녹화</button><output id="status">로딩</output><a id="download" hidden download="boss-kit.webm">영상 저장</a></aside>
<script type="module">
import {loadCjs} from '../../js/mmo/cjs-browser.js';
const KIT=await loadCjs('../../server/field-boss-kit.cjs'), zones={leviathan:'hangang_tunnel',aegis:'yeouido',celestial2:'southroad',arsenal:'gyeryong_base',nova:'goheung_pad'};
const frame=document.querySelector('#world'), select=document.querySelector('#boss'), status=document.querySelector('#status');
const w=()=>frame.contentWindow.__W3D, boss=()=>w()?.fbs.find(o=>o.b.id===select.value);
let sequence=null;
const allButton=document.createElement('button');allButton.textContent='3기술 연속 검수';document.querySelector('aside').append(allButton);
const whole=document.createElement('button');whole.textContent='보스 전체 보기';document.querySelector('aside').append(whole);
whole.onclick=()=>{const a=w(),o=boss();if(!o)return;const dx=a.P.x-o.ai.x,dz=a.P.z-o.ai.z,n=Math.hypot(dx,dz)||1,h=o.h||6,dist=Math.max(12,h*2.2),y=o.root.position.y;a.view([o.ai.x+dx/n*dist,y+h*.8,o.ai.z+dz/n*dist],[o.ai.x,y+h*.45,o.ai.z]);};
allButton.onclick=()=>{const a=w(),o=boss();if(!o)return;a.hold=false;document.querySelector('#near').click();KIT.reset(o.ai,a.gameNow);sequence={id:select.value,names:Object.keys(KIT.KITS[select.value].skills),index:0,started:false};o.ai.kit.pattern=sequence.names[0];};
setInterval(()=>{if(!sequence||sequence.id!==select.value)return;const a=w(),o=boss(),k=o?.ai.kit;if(!k)return;if(k.state==='skill')sequence.started=true;if(sequence.started&&k.state!=='skill'){sequence.index++;sequence.started=false;if(sequence.index>=sequence.names.length){sequence=null;return;}document.querySelector('#near').click();k.pattern=sequence.names[sequence.index];}},50);
select.onchange=()=>{frame.src='../../world3d.html?zone='+zones[select.value]+'&offline=1&debug=1&lod=1';}; select.onchange();
document.querySelector('#near').onclick=()=>{const a=w(),o=boss();if(!o)return; a.stage.skip(); a.P.hp=1000000; a.P.dead=false;const sp=a.meta.spawn,dx=(sp?.x??0)-o.ai.x,dz=(sp?.z??0)-o.ai.z,n=Math.hypot(dx,dz)||1,d=Math.min(10,KIT.KITS[select.value].aggro-2); a.teleport(o.ai.x+dx/n*d,o.ai.z+dz/n*d,Math.atan2(-dx,-dz));a.orbit(Math.atan2(dx,dz),.22,10);o.stage.seen=true;}; // QA endurance only, maxHp/damage unchanged; never loaded by production
document.querySelector('#phase').onclick=()=>{const o=boss();if(o)o.ai.hp=o.ai.max*.49;};
document.querySelector('#pause').onclick=()=>{const a=w();if(a)a.hold=!a.hold;};
document.querySelector('#record').textContent='30초 녹화';
document.querySelector('#record').onclick=()=>{const cv=frame.contentDocument.querySelector('canvas'),out=document.querySelector('#download'),id=select.value;if(!cv)return;out.hidden=true;const stream=cv.captureStream(24),r=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];r.ondataavailable=e=>chunks.push(e.data);r.onstop=async()=>{const blob=new Blob(chunks,{type:'video/webm'});out.href=URL.createObjectURL(blob);out.download=id+'-actual-field.webm';out.hidden=false;stream.getTracks().forEach(t=>t.stop());try{const saved=await fetch('http://127.0.0.1:8795/'+id,{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});out.textContent=saved.ok?await saved.text():'로컬 저장 실패';}catch{out.textContent='영상 저장';}};r.start();setTimeout(()=>r.stop(),30000);};
setInterval(()=>{const a=w(),o=boss();status.textContent=a&&o?`${select.value} · KIT ${!!o.ai.kit} · ${o.ai.kit?.state}/${o.ai.kit?.skill||'-'} · ${Math.round(a.gameNow)}ms · clips ${Object.keys(o.kacts||{}).length} · HP ${Math.round(a.P.hp)} · frame ${a.frames} · ${frame.clientWidth}×${frame.clientHeight} · boss ${o.ai.x.toFixed(1)},${o.ai.z.toFixed(1)} player ${a.P.x.toFixed(1)},${a.P.z.toFixed(1)} root ${o.root.position.x.toFixed(1)},${o.root.position.z.toFixed(1)} model ${o.model.position.x.toFixed(1)},${o.model.position.z.toFixed(1)}`:'필드·몸체 로딩 중';},300);
</script>
