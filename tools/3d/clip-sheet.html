<!doctype html><meta charset="utf-8"><title>클립 시트</title>
<!-- 아무 GLB 의 클립 시트 (문서 225 — jeong-sheet 에서 갈래): ?glb=../../art/3d/part1/clave.glb&clips=atk_claveshut&n=6&fix=2,3
     fix=hops,cut: js/mmo/skin-fix.js 를 먼저 건다(늘어남 비교). saber=1: 정 장관 군도. window.READY 가 1 이 되면 다 그린 것. -->
<style>body{margin:0;background:#12161a;color:#cfd6dc;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {attachSaber} from '../../js/mmo/jeong-saber.js';
import {fixSkin, rebindModel} from '../../js/mmo/skin-fix.js';
const Q=new URLSearchParams(location.search), CELL=+(Q.get('cell')||260), N=+(Q.get('n')||6), AZ=+(Q.get('az')||35)*Math.PI/180, EL=+(Q.get('el')||8)*Math.PI/180;
const g=await new GLTFLoader().loadAsync(Q.get('glb')||'../../art/3d/part1/clave.glb'), model=g.scene; window.FIX=Q.get('fix')==='rebind'?rebindModel(T,model,{tube:+(Q.get('tube')||0)}):Q.get('fix')?fixSkin(model,...Q.get('fix').split(',').map(Number)):null; const SABER=Q.get('saber')?attachSaber(T, model):null;
const names=(Q.get('clips')||g.animations.map(a=>a.name).join(',')).split(',');
const times=Q.get('times')?Q.get('times').split(',').map(Number):Array.from({length:N},(_,i)=>i/(N-1));
const cv=document.getElementById('c'); cv.width=CELL*times.length; cv.height=CELL*names.length;
const r=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true}); r.setPixelRatio(1); r.setSize(cv.width,cv.height,false);
r.outputColorSpace=T.SRGBColorSpace; r.toneMapping=T.ACESFilmicToneMapping; r.toneMappingExposure=1.3; r.setScissorTest(true); r.autoClear=false; r.setClearColor(0x12161a,1); r.clear();
const s=new T.Scene(); s.add(new T.HemisphereLight(0xdde6ff,0x303440,+(Q.get('light')||1.6))); const k=new T.DirectionalLight(0xffe8cc,2.6); k.position.set(2,4,3); s.add(k); const rim=new T.DirectionalLight(0x9fb8e8,1.2); rim.position.set(-3,2,-3); s.add(rim);
const fl=new T.Mesh(new T.CircleGeometry(4,48).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x2c3338,roughness:.95})); s.add(fl); const grid=new T.GridHelper(8,16,0x6d7f8a,0x3c474e); grid.position.y=.003; s.add(grid);
s.add(model); const mixer=new T.AnimationMixer(model), cam=new T.PerspectiveCamera(30,1,.05,50);
if(Q.get('bones')){ model.traverse(o=>{ if(o.isMesh){ const m=(Array.isArray(o.material)?o.material:[o.material]).map(x=>{ const c=x.clone(); c.transparent=true; c.opacity=.28; c.depthWrite=false; return c; }); o.material=Array.isArray(o.material)?m:m[0]; } });   /* bones=1: 몸은 비치게, 뼈는 위에 — 왼쪽 빨강·오른쪽 파랑 */
  const sk=new T.SkeletonHelper(model); sk.material.depthTest=false; sk.material.linewidth=2; const col=sk.geometry.attributes.color; sk.bones.forEach((b,i)=>{ const c=/Left/.test(b.name)?[1,.25,.2]:/Right/.test(b.name)?[.25,.55,1]:[1,1,.4]; for(const k of [i*2,i*2+1]) if(k<col.count) col.setXYZ(k,...c); }); col.needsUpdate=true; sk.renderOrder=9; s.add(sk); }
const rest=[]; model.traverse(o=>{ if(o.name!=='JeongSaber') rest.push([o,o.position.clone(),o.quaternion.clone()]); });
window.INFO=[];
names.forEach((n,row)=>{ const clip=g.animations.find(a=>a.name===n); if(!clip) return; const act=mixer.clipAction(clip); mixer.stopAllAction();
  times.forEach((u,col)=>{ for(const [o,p,q] of rest){o.position.copy(p);o.quaternion.copy(q);} act.reset(); act.play(); act.paused=true; act.time=u*clip.duration; mixer.update(0); model.updateMatrixWorld(true); SABER&&SABER.update();
    const box=new T.Box3().setFromObject(model), c=box.getCenter(new T.Vector3()); c.y=+(Q.get('cy')||1.0); const d=+(Q.get('d')||5.6);
    let az=AZ; if(Q.get('track')==='head'){ const h=model.getObjectByName('mixamorigHead'); h.getWorldPosition(c); c.y+=.08; const f=new T.Vector3(0,0,1).applyQuaternion(h.getWorldQuaternion(new T.Quaternion())); az+=Math.atan2(f.x,f.z); }   /* 얼굴 따라가기: 머리 정면 기준 */
    cam.position.set(c.x+d*Math.sin(az)*Math.cos(EL),c.y+d*Math.sin(EL),c.z+d*Math.cos(az)*Math.cos(EL)); cam.lookAt(c);
    const x=col*CELL,y=cv.height-(row+1)*CELL; r.setViewport(x,y,CELL,CELL); r.setScissor(x,y,CELL,CELL); r.clear(); r.render(s,cam);
    const W=o=>o?o.getWorldPosition(new T.Vector3()).toArray().map(v=>+v.toFixed(3)):null, slot=model.getObjectByName('mixamorigRightHandSlot'), hand=model.getObjectByName('mixamorigRightHand'), sab=model.getObjectByName('JeongSaber'), sb=sab?new T.Box3().setFromObject(sab):null;
    window.INFO.push({clip:n,t:+(u*clip.duration).toFixed(2),minY:+box.min.y.toFixed(3),maxY:+box.max.y.toFixed(3),hand:W(hand),slot:W(slot),slotScale:slot&&slot.getWorldScale(new T.Vector3()).toArray().map(v=>+v.toFixed(3)),saber:sb&&[sb.min.toArray().map(v=>+v.toFixed(2)),sb.max.toArray().map(v=>+v.toFixed(2))]}); }); });
{ let sm=null; model.traverse(o=>{ if(o.isSkinnedMesh) sm=o; }); const bi=sm.skeleton.bones.findIndex(b=>/RightHand$/.test(b.name)), fi=sm.skeleton.bones.findIndex(b=>/RightForeArm$/.test(b.name)), sw=sm.geometry.attributes.skinWeight, si=sm.geometry.attributes.skinIndex, v=new T.Vector3();
  const cen=(idx)=>{ const c=new T.Vector3(); let n=0, wsum=0; for(let i=0;i<si.count;i++){ let w=0; for(let k=0;k<4;k++) if(si.getComponent(i,k)===idx) w+=sw.getComponent(i,k); if(w>.5){ sm.getVertexPosition(i,v); sm.localToWorld(v); c.add(v); n++; } } return n?c.divideScalar(n).toArray().map(x=>+x.toFixed(3)).concat([n]):null; };
  window.SKIN={ handVerts:cen(bi), foreVerts:cen(fi), bindMode:sm.bindMode, boneCount:sm.skeleton.bones.length, names:sm.skeleton.bones.map(b=>b.name).join(',') }; }
window.NAMES=names; window.TIMES=times; window.READY=1;
</script>
