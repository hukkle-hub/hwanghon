<!doctype html><html lang="ko"><meta charset="utf-8"><title>실제 필드 캐릭터 검수</title>
<style>body{margin:0;background:#171c24;color:white;font:15px system-ui}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:10px}iframe{border:0;width:100%;height:75vh}pre{white-space:pre-wrap;font-size:12px}</style>
<header><label>캐릭터 <select id="char"><option>ain</option><option>kain</option><option>ryu</option><option>sera</option></select></label><label>시점 <select id="camera"><option value="game">실제 게임 카메라</option><option value="whole">전신</option><option value="upper">상체</option><option value="right">오른손</option><option value="left">왼손</option></select></label><button id="attack">기본 공격</button><button id="s1">스킬 1</button><button id="s2">스킬 2</button><button id="s3">스킬 3</button><button id="s4">스킬 4</button><label><input id="freeze" type="checkbox" checked>접점에서 정지</label><button id="resume">이어 재생</button><span id="status">실제 필드 읽는 중</span></header>
<header><button id="clearGate">입구 표시에서 3m 이동</button><button id="record">실제 필드 5동작 녹화</button><button id="save">로컬 필드 영상 저장</button><a id="download" hidden>실제 필드 영상 저장</a><span id="progress"></span></header><iframe id="game" title="실제 3D 필드"></iframe><pre id="metrics"></pre>
<script src="../../js/dungeons.js"></script>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {contactOf} from '../../js/mmo/field-feel.js';
const q=new URLSearchParams(location.search),ch=q.get('char')||'ain',frame=document.querySelector('#game'),status=document.querySelector('#status'),out=document.querySelector('#metrics');
if(!['localhost','127.0.0.1'].includes(location.hostname))document.querySelector('#save').hidden=true;
document.querySelector('#char').value=ch;
document.querySelector('#char').onchange=()=>{q.set('char',document.querySelector('#char').value);location.search=q;};
frame.src='../../world3d.html?zone=pangyo_lab&char='+ch+'&offline=1&debug=1&lod='+(q.get('lod')||'0');
let target=null,ready=false,queue=[],record=null,parts=[],playing=null,completed=[];
const w=()=>frame.contentWindow.__W3D;
document.querySelector('#resume').onclick=()=>{target=null;w().hold=false;};
document.querySelector('#clearGate').onclick=()=>{const g=w(),p=g?.me?.hero?.root.position;if(p)g.teleport(p.x+3,p.z);};
document.querySelector('#save').onclick=async()=>{const a=document.querySelector('#download');if(!a.href||a.hidden)return;try{const blob=await(await fetch(a.href)).blob(),r=await fetch('http://127.0.0.1:8797/capture/'+ch+'-field-skills.webm',{method:'POST',body:blob});if(!r.ok)throw new Error('HTTP '+r.status);status.textContent='로컬 필드 영상 저장 완료';}catch(e){status.textContent='영상 저장 실패: '+e.message;}};
function trigger(n){const g=w();if(!g)return;g.hold=false;const ok=n===0?(g.attack(),true):g.castSkill(n-1);if(!ok){status.textContent='실제 필드 재사용 대기/동작 진행 중';return;}target=n===0?'attack1':'skill'+n;status.textContent='실제 버튼 경로 · '+target;}
document.querySelector('#attack').onclick=()=>trigger(0);for(let i=1;i<=4;i++)document.querySelector('#s'+i).onclick=()=>trigger(i);
document.querySelector('#record').onclick=()=>{const g=w();if(!g)return;document.querySelector('#freeze').checked=false;g.hold=false;target=null;queue=[0,1,2,3,4];completed=[];playing=null;parts=[];record=new MediaRecorder(g.renderer.domElement.captureStream(30),{mimeType:'video/webm;codecs=vp9'});record.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};record.onstop=()=>{const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob(parts,{type:'video/webm'}));a.download=ch+'-actual-field.webm';a.hidden=false;status.textContent='실제 필드 녹화 완료';};record.start();};
function tick(){const g=w();if(g?.me?.hero){const h=g.me.hero,b={};h.model.traverse(o=>{if(o.isBone)b[o.name.replace(/^mixamorig:?/,'')]=o;});if(!ready){ready=true;status.textContent='실제 필드 준비 완료 · 시작 장비 유지';}
 const c=h.current?.getClip(),time=h.current?.time||0;if(target===c?.name&&document.querySelector('#freeze').checked&&time>=contactOf(ch,c.name)*c.duration){g.hold=true;status.textContent='접점 정지 · '+target;target=null;}
 if(record?.state==='recording'&&c?.name==='idle'){if(playing){completed.push(playing);playing=null;}if(queue.length){const n=queue[0],ok=n===0?(g.attack(),true):g.castSkill(n-1);if(ok){queue.shift();playing=n===0?'attack1':'skill'+n;}}else record.stop();}document.querySelector('#progress').textContent='완료 동작: '+completed.join(', ');
 const mode=document.querySelector('#camera').value,p=mode==='right'?b.RightHand.getWorldPosition(new T.Vector3()):mode==='left'?b.LeftHand.getWorldPosition(new T.Vector3()):mode==='upper'?b.Spine2.getWorldPosition(new T.Vector3()):h.root.position.clone().add(new T.Vector3(0,1.65,0)),dist=mode==='whole'?6.8:mode==='upper'?2.3:.65,dir=new T.Vector3(0,.08,1).applyAxisAngle(new T.Vector3(0,1,0),h.root.rotation.y);if(mode!=='game')g.view(p.clone().addScaledVector(dir,dist).toArray(),p.toArray());
 out.textContent=JSON.stringify({character:ch,clip:c?.name,time,frames:g.frames,held:g.hold,rig:h.rig?.diagnostics,armorMeshes:h.root.children.length,health:g.P.hp},null,2);
 }requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
