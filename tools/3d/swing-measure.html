<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>휘두름 계측 — 아인</title></head><body>
<!-- 「낫이 무겁게 안 보인다」를 «수치» 로 만든다.
     게임이 실제로 재생하는 그대로(클립 교체 → 행동 타임라인 리맵 → 두손 리그 →
     체간 스윙)를 프레임마다 돌려 날 끝을 찍고, 벤치마크 항목과 같은 축으로 잰다:
       경로   날 끝이 지나간 총 거리 (m)
       각폭   자루가 쓸고 간 각도 (°)
       최고속 정점 속도와 «그게 궤적의 몇 % 지점인가» — 업계 권장 60~70%
       넘김   접점을 지나 더 간 각도 (°) — 권장 30~60°
       몸통   접점 때의 몸통 비틀기 (°)
     docs/design/66-scythe-weight.md -->
<script src="../../js/world.js"></script>
<script src="../../js/items.js"></script>
<script src="../../js/save.js"></script>
<script src="../../js/dungeons.js"></script>
<script src="../../js/combat-quality.js"></script>
<script src="../../js/swing-body.js"></script>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {repairAinBind,repairAinClips} from '../../js/ain-bind-repair.js';
import {GRIP_DIAG} from '../../js/ain-grip-ik.js';
import {makeAinRigAdapter, AIN_SWING_GAIN, AIM_DIAG} from '../../js/ain-two-hand.js';
import {sampleAction} from '../../js/combat-motion.js';
window.THREE=T;
const R=window.TW_DUNGEONS.RULES, CONTACTS=R.motion.clipContacts||{}, SPAN=R.motion.clipSpan||{};
const loader=new GLTFLoader();
const g=await loader.loadAsync('../../art/3d/ain_anim.glb');
const sc=new T.Scene(); sc.add(g.scene);
let slot=null; g.scene.traverse(o=>{ if(o.isBone&&/RightHandSlot/.test(o.name)) slot=o; });
let tip=null;
const w=await loader.loadAsync('../../art/3d/ain_scythe_tex.glb');
slot.add(w.scene); const blade=w.scene;
blade.updateWorldMatrix(true,true);
const inv=new T.Matrix4().copy(blade.matrixWorld).invert();
let far=null, farD=-1;
blade.traverse(o=>{ if(!o.isMesh||!o.geometry) return;
 o.geometry.computeBoundingBox(); const bb=o.geometry.boundingBox;
 for(let i=0;i<8;i++){ const v=new T.Vector3(i&1?bb.max.x:bb.min.x,i&2?bb.max.y:bb.min.y,i&4?bb.max.z:bb.min.z);
  v.applyMatrix4(o.matrixWorld).applyMatrix4(inv); if(v.length()>farD){farD=v.length(); far=v.clone();} }});
tip=far; window.TIPLEN=farD;
/* 게임과 같은 순서: 본 보정 → 클립 교체 → 리그 */
const clips=repairAinClips(g.animations, repairAinBind(g.scene));
const mixer=new T.AnimationMixer(g.scene);
/* 본 이름에 mixamorig: 접두가 붙어 있다 — 떼고 담는다(게임 코드와 같게) */
const bones={}; g.scene.traverse(o=>{ if(o.isBone) bones[o.name.replace(/^mixamorig:?/,'')]=o; });
const rest={}; for(const k in bones) rest[k]=bones[k].quaternion.clone();
function reset(){ for(const k in bones) bones[k].quaternion.copy(rest[k]); }
const rig=makeAinRigAdapter(g.scene, g.scene, slot);
const byName={}; clips.forEach(c=>byName[c.name]=c);

window.measure=function(name, durOverride, noRig){
  const clip=byName[name]; if(!clip) return null;
  const hit=CONTACTS[name]; if(hit==null) return null;
  const span=SPAN[name]||1;
  /* 행동 길이·접점 시각은 «게임 규칙» 에서 그대로 — 시트가 게임과 어긋날 수 없게.
     아인 전용 프로파일이 있으면 그게 이긴다 (game3d 와 같은 순서). */
  const M=R.motion, prof=(M.characterProfiles&&M.characterProfiles.ain)||{};
  const KIND={attack1:'light',attack2:'light',attack3:'light',smash:'smash',
              counter:'counter',exec:'exec',ult:'ult',
              skill1:'skill',skill2:'skill',skill3:'skill',skill4:'skill'};
  const base=M[KIND[name]]||M.light;
  const P=prof[name]||{};
  const dur=durOverride||P.duration||base.duration;
  const hitAt=(P.hit!=null?P.hit:base.hit)*(durOverride?durOverride/(P.duration||base.duration):1);
  const act={id:'m', clip:name, kind:'attack', duration:dur, hitAt:hitAt, elapsed:0, clipHit:hit, combo:0};
  const N=240, dt=dur/N;
  const pts=[], shafts=[], torso=[];
  const a=mixer.clipAction(clip); a.reset(); a.play(); a.paused=true;
  for(let i=0;i<=N;i++){
    act.elapsed=dur*i/N;
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    const ca=Object.assign({},act,{clipHit:hit/span});
    a.time=Math.max(0,Math.min(clip.duration, sampleAction(ca, clip.duration*span)));
    mixer.update(0);
    if(!noRig) rig.apply(act, false, false, dt, name, null);
    else rig.restore();
    sc.updateMatrixWorld(true);
    const p=tip.clone().applyMatrix4(blade.matrixWorld);
    const handW=new T.Vector3(); slot.getWorldPosition(handW);
    pts.push(p); shafts.push(p.clone().sub(handW).normalize());
    torso.push(bones.Spine2?bones.Spine2.getWorldQuaternion(new T.Quaternion()).clone():null);
  }
  /* 경로 길이 · 속도 */
  let path=0; const seg=[];
  for(let i=1;i<=N;i++){ const d=pts[i].distanceTo(pts[i-1]); path+=d; seg.push(d/dt); }
  /* 속도는 조금 다듬어서 본다 — 표본 잡음으로 정점이 튀지 않게 */
  const sm=seg.map((_,i)=>{ let s=0,n=0; for(let k=-3;k<=3;k++){ const j=i+k; if(j>=0&&j<seg.length){s+=seg[j];n++;} } return s/n; });
  let peak=0, peakI=0; sm.forEach((v,i)=>{ if(v>peak){peak=v; peakI=i;} });
  /* 정점이 «궤적의» 몇 % 인가 — 시간이 아니라 지나간 거리 기준 */
  let run=0; for(let i=0;i<peakI;i++) run+=seg[i]*dt;
  const peakArcPct=path>0?run/path*100:0;
  /* 각폭 · 넘김: 자루 방향이 쓸고 간 각 */
  const ang=(u,v)=>Math.acos(Math.max(-1,Math.min(1,u.dot(v))))*180/Math.PI;
  let sweep=0; const srate=[];
  for(let i=1;i<=N;i++){ const a=ang(shafts[i],shafts[i-1]); sweep+=a; srate.push(a/dt); }
  /* 자루 각속도의 정점/평균 — tools/3d/clip-to-path.mjs 와 같은 잣대로 */
  const sMean=srate.reduce((a,b)=>a+b,0)/srate.length, sPeak=Math.max.apply(null,srate);
  const hi=Math.max(0,Math.min(N,Math.round(hitAt/dur*N)));
  let after=0; for(let i=hi+1;i<=N;i++) after+=ang(shafts[i],shafts[i-1]);
  let before=sweep-after;
  /* 몸통 비틀기(접점) — 체간 스윙이 넣은 값 */
  const SB=globalThis.TW_SWING_BODY;
  const sh=SB.shape(0.42, SB.weightOf(name,0));
  const shPeak=(function(){ let m=0; for(let k=0;k<=100;k++){ const s=SB.shape(k/100,SB.weightOf(name,0)); m=Math.max(m,Math.abs(s.yaw)); } return m; })();
  /* 바닥 최저 높이 */
  let lowest=Infinity, highest=-Infinity;
  pts.forEach(p=>{ lowest=Math.min(lowest,p.y); highest=Math.max(highest,p.y); });
  return { clip:name, dur:+dur.toFixed(2), hitAt:+hitAt.toFixed(2), path:+path.toFixed(2), sweep:Math.round(sweep),
    before:Math.round(before), after:Math.round(after),
    peak:+peak.toFixed(1), peakArcPct:Math.round(peakArcPct),
    /* 자루 각속도 — 전문가 클립(tools/3d/clip-to-path.mjs)과 같은 잣대 */
    sMean:Math.round(sMean), sPeak:Math.round(sPeak), sRatio:+(sPeak/sMean).toFixed(2),
    torsoAtHit:+(sh.yaw*180/Math.PI).toFixed(1), torsoPeak:+(shPeak*180/Math.PI).toFixed(1),
    low:+lowest.toFixed(2), high:+highest.toFixed(2),
    /* 10등분 프로파일: 각 구간의 «각속도(°/s)» 와 «날끝 속도(m/s)» */
    prof:(function(){ const out=[]; const B=10, per=Math.floor(N/B);
      for(let b=0;b<B;b++){ let d=0, ar=0;
        for(let i=b*per+1;i<=(b+1)*per;i++){ d+=pts[i].distanceTo(pts[i-1]); ar+=ang(shafts[i],shafts[i-1]); }
        out.push([Math.round(ar/(per*dt)), +(d/(per*dt)).toFixed(1)]); }
      return out; })(),
    hitBin:Math.min(9,Math.floor(hitAt/dur*10)) };
};
/* 클립 «원본» 에서 날끝이 제일 빠른 시각. 판정(clipContacts)이 여기 맞아야
   때리는 그림과 맞는 순간이 같아진다 (docs/design/49). punch.py 는 손 위치로
   쟀지만 낫은 «날 끝» 이 때린다 — 자루 끝이 아니라 끝점으로 다시 잰다. */
/* 판정 값을 «파이프라인 그대로» 돌려 가며 고른다.
   rawPeak 은 리그를 안 씌운 원본 클립을 재므로 실제 화면과 다르다 —
   리그(두 손 그립·체간 스윙)가 자세를 크게 바꾸기 때문이다.
   그래서 clipContacts 후보를 훑으며 «접점 순간의 날끝 속도» 가 가장 큰 값을
   찾는다. 이게 곧 「때리는 그림과 맞는 순간이 같다」는 뜻이다. */
/* 휘두름 크기(gain)를 훑는다. 목표는 «날 끝 경로» 를 키우는 것 —
   제약은 tests/ain-two-hand 의 손목·연속성 검사다(여기선 못 돌리므로
   후보만 뽑고 실제 합격 여부는 node --test 로 따로 본다). */
/* 두 손 그립 IK 의 «조건수» 를 잰다.
   solveGripCircle 은 팔꿈치를 자루 축 둘레의 원 위에서 찾는데, 어깨가 그 축
   위에 놓이면(radial→0) 원 위 어느 점이든 답이 돼서 팔꿈치가 아무 데나 튄다.
   프레임마다 radial 과 팔꿈치 이동량을 찍어 «어디서 터지는가» 를 본다. */
/* 키 «바로 그 시각» 의 날 끝 속도. smootherstep 은 양 끝 속도가 0 이라
   키마다 무기가 멈춘다 — 스윙 한 번에 네 번 멈추는 셈이다. 정말 그런지 본다. */
window.keyStall=function(name){
  const clip=byName[name], hit=CONTACTS[name]; if(!clip||hit==null) return null;
  const M=R.motion, prof=(M.characterProfiles&&M.characterProfiles.ain)||{};
  const KIND={attack1:'light',attack2:'light',attack3:'light',smash:'smash',counter:'counter',
              exec:'exec',ult:'ult',skill1:'skill',skill2:'skill',skill3:'skill',skill4:'skill'};
  const base=M[KIND[name]]||M.light, P=prof[name]||{};
  const dur=P.duration||base.duration, hitAt=(P.hit!=null?P.hit:base.hit), span=SPAN[name]||1;
  const act={id:'k',clip:name,kind:'attack',duration:dur,hitAt:hitAt,elapsed:0,clipHit:hit,combo:0};
  const N=600, dt=dur/N, a=mixer.clipAction(clip), sp=[];
  let prev=null;
  for(let i=0;i<=N;i++){
    act.elapsed=dur*i/N;
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    a.time=Math.max(0,Math.min(clip.duration,sampleAction(Object.assign({},act,{clipHit:hit/span}),clip.duration*span)));
    mixer.update(0); rig.apply(act,false,false,dt,name,null); sc.updateMatrixWorld(true);
    const p=tip.clone().applyMatrix4(blade.matrixWorld);
    if(prev) sp.push(p.distanceTo(prev)/dt);
    prev=p;
  }
  const mean=sp.reduce((x,y)=>x+y,0)/sp.length;
  /* 리그의 키 시각(t = 행동 진행도 0~1)에서의 속도를 평균과 비교 */
  const KEYT=[0.20,0.42,0.65];   /* slash/chop 기준 내부 키 */
  const at=KEYT.map(kt=>{ const i=Math.min(sp.length-1,Math.round(kt*sp.length));
    return +(sp[i]/mean).toFixed(2); });
  return {clip:name, mean:+mean.toFixed(1), atKeys:at};
};
/* ── 눈으로도 보게 ──────────────────────────────────────────────────────
   숫자만으로는 디렉터가 확인할 수 없다. 계측과 «똑같은 경로» 로 한 장씩
   그린다: 클립 교체 → sampleAction 리맵 → 두손 리그 → 체간 스윙.
     window.shot('smash', 0.42)   → 동작 42% 지점을 그린다
   viewer.html·skill-pose.html 은 원본 클립을 그냥 재생하므로 이 수정(이음매)
   이 안 보인다 — 그래서 여기 붙였다. */
let REN=null, CAM=null;
function ensureView(){
  if(REN) return;
  const cv=document.createElement('canvas'); cv.id='view'; document.body.appendChild(cv);
  REN=new T.WebGLRenderer({canvas:cv,antialias:true});
  REN.setSize(420,560); REN.setPixelRatio(2);
  REN.toneMapping=T.ACESFilmicToneMapping; REN.toneMappingExposure=1.55;
  sc.background=new T.Color(0x12151a);
  sc.add(new T.HemisphereLight(0xcfe0ff,0x20242c,1.3));
  const k=new T.DirectionalLight(0xffffff,2.2); k.position.set(2.2,3.4,2.6); sc.add(k);
  const r2=new T.DirectionalLight(0x88aaff,1.4); r2.position.set(-2.4,2.0,-2.2); sc.add(r2);
  CAM=new T.PerspectiveCamera(34,420/560,0.1,50);
  CAM.position.set(2.6,1.5,3.0); CAM.lookAt(0,1.05,0);
}
window.shot=function(name,u){
  ensureView();
  const clip=byName[name]; if(!clip) return false;
  const hit=CONTACTS[name]; if(hit==null) return false;
  const M=R.motion, prof=(M.characterProfiles&&M.characterProfiles.ain)||{};
  const KIND={attack1:'light',attack2:'light',attack3:'light',smash:'smash',counter:'counter',
              exec:'exec',ult:'ult',skill1:'skill',skill2:'skill',skill3:'skill',skill4:'skill'};
  const base=M[KIND[name]]||M.light, P=prof[name]||{};
  const dur=P.duration||base.duration, hitAt=(P.hit!=null?P.hit:base.hit), span=SPAN[name]||1;
  const act={id:'c',clip:name,kind:'attack',duration:dur,hitAt:hitAt,elapsed:0,clipHit:hit,combo:0};
  const a=mixer.clipAction(clip);
  rig.restore();
  for(let k=0;k<12;k++){                       /* cond() 와 같은 예열 */
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    a.time=0; mixer.update(0);
    rig.apply(Object.assign({},act,{elapsed:0,clipHit:hit/span}), false, false, 0.05, name, null);
  }
  const dt=dur/180;
  for(let i=0;i<=Math.round(u*180);i++){
    const e=dur*i/180;
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    const ca=Object.assign({},act,{elapsed:e,clipHit:hit/span});
    a.time=Math.max(0,Math.min(clip.duration,sampleAction(ca,clip.duration*span)));
    mixer.update(0);
    rig.apply(Object.assign({},act,{elapsed:e}),false,false,dt,name,null);
  }
  sc.updateMatrixWorld(true);
  REN.render(sc,CAM);
  return true;
};
window.cond=function(name){
  const clip=byName[name]; if(!clip) return null;
  const hit=CONTACTS[name]; if(hit==null) return null;
  const M=R.motion, prof=(M.characterProfiles&&M.characterProfiles.ain)||{};
  const KIND={attack1:'light',attack2:'light',attack3:'light',smash:'smash',counter:'counter',
              exec:'exec',ult:'ult',skill1:'skill',skill2:'skill',skill3:'skill',skill4:'skill'};
  const base=M[KIND[name]]||M.light, P=prof[name]||{};
  const dur=P.duration||base.duration, hitAt=(P.hit!=null?P.hit:base.hit);
  const span=SPAN[name]||1;
  const act={id:'c',clip:name,kind:'attack',duration:dur,hitAt:hitAt,elapsed:0,clipHit:hit,combo:0};
  const N=180, dt=dur/N, a=mixer.clipAction(clip);
  /* ⚠ 예열이 필요하다. 리그는 «들고 다니는 자세 → 겨눔» 을 0.18초에 걸쳐
     섞는데(carryAmount), 예열 없이 재면 그 블렌딩이 스윙 앞부분에 섞여
     들어와 «끊김» 으로 잡힌다. 게임에서는 이미 겨눔 자세로 들어와 있다.
     처음 이걸 빠뜨려서 평타 2차 차분이 66~128 cm 로 나왔었다 — 계측 버그였다. */
  rig.restore();
  for(let k=0;k<12;k++){
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    a.time=0; mixer.update(0);
    rig.apply(Object.assign({},act,{elapsed:0,clipHit:hit/span}), false, false, 0.05, name, null);
  }
  GRIP_DIAG.reset(); AIM_DIAG.reset();
  let worstStep=0, worstAt=0; const pts=[];
  for(let i=0;i<=N;i++){
    act.elapsed=dur*i/N;
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    const ca=Object.assign({},act,{clipHit:hit/span});
    a.time=Math.max(0,Math.min(clip.duration,sampleAction(ca,clip.duration*span)));
    mixer.update(0);
    rig.apply(act,false,false,dt,name,null);
    sc.updateMatrixWorld(true);
    const L=bones.LeftForeArm&&bones.LeftForeArm.getWorldPosition(new T.Vector3());
    const Rt=bones.RightForeArm&&bones.RightForeArm.getWorldPosition(new T.Vector3());
    /* 입력(손·자루)과 출력(팔꿈치)을 «같은 잣대» 로 재서 어디서 끊기는지 가른다.
       입력이 부드러운데 출력만 튀면 푸는 쪽(IK) 문제, 입력부터 거칠면
       적어 둔 키 경로 문제다. */
    const HR=bones.RightHand&&bones.RightHand.getWorldPosition(new T.Vector3());
    const SH=new T.Vector3(0,1,0).applyQuaternion(slot.getWorldQuaternion(new T.Quaternion()));
    pts.push({L:L,R:Rt,H:HR,S:SH});
  }
  /* ⚠ «한 프레임 이동량» 은 튐이 아니다 — 빨리 휘두르면 당연히 크다.
     끊김은 «2차 차분»(속도의 변화)으로 봐야 한다. 부드러운 스윙은 빨라도
     2차 차분이 작고, 튀면 한 프레임에서만 크게 솟는다.
     단위는 60 fps 한 프레임으로 환산한다(표본 간격이 그보다 촘촘하므로). */
  const f=(1/60)/dt;
  const jolt=(side)=>{ let w=0,at=0;
    for(let i=2;i<=N;i++){
      const a0=pts[i-2][side], a1=pts[i-1][side], a2=pts[i][side];
      if(!a0||!a1||!a2) continue;
      const acc=a2.clone().sub(a1).sub(a1.clone().sub(a0)).length()*f*f;
      if(acc>w){ w=acc; at=i/N; }
    }
    return [w,at]; };
  const [eL]=jolt('L'), [eR,eAt]=jolt('R'), [hand]=jolt('H'), [shaft]=jolt('S');
  /* ⚠ 위 값은 «60 fps 한 프레임» 환산이라 동작이 짧을수록 커진다 — 1.15 초짜리
     스매시와 1.87 초짜리 전문가 클립을 그대로 비교하면 안 된다.
     시간에 안 휘둘리는 잣대: «표본당 2차 차분 ÷ 표본당 평균 1차 차분».
     무차원이고 표본 수(240)만 맞추면 클립 간 직접 비교가 된다.
     부드러운 스윙이면 1 안팎, 한 프레임에서 끊기면 크게 솟는다. */
  const norm=(side)=>{ let w=0,sum=0,n=0;
    for(let i=1;i<=N;i++){ const a=pts[i-1][side],b=pts[i][side];
      if(!a||!b) continue; sum+=b.distanceTo(a); n++; }
    const m=n?sum/n:0;
    let at=0;
    for(let i=2;i<=N;i++){ const a0=pts[i-2][side],a1=pts[i-1][side],a2=pts[i][side];
      if(!a0||!a1||!a2) continue;
      const v=a2.clone().sub(a1).sub(a1.clone().sub(a0)).length();
      if(v>w){ w=v; at=i/N; } }
    return [m>1e-9?w/m:0, at]; };
  const [nS,atS]=norm('S'), [nH]=norm('H'), [nE]=norm('R');
  /* ⚠ 위 «무차원 거칠기» 도 완전하지 않다 — 등속 원운동이어도 빠르면 커진다
     (|Δ²| ≈ Δθ²). 즉 «빠름» 과 «끊김» 이 섞인다.
     진짜 매끄러움은 «각속도 곡선 자체가 매끄러운가» 다: 등속이면 0 이 된다.
        rJerk = max|ω(i+1) − 2ω(i) + ω(i−1)| ÷ 평균 ω
     이게 tools/3d/clip-to-path.mjs 의 같은 이름과 짝이 되는 잣대다. */
  const rj=(()=>{ const w=[];
    for(let i=1;i<=N;i++){ const a=pts[i-1].S,b=pts[i].S;
      w.push(Math.acos(Math.max(-1,Math.min(1,a.dot(b))))); }
    const m=w.reduce((a,b)=>a+b,0)/w.length; let j=0,at=0;
    for(let i=1;i<w.length-1;i++){ const v=Math.abs(w[i+1]-2*w[i]+w[i-1]);
      if(v>j){ j=v; at=i/w.length; } }
    /* 검수 그림용으로 남겨 둔다 (rateProfile) */
    const B=120, per=Math.floor(w.length/B), out=[];
    for(let b=0;b<B;b++){ let sm2=0; for(let i=b*per;i<(b+1)*per;i++) sm2+=w[i];
      out.push(+(sm2/(per*dt)*180/Math.PI).toFixed(0)); }
    window.__RATE__=out;
    return [m>1e-9?j/m:0, at]; })();
  /* 자루 거칠기의 «위쪽 12개» 가 어느 위상에 몰려 있는지 — 키에 몰리면 잇는 방식,
     접점(0.42)에 몰리면 시간 왜곡, 흩어져 있으면 몸통 클립이 원인이다. */
  const top=(()=>{ const L=[];
    for(let i=2;i<=N;i++){ const a0=pts[i-2].S,a1=pts[i-1].S,a2=pts[i].S;
      L.push([+(i/N).toFixed(3), a2.clone().sub(a1).sub(a1.clone().sub(a0)).length()]); }
    L.sort((a,b)=>b[1]-a[1]); return L.slice(0,12).map(x=>x[0]); })();
  worstStep=Math.max(eL,eR); worstAt=eAt;
  return {clip:name, elbowJump:+(worstStep*100).toFixed(2), at:+worstAt.toFixed(2),
    minRadial:+GRIP_DIAG.minRadial.toFixed(4), maxCos:+GRIP_DIAG.maxCos.toFixed(4),
    minSin:+AIM_DIAG.minSin.toFixed(4),
    hand:+(hand*100).toFixed(1), shaft:+(shaft*100).toFixed(1),
    nShaft:+nS.toFixed(2), nHand:+nH.toFixed(2), nElbow:+nE.toFixed(2), nAt:+atS.toFixed(3), top:top,
    rJerk:+rj[0].toFixed(2), rAt:+rj[1].toFixed(3),
    tangent:GRIP_DIAG.tangent, blends:GRIP_DIAG.blends, calls:GRIP_DIAG.calls};
};
window.gainSweep=function(name, from, to, step){
  const keep=AIN_SWING_GAIN[name], out=[];
  for(let g=from; g<=to+1e-9; g+=step){
    AIN_SWING_GAIN[name]=+g.toFixed(2);
    const r=window.measure(name);
    out.push({g:+g.toFixed(2), path:r.path, sweep:r.sweep, peak:r.peak,
              hitV:r.prof[r.hitBin][1], low:r.low, high:r.high});
  }
  if(keep===undefined) delete AIN_SWING_GAIN[name]; else AIN_SWING_GAIN[name]=keep;
  return out;
};
/* 각속도 프로파일 — 검수 그림용. 위상 0~1 을 120 칸으로 나눈 °/s */
window.rateProfile=function(name, bins){
  const B=bins||120, r=window.cond(name), src=window.__RATE__||[];
  return src;
};
window.setGain=function(n,g){ AIN_SWING_GAIN[n]=g; };
/* 이음매 비율 쓸기 — 어느 값이 각속도 곡선을 제일 매끄럽게 만드는지 «재서» 고른다 */
window.seamSweep=function(name, from, to, step){
  const SB=globalThis.TW_SWING_BODY, keep=SB.SEAM_BIAS[name], out=[];
  for(let k=from;k<=to+1e-9;k+=step){
    SB.SEAM_BIAS[name]=+k.toFixed(2);
    const m=window.measure(name);
    out.push({k:+k.toFixed(2), rJerk:window.cond(name).rJerk,
              hitV:m.prof[m.hitBin][1], peak:m.peak, sweep:m.sweep, low:m.low});
  }
  if(keep===undefined) delete SB.SEAM_BIAS[name]; else SB.SEAM_BIAS[name]=keep;
  return out;
};
window.solve=function(name){
  const keep=CONTACTS[name]; let best=null;
  for(let c=0.12;c<=0.88;c+=0.02){
    CONTACTS[name]=+c.toFixed(2);
    const r=window.measure(name);
    if(!r) continue;
    const v=r.prof[r.hitBin][1];
    if(!best||v>best.v) best={c:+c.toFixed(2), v, peakArc:r.peakArcPct};
  }
  CONTACTS[name]=keep;
  const now=window.measure(name);
  return { clip:name, now:keep, nowV:now.prof[now.hitBin][1],
           best:best.c, bestV:best.v, bestArc:best.peakArc };
};
window.rawPeak=function(name){
  const clip=byName[name]; if(!clip) return null;
  const N=Math.max(24,Math.round(clip.duration*120)), dt=clip.duration/N, pts=[];
  const a=mixer.clipAction(clip);
  for(let i=0;i<=N;i++){
    reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
    a.time=Math.min(clip.duration*0.999, clip.duration*i/N); mixer.update(0);
    sc.updateMatrixWorld(true);
    pts.push(tip.clone().applyMatrix4(blade.matrixWorld));
  }
  const sp=[]; for(let i=1;i<=N;i++) sp.push(pts[i].distanceTo(pts[i-1])/dt);
  /* ±3 표본 평균으로 다듬는다 — 한 프레임짜리 가짜 정점을 피한다 */
  const sm=sp.map((_,i)=>{let s=0,n=0;for(let k=-3;k<=3;k++){const j=i+k;if(j>=0&&j<sp.length){s+=sp[j];n++;}}return s/n;});
  let best=0,bi=0; sm.forEach((v,i)=>{if(v>best){best=v;bi=i;}});
  return { clip:name, peakAt:+((bi+0.5)/N).toFixed(3), peak:+best.toFixed(1),
           set:CONTACTS[name], gap:+(((bi+0.5)/N)-CONTACTS[name]).toFixed(3), dur:+clip.duration.toFixed(2) };
};
/* 모든 클립을 훑어 «날 끝이 얼마나 빠른가» 를 잰다 — 스킬 소스로 쓸 만한
   «진짜 치는 동작» 이 어느 클립에 있는지 고르기 위해. raw=1 이면 교체 전 원본. */
window.survey=function(raw){
  const list=(raw?g.animations:clips), out=[];
  for(const clip of list){
    const N=Math.max(24,Math.round(clip.duration*90)), dt=clip.duration/N, pts=[];
    const a=mixer.clipAction(clip);
    for(let i=0;i<=N;i++){
      reset(); mixer.stopAllAction(); a.reset(); a.play(); a.paused=true;
      a.time=Math.min(clip.duration*0.999, clip.duration*i/N); mixer.update(0);
      sc.updateMatrixWorld(true);
      pts.push(tip.clone().applyMatrix4(blade.matrixWorld));
    }
    const sp=[]; for(let i=1;i<=N;i++) sp.push(pts[i].distanceTo(pts[i-1])/dt);
    const sm=sp.map((_,i)=>{let s=0,n=0;for(let k=-2;k<=2;k++){const j=i+k;if(j>=0&&j<sp.length){s+=sp[j];n++;}}return s/n;});
    let best=0,bi=0; sm.forEach((v,i)=>{if(v>best){best=v;bi=i;}});
    let path=0; for(const v of sp) path+=v*dt;
    let lo=Infinity,hi=-Infinity; pts.forEach(p=>{lo=Math.min(lo,p.y);hi=Math.max(hi,p.y);});
    out.push({clip:clip.name, dur:+clip.duration.toFixed(2), peak:+best.toFixed(1),
      at:+((bi+0.5)/N).toFixed(3), path:+path.toFixed(2), low:+lo.toFixed(2), high:+hi.toFixed(2)});
  }
  return out.sort((a,b)=>b.peak-a.peak);
};
window.READY=1;
