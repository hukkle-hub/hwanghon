<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황혼 · 20 몬스터 + 10 캐릭터 예산 검수</title>
<style>body{margin:0;background:#111820;color:#edf2f5;font:14px system-ui;overflow:hidden}header{position:absolute;inset:10px 10px auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{min-height:64px;min-width:100px;padding:12px;background:#293b49;color:white;border:1px solid #9ab0bf;border-radius:6px}#hud{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag{display:none}.mobhp{display:none}#note{position:absolute;bottom:10px;left:10px;right:10px;font-size:12px}canvas{display:block}</style>
<div id="hud"></div><header><b>20 몬스터 + 10 아인 경량본</b><button id="clear">몬스터 제거</button><button id="pause">일시 정지</button><span id="status">로딩 중</span></header><div id="note">실제 로더·스킨·애니메이션 예산 검사. 여기서 측정한 브라우저 속도는 S25 Ultra 실기 성능이 아닙니다.</div>
<script type="module">
import * as T from '../../vendor/three/three.module.js';import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';import {clone} from '../../vendor/three/SkeletonUtils.js';
import {createMobView} from '../../js/mmo/field-mobs.js';import {N01_BODIES} from '../../js/mmo/n01-body-catalog.js';import {CATALOG} from '../../js/mmo/monster-catalog.js';
const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new T.Scene();scene.background=new T.Color(0x111820);scene.add(new T.HemisphereLight(0xd8e5ff,0x26323d,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,8,6);scene.add(light);
const ground=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:0x27323c,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);scene.add(new T.GridHelper(40,40));
const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);function fit(){const distance=Math.max(18,6/(Math.tan(20*Math.PI/180)*camera.aspect));camera.position.set(0,8,distance);camera.lookAt(0,1,0);}fit();
const loader=new GLTFLoader(),ids=Object.keys(N01_BODIES),assets=new Map();await Promise.all(ids.map(async id=>assets.set(id,await loader.loadAsync('../../'+N01_BODIES[id].url))));
const hero=await loader.loadAsync('../../art/3d/lod/ain_anim.glb'),mixers=[];
for(let i=0;i<10;i++){const model=clone(hero.scene),box=new T.Box3().setFromObject(model),scale=1.68/(box.max.y-box.min.y);model.scale.setScalar(scale);model.position.set((i%5-2)*2.5,-box.min.y*scale,4+Math.floor(i/5)*2);model.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});scene.add(model);const mixer=new T.AnimationMixer(model),clip=hero.animations.find(c=>c.name==='idle')||hero.animations[0];if(clip)mixer.clipAction(clip).play();mixers.push(mixer);}
function tagAt(el,x,y,z){const p=new T.Vector3(x,y,z).project(camera);el.style.left=(p.x*.5+.5)*innerWidth+'px';el.style.top=(-p.y*.5+.5)*innerHeight+'px';el.style.transform='translate(-50%,-100%)';}
const view=createMobView({THREE:T,clone,scene,loadBody:async()=>assets.get(ids[0]),loadBodyFor:id=>({...N01_BODIES[id],load:async()=>assets.get(id)}),hud:document.querySelector('#hud'),tagAt,catalog:CATALOG});
const packet=Array.from({length:20},(_,i)=>({id:'crowd:'+i+':0',catalogId:ids[i%6],x:(i%5-2)*2.3,z:-Math.floor(i/5)*2,alive:true,generation:1,hp:100,anim:'walk',seq:1}));
let shown=true,paused=false,frames=0,prev=performance.now(),cpu=[],errors=0;renderer.domElement.addEventListener('webglcontextlost',()=>errors++);
document.querySelector('#clear').onclick=e=>{shown=!shown;e.target.textContent=shown?'몬스터 제거':'몬스터 다시 생성';};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시 정지';};
function draw(){requestAnimationFrame(draw);const start=performance.now(),dt=Math.min(.05,(start-prev)/1000);prev=start;view.update(shown?packet:[],paused?0:dt);if(!paused)for(const m of mixers)m.update(dt);renderer.render(scene,camera);cpu.push(performance.now()-start);if(cpu.length>120)cpu.shift();frames++;const r=renderer.info;document.querySelector('#status').textContent=view.count+' 몬스터 / 10 캐릭터 · '+r.render.triangles.toLocaleString()+' 삼각형 · '+r.render.calls+' 그리기 · '+r.memory.textures+' 텍스처 · '+frames+' 프레임';}draw();
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fit();}addEventListener('resize',resize);resize();
window.N01_CROWD={get frame(){return frames},get mobs(){return view.count},get players(){return mixers.length},get contextLost(){return errors},get triangles(){return renderer.info.render.triangles},get calls(){return renderer.info.render.calls},get geometries(){return renderer.info.memory.geometries},get textures(){return renderer.info.memory.textures},get cpuP95Ms(){const a=cpu.slice().sort((a,b)=>a-b);return a[Math.floor(a.length*.95)]||0},hardwareTested:false};
</script></html>
