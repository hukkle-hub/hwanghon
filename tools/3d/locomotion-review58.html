<!doctype html><meta charset="utf-8"><title>황혼 · 보행 연결 검수 58</title>
<style>body{margin:0;background:#14191e;color:#ddd;font:14px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;background:#29333b;color:white;border:1px solid #65717d;padding:7px}canvas{width:100%;height:calc(100vh - 150px);display:block}pre{margin:8px;white-space:pre-wrap;max-height:70px;overflow:auto}</style>
<header><b>실제 게임 Animated · 보행/전투/달리기 연결</b><label>캐릭터 <select id="char"><option>ain</option><option>kain</option><option>ryu</option><option>sera</option></select></label><label>동작 <select id="mode"><option value="idle">일반 대기</option><option value="walk">일반 걷기 1.5 m/s</option><option value="run">일반 달리기 4.8 m/s</option><option value="combat">전투 걷기 1.5 m/s</option><option value="ready">전투 대기</option><option value="sequence">전환 전체</option></select></label><label>시점 <select id="view"><option value="whole">전신 3/4</option><option value="side">측면/발</option><option value="arms">팔·손 확대</option></select></label><button id="save">검수 PNG 저장</button><button id="record">전환 전체 영상 저장</button></header><canvas id="cv"></canvas><pre id="status">로드 중</pre>
<script src="../../js/looks.js"></script><script src="../../js/dungeons.js"></script><script type="module">
import * as T from '../../vendor/three/three.module.js';import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';import {Animated} from '../../js/party-avatar.js';
import {approachSpeed} from '../../js/hero-locomotion.js';
const q=new URLSearchParams(location.search),character=q.get('char')||'ain',lod=q.get('lod')!=='0',cv=document.querySelector('canvas'),status=document.querySelector('#status');document.querySelector('#char').value=character;
document.querySelector('#char').onchange=e=>{q.set('char',e.target.value);location.search=q;};
const renderer=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=true;
const scene=new T.Scene();scene.background=new T.Color('#252d35');scene.add(new T.HemisphereLight(0xe5edff,0x555047,3));const light=new T.DirectionalLight(0xffead4,4);light.position.set(4,6,5);light.castShadow=true;scene.add(light);
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x343b40,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new T.GridHelper(100,100,0x71838c,0x46515a);grid.position.y=.001;scene.add(grid);
const camera=new T.PerspectiveCamera(30,1,.02,150),loader=new GLTFLoader(),p=lod?'lod/':'',wp=character==='ain'?'ain_scythe_tex.glb':(lod?'lod/':'')+'gear/'+({kain:'w_kain_greatsword',ryu:'w_ash_dirk',sera:'w_sera_flask'}[character])+'.glb';
try{const [asset,weapon]=await Promise.all([loader.loadAsync('../../art/3d/'+p+character+'_anim.glb'),loader.loadAsync('../../art/3d/'+wp)]),hero=new Animated(asset,scene,true,false,weapon,character);hero.trail?.dispose();hero.trail=null;
let age=0,z=0,speed=0,recording=false,runStart=0,frames=0;const modes=document.querySelector('#mode'),plan=[['idle',1],['walk',2.5],['run',3],['walk',1.5],['idle',1],['ready',1.5],['combat',3],['ready',1.5],['run',2],['idle',1.5]],total=plan.reduce((s,x)=>s+x[1],0),target=new T.Vector3(),history=[];
function modeAt(t){for(const [m,d]of plan){if(t<d)return m;t-=d;}return 'idle';}
const splitOption=document.createElement('option');splitOption.value='split';splitOption.textContent='전신 + 손 확대 동시';document.querySelector('#view').append(splitOption);
function resize(){const w=cv.clientWidth,h=cv.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
document.querySelector('#save').onclick=async()=>{const blob=await new Promise(r=>cv.toBlob(r));const r=await fetch('http://127.0.0.1:8799/'+character+'-'+(lod?'mobile':'original')+'-'+(q.get('tag')||'candidate')+'.png',{method:'POST',body:blob});status.textContent=await r.text();};
document.querySelector('#record').onclick=()=>{if(recording)return;recording=true;runStart=age;modes.value='sequence';history.length=0;const chunks=[],rec=new MediaRecorder(cv.captureStream(30),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5000000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.onstop=async()=>{const name=character+'-'+(lod?'mobile':'original')+'-'+(q.get('tag')||'candidate');await fetch('http://127.0.0.1:8799/'+name+'.webm',{method:'POST',body:new Blob(chunks,{type:'video/webm'})});await fetch('http://127.0.0.1:8799/'+name+'.json',{method:'POST',body:JSON.stringify({character,lod,frames:history},null,2)});recording=false;status.textContent='영상 저장 완료 '+name;};rec.start();hero.root.position.set(0,0,0);z=0;rec.endTime=age+total;window.addEventListener('review-end',()=>rec.stop(),{once:true});};
let last=performance.now();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;age+=dt;const mode=modes.value==='sequence'?modeAt((age-runStart)%total):modes.value,targetSpeed=mode==='run'?4.8:['walk','combat'].includes(mode)?1.5:0,combat=['combat','ready'].includes(mode);speed=approachSpeed(speed,targetSpeed,dt);z+=speed*dt;hero.update({x:0,y:z*27.5,aim:Math.PI/2,hp:1,moving:speed>0,speed,combat,guard:false,rollT:0},dt,0);hero.root.updateMatrixWorld(true);
const v=document.querySelector('#view').value,y=hero.root.position.z;grid.position.z=Math.floor(y/10)*10;floor.position.z=y;
function draw(which,x,w){camera.aspect=w/cv.clientHeight;camera.updateProjectionMatrix();if(which==='arms'){target.set(0,1.5,y);camera.position.set(1.5,1.7,y+2.5);}else if(which==='side'){target.set(0,.95,y);camera.position.set(4.5,1.7,y+.3);}else{target.set(0,1.05,y);camera.position.set(3.5,2.2,y+5);}camera.lookAt(target);renderer.setViewport(x,0,w,cv.clientHeight);renderer.setScissor(x,0,w,cv.clientHeight);renderer.render(scene,camera);}
renderer.setScissorTest(true);if(v==='split'){draw('whole',0,cv.clientWidth/2);draw('arms',cv.clientWidth/2,cv.clientWidth/2);}else draw(v,0,cv.clientWidth);renderer.setScissorTest(false);
const report={mode,speed,clip:hero.current?.getClip().name,time:hero.current?.time,locomotion:hero.locomotion?.diagnostics,grip:hero.rig?.diagnostics?.gripError,rightGrip:hero.rig?.diagnostics?.rightGripError};if(frames++%8===0){status.textContent=JSON.stringify(report);if(recording)history.push({at:age-runStart,...report});}if(recording&&age-runStart>=total)dispatchEvent(new Event('review-end'));requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(e){status.textContent='ERROR '+e.stack;}
</script>
