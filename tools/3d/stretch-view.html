<!doctype html><meta charset="utf-8"><title>스킨 늘어남 확대 보기</title>
<!-- 모션을 바꿀 때마다 «확대해서 찢어지거나 늘어나는지» 본다 (디렉터 지시, docs/design/77).
     삼각형 변 길이 ÷ 바인드 길이를 정점 색으로: 흰색 = 그대로, 빨강 = 늘어남(2배↑), 파랑 = 눌림(0.5배↓).
     window.view(clip, u, bone, dist, azimuth°, heat) → 한 장 그림.  ?glb=…&char=kain|ryu|sera|ain -->
<style>body{margin:0;background:#12151a}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="../../js/world.js"></script><script src="../../js/dungeons.js"></script>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {smoothCharacterClips} from '../../js/clip-smooth.js';
import {repairAinBind,repairAinClips} from '../../js/ain-bind-repair.js';
const Q=new URLSearchParams(location.search), CH=Q.get('char')||'kain';
const W=+(Q.get('w')||520),H=+(Q.get('h')||520);
const r=new T.WebGLRenderer({canvas:document.querySelector('#c'),antialias:true});
r.setSize(W,H); r.setPixelRatio(2); r.toneMapping=T.ACESFilmicToneMapping; r.toneMappingExposure=+(Q.get('exp')||3);
const sc=new T.Scene(); sc.background=new T.Color(0x12151a);
sc.add(new T.HemisphereLight(0xcfe0ff,0x20242c,1.4));
const key=new T.DirectionalLight(0xffffff,2.2); key.position.set(2.2,3.4,2.6); sc.add(key);
const cam=new T.PerspectiveCamera(30,W/H,0.02,50);
const g=await new GLTFLoader().loadAsync(Q.get('glb')||`../../art/3d/${CH}_anim.glb`); sc.add(g.scene);
const M=window.TW_DUNGEONS.RULES.motion;
let clips;
if(CH==='ain'){ clips=repairAinClips(g.animations,repairAinBind(g.scene)); }
else clips=smoothCharacterClips(CH,g.animations,{...M.clipContacts,...(M.clipContactsByChar||{})[CH]});
const meshes=[]; g.scene.traverse(o=>{ if(o.isSkinnedMesh) meshes.push(o); });
g.scene.updateMatrixWorld(true);
/* 변 목록 · 바인드 길이 · 원래 재질 */
const info=meshes.map(m=>{ const idx=m.geometry.index.array, pa=m.geometry.attributes.position, n=pa.count, set=new Set(), ed=[];
  for(let i=0;i<idx.length;i+=3) for(const [a,c] of [[idx[i],idx[i+1]],[idx[i+1],idx[i+2]],[idx[i+2],idx[i]]]){ const k=a<c?a*1e7+c:c*1e7+a; if(!set.has(k)){ set.add(k); ed.push(a,c); } }
  const R=new Float32Array(n*3), v=new T.Vector3();
  for(let i=0;i<n;i++){ v.fromBufferAttribute(pa,i); R.set([v.x,v.y,v.z],i*3); }
  const col=new T.BufferAttribute(new Float32Array(n*3),3); m.geometry.setAttribute('color',col);
  return {m,ed,R,col,orig:m.material,heat:new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide})}; });
const mixer=new T.AnimationMixer(g.scene);
const bones={}; g.scene.traverse(o=>{ if(o.isBone) bones[o.name.replace(/^mixamorig:?/,'')]=o; });
function pose(name,u){ const c=clips.find(x=>x.name===name); mixer.stopAllAction(); const a=mixer.clipAction(c); a.reset(); a.play(); a.paused=true; a.time=Math.min(c.duration-1e-4,c.duration*u); mixer.update(0); g.scene.updateMatrixWorld(true); }
function heat(on){ let worst=1,bad=0,tot=0;
  for(const I of info){ const {m,ed,R,col}=I; m.material=on?I.heat:I.orig; if(!on) continue;
    const n=m.geometry.attributes.position.count, P=new Float32Array(n*3), v=new T.Vector3(), mx=new Float32Array(n).fill(1), mn=new Float32Array(n).fill(1);
    for(let i=0;i<n;i++){ m.getVertexPosition(i,v); P.set([v.x,v.y,v.z],i*3); }   /* 메시 로컬(바인드와 같은 공간) */
    for(let e=0;e<ed.length;e+=2){ const a=ed[e]*3,b=ed[e+1]*3, l0=Math.hypot(R[a]-R[b],R[a+1]-R[b+1],R[a+2]-R[b+2]); if(l0<0.004) continue;
      const q=Math.hypot(P[a]-P[b],P[a+1]-P[b+1],P[a+2]-P[b+2])/l0; tot++; if(q>1.8||q<.45) bad++; worst=Math.max(worst,q);
      for(const k of [ed[e],ed[e+1]]){ if(q>mx[k]) mx[k]=q; if(q<mn[k]) mn[k]=q; } }
    for(let i=0;i<n;i++){ const s=Math.min(1,Math.max(0,(mx[i]-1.15)/0.85)), c=Math.min(1,Math.max(0,(0.85-mn[i])/0.4));
      col.setXYZ(i, 1-.1*c, 1-s*.85-.3*c, 1-s*.85); }
    col.needsUpdate=true; }
  return {worst,bad:tot?bad/tot:0}; }
window.view=function(clip,u,bone='Hips',dist=1.2,az=35,useHeat=1,el=10){
  pose(clip,u); const st=heat(!!useHeat);
  const p=(bones[bone]||bones.Hips).getWorldPosition(new T.Vector3()), A=az*Math.PI/180, E=el*Math.PI/180;
  cam.position.set(p.x+dist*Math.sin(A)*Math.cos(E), p.y+dist*Math.sin(E), p.z+dist*Math.cos(A)*Math.cos(E)); cam.lookAt(p);
  r.render(sc,cam); return st; };
window.TW_READY=1;
</script>
