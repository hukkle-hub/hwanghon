<!doctype html><html lang="ko"><meta charset="utf-8"><title>캐릭터 실제 장착 검수</title>
<style>body{margin:0;background:#171c24;color:#eee;font:15px system-ui}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:10px}canvas{display:block;width:100%;height:70vh}pre{white-space:pre-wrap;padding:8px;font-size:12px}label{display:flex;align-items:center;gap:6px}</style>
<header><label>캐릭터<select id="char"><option>ain</option><option>kain</option><option>ryu</option><option>sera</option></select></label><label>모델<select id="lod"><option value="0">원본</option><option value="1">모바일</option></select></label><label>동작<select id="clip"></select></label><label>시점<select id="view"><option value="front">정면</option><option value="side">옆면</option><option value="back">후면</option><option value="grip">손 바깥 확대</option></select></label><label>구간<input id="u" type="number" min="0" max="1" step=".02" value="0"></label><button id="pose">해당 구간 보기</button><button id="play">전체 동작 재생</button><button id="sequence">전투 전 동작 순서 재생</button><button id="record">전투 영상 녹화</button><button id="stop">일시정지</button><a id="download" hidden>영상 저장</a><span id="status">모델 읽는 중</span></header>
<header><label>화면<select id="layout"><option value="detail">전신·손 확대</option><option value="whole">전신 크게</option></select></label><button id="skills">스킬 4종·궁극기·카운터 재생</button><button id="recordSkills">새 스킬 전체 녹화</button></header><canvas id="canvas"></canvas><pre id="metrics"></pre>
<script src="../../js/looks.js"></script><script src="../../js/dungeons.js"></script>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {Animated} from '../../js/party-avatar.js';
import {fieldHeroAction} from '../../js/mmo/hero-motion.js';
const q=new URLSearchParams(location.search),CH=q.get('char')||'ain',LOD=q.get('lod')==='1';
document.querySelector('#char').value=CH;document.querySelector('#lod').value=LOD?'1':'0';
for(const id of ['char','lod'])document.querySelector('#'+id).onchange=()=>{q.set(id,document.querySelector('#'+id).value);location.search=q;};
const scene=new T.Scene();scene.background=new T.Color('#27313e');scene.add(new T.HemisphereLight(0xe9efff,0x3e3540,2));const light=new T.DirectionalLight(0xfff4e4,2.5);light.position.set(3,4,5);scene.add(light);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;
const loader=new GLTFLoader(),base='../../art/3d/',weapon={ain:'ain_scythe_tex.glb',kain:'gear/w_kain_greatsword.glb',ryu:'gear/w_ash_dirk.glb',sera:'gear/w_sera_flask.glb'}[CH];
const [asset,w]=await Promise.all([loader.loadAsync(base+(LOD?'lod/':'')+CH+'_anim.glb'),loader.loadAsync(base+(LOD&&CH!=='ain'?'lod/':'')+weapon)]),hero=new Animated(asset,scene,true,false,w,CH);
const B={};hero.model.traverse(o=>{if(o.isBone)B[o.name.replace(/^mixamorig:?/,'')]=o;});
const floor=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:0x34313a,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
const cameras=Array.from({length:4},()=>new T.PerspectiveCamera(30,1,.01,30));
const clips=Object.keys(hero.clips),sel=document.querySelector('#clip');for(const n of clips){const o=document.createElement('option');o.textContent=n;sel.append(o);}sel.value='idle';
let playing=false,elapsed=0,queue=[],serial=0,record=null,parts=[],count=0,proof=[];
const out=document.querySelector('#metrics'),status=document.querySelector('#status');
if(location.hostname==='127.0.0.1'){
 const save=document.createElement('button');save.textContent='로컬 검수 영상 저장';document.querySelector('header').append(save);
 save.onclick=async()=>{try{const href=document.querySelector('#download').href;if(!href.startsWith('blob:'))throw Error('먼저 녹화');const blob=await(await fetch(href)).blob(),name=LOD?'mobile':document.querySelector('#layout').value==='whole'?'fullbody':'details',r=await fetch('http://127.0.0.1:8797/capture/'+CH+'-'+name+'-skills.webm',{method:'POST',body:blob});if(!r.ok)throw Error('저장 실패');status.textContent='로컬 파일 저장 완료 · '+(await r.json()).saved;}catch(e){status.textContent=e.message;}};
}
function start(name){hero.play(name,++serial);hero.current.paused=true;elapsed=0;sel.value=name;}
function apply(time,dt){hero.armBlend?.restore();hero.rig?.restore();hero.current.time=time;hero.mixer.update(dt);const clip=hero.current.getClip(),a=fieldHeroAction(CH,clip,time,serial);hero.rig?.apply(a,/run|walk/.test(clip.name),clip.name==='guard',dt,clip.name,null);if(CH!=='kain'||hero.rig?.diagnostics.source==='legacy')hero.armBlend?.apply(dt);hero.root.updateMatrixWorld(true);}
function inspect(){const v=()=>new T.Vector3(),p=s=>{const h=B[s+'Hand'];return (h.userData.gripPoint?.clone()||B[s+'HandSlot'].position.clone()).applyMatrix4(h.matrixWorld);},origin=hero.weapon.getWorldPosition(v()),axis=v().set(0,1,0).transformDirection(hero.weapon.matrixWorld),left=p('Left').sub(origin);return{character:CH,lod:LOD,clip:hero.current.getClip().name,time:+elapsed.toFixed(3),rightGap:p('Right').distanceTo(origin),leftAxisGap:left.clone().addScaledVector(axis,-left.dot(axis)).length(),leftAlong:left.dot(axis),joints:Object.fromEntries(['Spine2','RightArm','RightForeArm','RightHand','LeftArm','LeftForeArm','LeftHand'].map(n=>[n,B[n].getWorldPosition(v()).toArray().map(x=>+x.toFixed(3))])),rig:hero.rig.diagnostics,frames:count};}
function render(){const canvas=renderer.domElement,W=canvas.clientWidth,H=canvas.clientHeight;if(canvas.width!==W||canvas.height!==H)renderer.setSize(W,H,false);renderer.setScissorTest(true);const view=document.querySelector('#view').value,angle=view==='side'?Math.PI/2:view==='back'?Math.PI:0;const dir=new T.Vector3(Math.sin(angle),.15,Math.cos(angle));
 const whole=document.querySelector('#layout').value==='whole';
 for(let i=0;i<(whole?1:4);i++){const cam=cameras[i],x=whole?0:i*W/4,cw=whole?W:W/4;cam.aspect=cw/H;cam.updateProjectionMatrix();let target,dist;
  if(i===0){target=new T.Vector3(0,1.65,0);dist=whole?6.8:7.6;}else if(i===1){target=B.Spine2.getWorldPosition(new T.Vector3());dist=2.3;}else{const h=B[(i===2?'Right':'Left')+'Hand'];target=h.localToWorld(h.userData.gripPoint?.clone()||B[(i===2?'Right':'Left')+'HandSlot'].position.clone());dist=.8;}
  let direction=dir;if(i>=2&&view==='grip'){const h=B[(i===2?'Right':'Left')+'Hand'];direction=h.userData.gripAxis.clone().cross(h.userData.gripFinger).normalize().applyQuaternion(h.getWorldQuaternion(new T.Quaternion()));}
  cam.position.copy(target).addScaledVector(direction,dist);cam.lookAt(target);renderer.setViewport(x,0,cw,H);renderer.setScissor(x,0,cw,H);renderer.render(scene,cam);}
 renderer.setScissorTest(false);count++;const data=inspect();out.textContent=JSON.stringify(data,null,2);if(playing)proof.push(data);}
function pose(){playing=false;start(sel.value);elapsed=hero.current.getClip().duration*Math.max(0,Math.min(1,+document.querySelector('#u').value));for(let i=0;i<45;i++)apply(elapsed,1/60);render();status.textContent='정지 구간 검수';}
document.querySelector('#pose').onclick=pose;document.querySelector('#view').onchange=render;sel.onchange=pose;
document.querySelector('#play').onclick=()=>{queue=[];start(sel.value);playing=true;status.textContent='전 구간 재생 중';};
const seq=()=>{queue=['idle','attack1','attack2','attack3','smash','skill1','skill2','skill3','skill4','ult','counter','run','roll','hit','death'].filter(n=>hero.clips[n]);proof=[];start(queue.shift());playing=true;status.textContent='전투 동작 순서 재생 중';};document.querySelector('#sequence').onclick=seq;
document.querySelector('#layout').onchange=render;document.querySelector('#skills').onclick=()=>{queue=['skill1','skill2','skill3','skill4','ult',...(CH==='kain'?[]:['counter'])];start(queue.shift());playing=true;};
if(CH==='kain')document.querySelector('#skills').textContent='새 스킬 4종·궁극기 재생';
document.querySelector('#stop').onclick=()=>{playing=false;status.textContent='일시정지';};
document.querySelector('#record').onclick=()=>{parts=[];record=new MediaRecorder(renderer.domElement.captureStream(30),{mimeType:'video/webm;codecs=vp9'});record.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};record.onstop=async()=>{const blob=new Blob(parts,{type:'video/webm'}),a=document.querySelector('#download');a.href=URL.createObjectURL(blob);a.download=CH+'-grip-'+(LOD?'mobile':'full')+'.webm';a.hidden=false;a.textContent='검수 영상 저장';status.textContent='녹화 완료';};record.start();seq();};
document.querySelector('#recordSkills').onclick=()=>{document.querySelector('#record').onclick();document.querySelector('#skills').onclick();};
let last=performance.now();function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing){elapsed+=dt;const d=hero.current.getClip().duration;if(elapsed>=d){if(queue.length)start(queue.shift());else{elapsed=d;playing=false;if(record?.state==='recording')record.stop();status.textContent='전 구간 재생 완료';}}apply(elapsed,dt);}render();requestAnimationFrame(tick);}start('idle');for(let i=0;i<45;i++)apply(0,1/60);status.textContent='준비 완료 · 전신 / 상체 / 오른손 / 왼손';requestAnimationFrame(tick);
</script></html>
