<!doctype html><html lang="ko"><meta charset="utf-8"><title>레비아탄 발사 부위 검수</title>
<style>body{margin:0;background:#172029;color:#eee;font:14px sans-serif}header{padding:8px}button,input{padding:6px;margin:3px}canvas{display:block}output{display:block}</style>
<header>레비아탄 · 실제 원본 표면 좌표 검수 (게임 판정 승인 아님)<br>
<button id="side">측면 전체</button><button id="front">정면</button><button id="rear">후면</button><button id="head">머리 확대</button>
<button id="otherHead">반대 아가미 확대</button><label>기술 <select id="skill"><option value="pressure">압력</option><option value="gill">아가미</option><option value="tidal">조수</option></select></label>
<label>시간 <input id="time" type="number" step="0.05" value="0"></label><button id="play">재생/정지</button>
<button id="effect">광선 효과 켜기/끄기</button><button id="record">전체 압력 기술 녹화</button>
<output id="info">불러오는 중</output></header><canvas></canvas>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {makePoser} from './pose-eval.mjs';
import {createStaticBossFX} from '../../js/mmo/static-boss-fx.js';
import {loadCjs} from '../../js/mmo/cjs-browser.js';
const cv=document.querySelector('canvas'),r=new T.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;
const s=new T.Scene();s.background=new T.Color('#26313d');s.add(new T.HemisphereLight(0xdbeaff,0x63524a,2.3));
const key=new T.DirectionalLight(0xffe0c0,2.5);key.position.set(8,9,8);s.add(key);const rim=new T.DirectionalLight(0xb9dfff,2);rim.position.set(-8,4,-5);s.add(rim);
const c=new T.PerspectiveCamera(35,1,.01,150);function resize(){const h=innerHeight-document.querySelector('header').offsetHeight;r.setSize(innerWidth,h);c.aspect=innerWidth/h;c.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const candidate=new URLSearchParams(location.search).get('candidate')==='gill';
const gl=await new GLTFLoader().loadAsync(candidate?'../../art/review/part1/leviathan-gill-candidate.glb':'../../art/3d/part1/leviathan_static.glb');const root=gl.scene;s.add(root);
const mesh=root.getObjectByName('Boss_Mesh');let pos=makePoser(root,gl.animations.find(a=>a.name==='atk_pressure'));
const kit=(await loadCjs('../../server/field-boss-kit.cjs')).KITS.leviathan;
const holder=new T.Group();s.remove(root);holder.add(root);s.add(holder);
// Raw asset coordinates in this editor: range/height adapted for display only.
const o={b:{id:'leviathan'},root:holder,model:root,h:2.2,kfx:{baseY:0,kit}};
const fx=createStaticBossFX(o,s,0,false);let skill=kit.skills.pressure,effect=false,recording=null;
document.querySelector('#skill').onchange=e=>{if(recording)return;skill=kit.skills[e.target.value];pos=makePoser(root,gl.animations.find(a=>a.name===skill.clip));t=0;run=false;document.querySelector('#time').value='0';document.querySelector('#record').textContent='선택 기술 전체 녹화';};
document.querySelector('#effect').onclick=()=>{effect=!effect};
const marker=new T.Mesh(new T.SphereGeometry(.045,12,8),new T.MeshBasicMaterial({color:0xff44ff,depthTest:false}));marker.visible=false;s.add(marker);
function view(p,look){c.position.set(...p);c.lookAt(...look)}
document.querySelector('#side').onclick=()=>view([16,4,3],[0,1,0]);
document.querySelector('#front').onclick=()=>view([0,2,14],[0,1,5]);
document.querySelector('#rear').onclick=()=>view([0,2,-14],[0,1,-5]);
document.querySelector('#head').onclick=()=>view([4,2.5,10],[0,1.1,5.3]);
document.querySelector('#otherHead').onclick=()=>view([-4,2.5,10],[0,1.1,5.3]);
let t=0,run=false,last=performance.now();document.querySelector('#play').onclick=()=>{run=!run;last=performance.now()};
document.querySelector('#record').onclick=()=>{if(recording)return;t=0;run=true;const stream=cv.captureStream(30),chunks=[],rec=new MediaRecorder(stream,{mimeType:'video/webm'});recording=rec;rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const res=await fetch('http://127.0.0.1:8795/leviathan',{method:'POST',headers:{'Content-Type':'video/webm'},body:new Blob(chunks,{type:'video/webm'})});document.querySelector('#info').textContent=res.ok?await res.text():'저장 실패';recording=null;};rec.start();};
document.querySelector('#time').oninput=e=>{run=false;t=+e.target.value;pos(t)};
const ray=new T.Raycaster();cv.onclick=e=>{const b=cv.getBoundingClientRect();ray.setFromCamera(new T.Vector2((e.clientX-b.left)/b.width*2-1,1-(e.clientY-b.top)/b.height*2),c);const hit=ray.intersectObject(mesh,true)[0];if(!hit)return;marker.position.copy(hit.point);marker.visible=true;const p=hit.object.worldToLocal(hit.point.clone());document.querySelector('#info').textContent=`${hit.object.name} 표면 좌표 ${p.toArray().map(x=>x.toFixed(5)).join(', ')} · 삼각형 ${hit.faceIndex}`;};
document.querySelector('#info').textContent=(candidate?'아가미 후보 v2 · 미승인 · ':'')+'표면을 누르면 메시 로컬 좌표가 표시됩니다';view([16,4,3],[0,1,0]);
function frame(now){if(run){t+=Math.min(.1,(now-last)/1000);if(t>=skill.duration/1000){if(recording){t=skill.duration/1000;run=false;recording.stop()}else t%=skill.duration/1000}document.querySelector('#time').value=t.toFixed(2)}last=now;pos(t);if(effect)fx.update({yaw:0},skill,t*1000);else fx.clear();r.render(s,c);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
