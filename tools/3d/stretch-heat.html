<!doctype html><meta charset="utf-8"><title>늘어남 지도</title>
<!-- 늘어남 지도 (문서 225): 쉬는 자세 위에, 클립(들)에서 2배 넘게 늘어나는 변의 정점을 빨갛게.
     ?glb=../../art/3d/part1/clave.glb&clips=atk_claveshut,atk_clavestorm&fix=rebind&az=0,90,180,270&color=label&pose=atk_claveshut:0.47  · window.READY · window.HEAT={frac, n} -->
<style>body{margin:0;background:#12161a}canvas{display:block}</style><canvas id="c"></canvas>
<script type="module">
import * as T from '../../vendor/three/three.module.js';
import {GLTFLoader} from '../../vendor/three/GLTFLoader.js';
import {fixSkin, rebindModel} from '../../js/mmo/skin-fix.js';
const Q=new URLSearchParams(location.search), CELL=+(Q.get('cell')||420), AZ=(Q.get('az')||'0,90,180,270').split(',').map(a=>+a*Math.PI/180);
const g=await new GLTFLoader().loadAsync(Q.get('glb')||'../../art/3d/part1/clave.glb'), model=g.scene; if(Q.get('fix')==='rebind') rebindModel(T,model,{sigma:+(Q.get('sigma')||.08), wpow:+(Q.get('wpow')||1), floor:+(Q.get('floor')||0), reach:+(Q.get('reach')||2), geo:Q.get('geo')==='1', core:+(Q.get('core')||.25), tube:+(Q.get('tube')||0)}); else if(Q.get('fix')) fixSkin(model,...Q.get('fix').split(',').map(Number));
const meshes=[]; model.traverse(o=>{ if(o.isSkinnedMesh) meshes.push(o); });
const rest=[]; model.traverse(o=>rest.push([o,o.position.clone(),o.quaternion.clone()]));
const heat=meshes.map(m=>new Float32Array(m.geometry.attributes.position.count));
const mixer=new T.AnimationMixer(model), names=(Q.get('clips')||'atk_claveshut').split(','), LIM=+(Q.get('lim')||2);
for (const [mi,m] of meshes.entries()) { const ix=m.geometry.index, P=m.geometry.attributes.position, b=[]; for(let i=0;i<P.count;i++) b.push(new T.Vector3().fromBufferAttribute(P,i).applyMatrix4(m.bindMatrix)); m.userData.bind=b; }
for (const n of names) { const c=g.animations.find(a=>a.name===n); if(!c) continue; const act=mixer.clipAction(c); mixer.stopAllAction(); act.reset(); act.play(); act.paused=true;
  for (let t=0;t<=c.duration;t+=.1) { act.time=t; mixer.update(0); model.updateMatrixWorld(true);
    for (const [mi,m] of meshes.entries()) { m.skeleton.update(); const ix=m.geometry.index, B=m.userData.bind, cur=new Map(), v=new T.Vector3(), at=i=>{ let p=cur.get(i); if(!p){ m.getVertexPosition(i,v); p=v.clone(); cur.set(i,p);} return p; };
      for (let k=0;k<ix.count;k+=3) for (let e=0;e<3;e++) { const a=ix.getX(k+e), bb=ix.getX(k+(e+1)%3), d0=B[a].distanceTo(B[bb]); if(d0<1e-5) continue; const r=at(a).distanceTo(at(bb))/d0; if(r>heat[mi][a]) heat[mi][a]=r; if(r>heat[mi][bb]) heat[mi][bb]=r; } } } }
mixer.stopAllAction(); for(const [o,p,q] of rest){o.position.copy(p);o.quaternion.copy(q);} model.updateMatrixWorld(true);
const LC=[[.95,.25,.2],[.25,.45,.95],[.25,.85,.3],[.95,.85,.2],[.6,.6,.62]];   /* color=label: 왼팔 빨강 · 오른팔 파랑 · 왼다리 초록 · 오른다리 노랑 · 몸통 회색 */
let hot=0, all=0; for (const [mi,m] of meshes.entries()) { const n=heat[mi].length, col=new Float32Array(n*3), L=m.geometry.userData.skinLabel; for(let i=0;i<n;i++){ const h=heat[mi][i], k=Math.min(1,Math.max(0,(h-1)/(LIM-1))); all++; if(h>LIM) hot++;
    if(Q.get('color')==='label'&&L){ const c=LC[L[i]]; col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2]; continue; }
    col[i*3]=.35+.65*k; col[i*3+1]=.38*(1-k); col[i*3+2]=.42*(1-k); } m.geometry.setAttribute('color', new T.BufferAttribute(col,3)); m.material=new T.MeshLambertMaterial({vertexColors:true, side:T.DoubleSide}); }
window.HEAT={frac:hot/all, hot, all};
if(Q.get('pose')){ const [pn,pt]=Q.get('pose').split(':'), c=g.animations.find(a=>a.name===pn), act=mixer.clipAction(c); act.reset(); act.play(); act.paused=true; act.time=+pt*c.duration; mixer.update(0); model.updateMatrixWorld(true); }   /* 그 자세로 보기 */
const cv=document.getElementById('c'); cv.width=CELL*AZ.length; cv.height=CELL; const r=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true}); r.setSize(cv.width,cv.height,false); r.setScissorTest(true); r.autoClear=false; r.setClearColor(0x12161a,1); r.clear();
const s=new T.Scene(); s.add(new T.HemisphereLight(0xffffff,0x404650,2.2)); const k=new T.DirectionalLight(0xffffff,1.4); k.position.set(2,4,3); s.add(k); s.add(model);
const box=new T.Box3().setFromObject(model), c=box.getCenter(new T.Vector3()), sz=box.getSize(new T.Vector3()), d=Math.max(sz.y,sz.x)*1.25/Math.tan(15*Math.PI/180)/2, cam=new T.PerspectiveCamera(30,1,.05,100);
AZ.forEach((az,i)=>{ cam.position.set(c.x+Math.sin(az)*d, c.y+sz.y*.08, c.z+Math.cos(az)*d); cam.lookAt(c); r.setViewport(i*CELL,0,CELL,CELL); r.setScissor(i*CELL,0,CELL,CELL); r.clear(); r.render(s,cam); });
window.READY=1;
</script>
