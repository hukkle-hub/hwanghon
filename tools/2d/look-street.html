<script type="module">
/* 2D MMORPG 외형 시험 (docs/design/185 §6): 고정 쿼터뷰 정사영 + 밤의 강남대로.
   실제 게임에서는 배경을 미리 그려 두고(프리렌더) 캐릭터는 같은 카메라로 구운 스프라이트를 겹친다.
   이 화면은 그 둘을 한 번에 3D 로 그려 «최종 화면이 어떻게 보일지» 를 미리 보는 것이다.
   ?zoom=1 (캐릭터가 화면 높이의 약 22%) · ?zoom=1.6 (가까운 카메라) */
import * as THREE from './vendor/three/three.module.js';
import { GLTFLoader } from './vendor/three/GLTFLoader.js';
import * as SkeletonUtils from './vendor/three/SkeletonUtils.js';
import { createBloom } from './js/bloom.js';
const q=new URLSearchParams(location.search), ZOOM=+(q.get('zoom')||1), ELEV=30*Math.PI/180, AZ=Math.PI/4;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio)); renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.35;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05060a); scene.fog=new THREE.Fog(0x0a0c16,26,60);
/* ---------- 카메라: 리니지·디아블로식 고정 쿼터뷰 ---------- */
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
const FOCUS=new THREE.Vector3(0,0,0); /* frame() 전에 화면 위쪽(가게 줄)으로 1.6 m 옮긴다 — RT/UP 이 정해진 뒤 */
function frame(){ const aspect=innerWidth/innerHeight, viewH=7.7/ZOOM; /* 1.7 m 인물이 화면 높이의 22% */
  cam.left=-viewH*aspect/2; cam.right=viewH*aspect/2; cam.top=viewH/2; cam.bottom=-viewH/2; cam.updateProjectionMatrix();
  const R=40; cam.position.set(FOCUS.x+Math.sin(AZ)*Math.cos(ELEV)*R, FOCUS.y+Math.sin(ELEV)*R, FOCUS.z+Math.cos(AZ)*Math.cos(ELEV)*R); cam.lookAt(FOCUS); }
frame();
/* ---------- 빛: 거의 어둡고, 간판·가로등·코어가 빛을 낸다 ---------- */
scene.add(new THREE.HemisphereLight(0x3a4466,0x0a0608,0.55));
const moon=new THREE.DirectionalLight(0x8fa4ff,0.55); moon.position.set(-10,20,6); moon.castShadow=true; moon.shadow.mapSize.set(2048,2048);
Object.assign(moon.shadow.camera,{left:-14,right:14,top:14,bottom:-14,far:60}); scene.add(moon);
/* ---------- 간판 글자: 한글 네온 (캔버스 텍스처) ---------- */
function neonTex(text, color, w=512, h=160, font=96){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  g.fillStyle='rgba(6,6,10,0.92)'; g.fillRect(0,0,w,h); g.strokeStyle=color; g.lineWidth=6; g.globalAlpha=.55; g.strokeRect(8,8,w-16,h-16); g.globalAlpha=1;
  g.font='900 '+font+'px "Noto Sans KR",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor=color; g.shadowBlur=26; g.fillStyle=color; g.fillText(text,w/2,h/2+4); g.shadowBlur=8; g.fillStyle='#fff'; g.globalAlpha=.85; g.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
const SIGN_MATS=[];
function sign(text, color, x, y, z, rotY, w=2.6, h=0.8, flicker=0){ const m=new THREE.MeshBasicMaterial({map:neonTex(text,color),toneMapped:false,color:0xffffff});
  m.color.multiplyScalar(1.6); const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m); p.position.set(x,y,z); p.rotation.y=rotY; scene.add(p);
  const L=new THREE.PointLight(new THREE.Color(color),9,9,1.6); L.position.set(x+Math.sin(rotY)*0.8,y-0.4,z+Math.cos(rotY)*0.8); scene.add(L);
  SIGN_MATS.push({m,L,base:9,flicker}); return p; }
/* ---------- 땅: 젖은 아스팔트 + 차선 + 웅덩이 ---------- */
function asphaltTex(){ const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d'); g.fillStyle='#16171c'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<9000;i++){ const v=18+Math.random()*26|0; g.fillStyle='rgb('+v+','+v+','+(v+4)+')'; g.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  g.strokeStyle='rgba(0,0,0,.6)'; g.lineWidth=3; for(let i=0;i<14;i++){ g.beginPath(); let x=Math.random()*1024,y=Math.random()*1024; g.moveTo(x,y); for(let k=0;k<6;k++){ x+=(Math.random()-.5)*120; y+=(Math.random()-.5)*120; g.lineTo(x,y);} g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(6,6); t.colorSpace=THREE.SRGBColorSpace; return t; }
const PUDDLES=[];
const road=new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({map:asphaltTex(),roughness:0.32,metalness:0.25,color:0x9a9aa6}));
road.rotation.x=-Math.PI/2; road.receiveShadow=true; scene.add(road);
for(const [u,v,r] of [[-3.4,-1.6,0.8],[3.6,-0.4,0.6],[0.8,-3.8,1.0],[6.2,-2.8,0.7]]){ const pd=new THREE.Mesh(new THREE.CircleGeometry(r,32),new THREE.MeshStandardMaterial({color:0x1a2030,roughness:0.06,metalness:0.1}));
  pd.rotation.x=-Math.PI/2; pd.position.set(0,0.008,0); pd.scale.set(1.5,0.8,1); pd.receiveShadow=true; pd.userData.uv=[u,v]; PUDDLES.push(pd); scene.add(pd); }
/* 화면 기준 좌표: u = 화면 오른쪽, v = 화면 위(카메라에서 먼 쪽). 쿼터뷰라 이 축으로 배치해야 그림이 정돈된다 */
/* ?diag=1 이면 거리를 화면에 대각선으로 놓는다(리니지·디아블로의 마름모 격자) */
const ENV=q.get('diag')==='1'?-Math.PI/5:0, EA=AZ+ENV;
const RT=new THREE.Vector3(Math.cos(EA),0,-Math.sin(EA)), UP=new THREE.Vector3(-Math.sin(EA),0,-Math.cos(EA));
const W=(u,v,y=0)=>new THREE.Vector3().addScaledVector(RT,u).addScaledVector(UP,v).setY(y);
const FACE=EA; /* 거리 정면 회전 */
FOCUS.copy(W(0,1.6)); frame();
PUDDLES.forEach(pd=>{ pd.position.copy(W(pd.userData.uv[0],pd.userData.uv[1],0.008)); pd.rotation.z=FACE; });
/* 인도 (뒤쪽 건물 앞) */
const walk=new THREE.Mesh(new THREE.BoxGeometry(60,0.18,3.4),new THREE.MeshStandardMaterial({color:0x2a2b30,roughness:0.5,metalness:0.15}));
walk.position.copy(W(0,2.0,0.09)); walk.rotation.y=FACE; walk.receiveShadow=true; scene.add(walk);
/* ---------- 건물: 무너진 강남 빌딩 줄 (뒤) ---------- */
function windowsTex(lit){ const c=document.createElement('canvas'); c.width=256; c.height=512; const g=c.getContext('2d'); g.fillStyle='#101116'; g.fillRect(0,0,256,512);
  for(let y=10;y<512;y+=28) for(let x=8;x<256;x+=22){ const r=Math.random(); g.fillStyle=r<lit?(Math.random()<.5?'#ffcf7a':'#7ad8ff'):(r<.55?'#1b1d26':'#08090c'); g.fillRect(x,y,14,18); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function building(u,v,w,d,h,lit){ const tex=windowsTex(lit); const m=new THREE.MeshStandardMaterial({map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:0.45,roughness:0.8,color:0x8a8a94});
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); b.position.copy(W(u,v,h/2)); b.rotation.y=FACE; b.castShadow=true; b.receiveShadow=true; scene.add(b); return b; }
building(-13,6.2,6,6,13,0.06); building(-6.4,6.2,6.4,6,8,0.1); building(0.4,6.2,6.4,6,15,0.05); building(7.2,6.2,6.4,6,9,0.08); building(13.6,6.2,5.6,6,12,0.07);
/* 무너진 콘크리트 덩이 — 인도 쪽에 몰아서 */
const rubbleM=new THREE.MeshStandardMaterial({color:0x34343a,roughness:0.95});
for(let i=0;i<18;i++){ const sz=0.12+Math.random()*0.32; const r=new THREE.Mesh(new THREE.DodecahedronGeometry(sz,0),rubbleM); r.position.copy(W(-9+Math.random()*7,1.0+Math.random()*1.6,sz*0.5)); r.rotation.set(Math.random()*3,Math.random()*3,0); r.castShadow=r.receiveShadow=true; scene.add(r); }
/* 버려진 차 두 대 */
function car(u,v,ry,color){ const g=new THREE.Group(); const body=new THREE.Mesh(new THREE.BoxGeometry(4.2,0.7,1.8),new THREE.MeshStandardMaterial({color,roughness:0.3,metalness:0.6})); body.position.y=0.55; g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.55,1.6),new THREE.MeshStandardMaterial({color:0x0c0e14,roughness:0.08,metalness:0.85})); top.position.set(-0.2,1.15,0); g.add(top);
  g.position.copy(W(u,v)); g.rotation.y=FACE+ry; g.traverse(o=>{ if(o.isMesh){ o.castShadow=o.receiveShadow=true; } }); scene.add(g); }
car(-7.4,-0.6,0.2,0x5a1418);
/* 간판 — 건물 앞면에 (원문 장소: 강남역 지하상가, docs/story) */
function signAt(text,color,u,h,w=2.6,hh=0.8,fl=0){ const pos=W(u,3.2-0.05,h); return sign(text,color,pos.x,pos.y,pos.z,FACE,w,hh,fl); }
signAt('강남역','#ff3a5a',-6.6,2.6,3.4,1.0); signAt('지하상가','#39e0ff',-3.9,1.9,2.6,0.75,1); signAt('약국','#4cff9a',2.6,2.5,1.8,0.75);
signAt('노래방','#ff4fd8',6.4,2.6,3.0,0.9,1); signAt('24시','#ffd23a',10.0,2.4,1.8,0.75); signAt('PC방','#3a8cff',-10.8,2.6,2.2,0.8);
/* 차선 — 길을 따라 */
for(let i=-8;i<=8;i++){ const lane=new THREE.Mesh(new THREE.PlaneGeometry(1.6,0.14),new THREE.MeshStandardMaterial({color:0xb0a070,roughness:0.6,emissive:0x221c08}));
  lane.rotation.x=-Math.PI/2; lane.rotation.z=FACE; lane.position.copy(W(i*3,-2.6,0.006)); scene.add(lane); }
/* 지하상가 입구 (원문 «5번 출구») */
const ent=new THREE.Group(); const frameM=new THREE.MeshStandardMaterial({color:0x2a2c33,roughness:0.5,metalness:0.6});
const roof=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.12,2.4),frameM); roof.position.y=2.5; ent.add(roof);
for(const sx of [-1.5,1.5]) for(const sz of [-1.1,1.1]){ const pp=new THREE.Mesh(new THREE.BoxGeometry(0.1,2.5,0.1),frameM); pp.position.set(sx,1.25,sz); ent.add(pp); }
const hole=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.9),new THREE.MeshBasicMaterial({color:0x000000})); hole.rotation.x=-Math.PI/2; hole.position.y=0.2; ent.add(hole);
const exitNo=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.5),new THREE.MeshBasicMaterial({map:neonTex('5','#ffd23a',256,140,110),toneMapped:false})); exitNo.position.set(0,2.85,1.21); ent.add(exitNo);
ent.position.copy(W(-0.2,2.1,0.18)); ent.rotation.y=FACE; ent.traverse(o=>{ if(o.isMesh) o.castShadow=true; }); scene.add(ent);
/* 가로등 */
function lamp(u,v){ const at=W(u,v); const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,4.2,8),frameM); pole.position.copy(at).setY(2.1); pole.castShadow=true; scene.add(pole);
  const hd=W(u,v-0.4,4.2); const head=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.1,0.5),new THREE.MeshBasicMaterial({color:0xffe1b0,toneMapped:false})); head.position.copy(hd); head.rotation.y=FACE; scene.add(head);
  const L=new THREE.SpotLight(0xffc98a,38,13,0.8,0.6,1.4); L.position.copy(hd).setY(4.1); L.target.position.copy(W(u,v-2.2)); L.castShadow=true; L.shadow.mapSize.set(1024,1024); scene.add(L,L.target); }
lamp(-4.6,0.9); lamp(8.6,0.9);
/* 비 */
const RAIN=1400, rg=new THREE.BufferGeometry(), rp=new Float32Array(RAIN*6);
for(let i=0;i<RAIN;i++){ const x=(Math.random()-.5)*36, y=Math.random()*16, z=(Math.random()-.5)*36; rp.set([x,y,z,x+0.04,y-0.55,z+0.02],i*6); }
rg.setAttribute('position',new THREE.BufferAttribute(rp,3)); const rain=new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0x9fb4d8,transparent:true,opacity:0.16})); scene.add(rain);
/* 전리품 — 등급 빛기둥 (디아블로식, docs/design/185 §6) */
function lootBeam(x,z,color){ const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.2,2.4,16,1,true),m); b.position.set(x,1.2,z); scene.add(b);
  const it=new THREE.Mesh(new THREE.OctahedronGeometry(0.16),new THREE.MeshBasicMaterial({color,toneMapped:false})); it.position.set(x,0.25,z); scene.add(it);
  const L=new THREE.PointLight(color,6,4,1.5); L.position.set(x,0.6,z); scene.add(L); return {b,it}; }
const loots=[];
/* ---------- 요원 셋: 같은 몸, 다른 장비 (§4.1 «입은 장비가 그대로 보여야 한다») ---------- */
const loader=new GLTFLoader(); const load=u=>new Promise((ok,no)=>loader.load(u,ok,undefined,no));
const SETS=[
  { u:0, v:-1.0, ry:0.5, clip:'idle', eq:{ main:'w_marsh_scythe', chest:'a_reed_cuirass', legs:'a_black_greaves', gloves:'a_steel_gauntlet', boots:'a_ranger_boots' }, core:0xff3030 },
  { u:-2.8, v:-2.2, ry:1.4, clip:'run', eq:{ main:'w_marsh_scythe', head:'a_sluice_helm', chest:'a_sluice_cuirass', legs:'a_sluice_greaves', gloves:'a_sluice_gauntlet', boots:'a_sluice_boots' }, core:0x30d0ff },
  { u:2.8, v:-0.4, ry:-0.6, clip:'guard', eq:{ main:'w_marsh_scythe', head:'a_ward_mask', chest:'a_ward_coat', legs:'a_ward_greaves', gloves:'a_ward_gloves', boots:'a_ward_boots' }, core:0x40ff9a } ];
const mixers=[], agentsRoots=[];
/* 캐릭터 전용 빛(레이어 2): 밤 배경은 어둡게 두고 인물만 또렷하게 — 장비 외형이 읽혀야 한다 (§4.1).
   화면 기준 왼쪽 위에서 따뜻한 주광, 뒤에서 붉은·푸른 림 — 사이버펑크 실루엣 */
cam.layers.enable(2);
{ const C=(u,v,y)=>new THREE.Vector3().addScaledVector(new THREE.Vector3(Math.cos(AZ),0,-Math.sin(AZ)),u).addScaledVector(new THREE.Vector3(-Math.sin(AZ),0,-Math.cos(AZ)),v).setY(y); /* 카메라 기준 — 거리 방향과 상관없이 화면에서 같은 쪽 */
  const k=new THREE.DirectionalLight(0xfff0e0,2.6); k.position.copy(C(-6,-6,9)); k.layers.set(2); scene.add(k);
  const r1=new THREE.DirectionalLight(0xff3a3a,3.4); r1.position.copy(C(7,6,4)); r1.layers.set(2); scene.add(r1);
  const r2=new THREE.DirectionalLight(0x40d8ff,2.6); r2.position.copy(C(-7,6,3)); r2.layers.set(2); scene.add(r2); }
async function agents(){ const base=await load('art/3d/ain_anim.glb'); if(window.TW_POSE) TW_POSE.repair(THREE, base);
  for(const s of SETS){ const root=SkeletonUtils.clone(base.scene); if(window.TW_MATFIX) TW_MATFIX.repair(THREE, root);
    const at=W(s.u,s.v); root.position.copy(at); root.rotation.y=FACE+s.ry; scene.add(root); agentsRoots.push(root);
    root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; o.frustumCulled=false; } });
    window.TW_HAIR&&TW_HAIR.sync(root, s.eq); TW_LOOKS.attach(THREE, loader, root, s.eq, { charId:'ain' });
    const mx=new THREE.AnimationMixer(root); const c=base.animations.find(a=>a.name===s.clip)||base.animations[0]; mx.clipAction(c).play(); mx.setTime(Math.random()*c.duration); mixers.push(mx);
    /* 발밑 빛 고리 — 밤 배경에서 내 캐릭터를 찾는 표식 */
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.42,0.5,40),new THREE.MeshBasicMaterial({color:s.core,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));
    ring.rotation.x=-Math.PI/2; ring.position.copy(at).setY(0.02); scene.add(ring);
    root.traverse(o=>o.layers.enable(2)); }
  { const a=W(4.8,-3.6), b=W(-1.6,0.2); loots.push(lootBeam(a.x,a.z,0xffa020), lootBeam(b.x,b.z,0x40a0ff)); }
  await new Promise(r=>setTimeout(r,2500)); /* 장비 GLB 가 붙을 시간 */
  /* 장비 조각은 늦게 붙는다 — 붙은 뒤 캐릭터 전용 빛 레이어(2)를 다시 켠다 */
  scene.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.frustumCulled=false; } });
  agentsRoots.forEach(r=>r.traverse(o=>o.layers.enable(2))); }
const bloom=createBloom(renderer,{div:2,threshold:0.7,soft:0.3,amount:0.9});
const clock=new THREE.Clock(); let frames=0;
function tick(){ const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime; frames++;
  mixers.forEach(m=>m.update(dt));
  const p=rg.attributes.position.array; for(let i=0;i<RAIN;i++){ let y=p[i*6+1]-dt*18; if(y<0) y+=16; p[i*6+1]=y; p[i*6+4]=y-0.55; } rg.attributes.position.needsUpdate=true;
  SIGN_MATS.forEach(s=>{ if(!s.flicker) return; const on=Math.sin(t*23)>-0.92||Math.random()>0.2; s.L.intensity=on?s.base:1; s.m.color.setScalar(on?1.6:0.5); });
  loots.forEach((l,i)=>{ l.it.rotation.y=t*2+i; l.it.position.y=0.25+Math.sin(t*3+i)*0.06; });
  if(bloom) bloom.render(scene,cam); else renderer.render(scene,cam); requestAnimationFrame(tick); }
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight,false); frame(); });
window.__STREET={ ready:agents().then(()=>true), get frames(){ return frames; } };
tick();
</script>
</body>
