<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>거점 그레이박스 미리보기</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#15161a;color:#ddd;font:13px "Noto Sans KR",sans-serif;overflow:hidden}
#lg{position:fixed;left:12px;top:10px;line-height:1.6;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px}
#lg i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
#lg b{font-size:15px}
</style></head><body>
<div id="lg"></div>
<script src="node-graybox.js"></script>
<script type="module">
/* ?node=namsan_n01 · ?view=top|persp — UE 그레이박스(UHWNodeConfig::LoadFromJson)와 같은 상자를 그린다 (docs/design/200).
   흰 선 = 정면 길, 초록 = 우회로(질주형), 노랑 = 발전동·통신센터 길. 점 = 적 시작(빨강)·플레이어(파랑)·기술자(초록)·보스(보라) */
import * as T from '../../vendor/three/three.module.js';
const q=new URLSearchParams(location.search), id=q.get('node')||'namsan_n01', view=q.get('view')||'persp';
const N=await (await fetch('../../ue/HwanghonCombatUE/Content/Data/node_'+id+'.json')).json(), H=window.HW_NODE, B=H.blocks(N);
const r=new T.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight); r.setPixelRatio(1); document.body.appendChild(r.domElement);
const s=new T.Scene(); s.background=new T.Color(0x15161a);
s.add(new T.HemisphereLight(0xffffff,0x303040,1.4)); const sun=new T.DirectionalLight(0xffffff,1.6); sun.position.set(-0.4,-0.5,1); s.add(sun);
const M=1/100;   // cm → m, UE (x 동, y 북, z 위) → three (x 동, y 위, −z 북)
const P=([x,y,z])=>new T.Vector3(x*M,z*M,-y*M);
const COL={pad:0x5a5c62,road:0x3e4046,flank:0x46553e,wall:0x8a8376,gate:0xe0a040,generator:0x40a0e0,comms:0xd04848};
for(const b of B){ const g=new T.BoxGeometry(b.half[0]*2*M,b.half[2]*2*M,b.half[1]*2*M), m=new T.Mesh(g,new T.MeshLambertMaterial({color:COL[b.fkind||b.kind]}));
  m.position.copy(P(b.center)); m.rotation.order='YXZ'; m.rotation.y=b.yaw*Math.PI/180; m.rotation.z=b.pitch*Math.PI/180; s.add(m);
  if(b.fkind){ const e=new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:0xffffff})); e.position.copy(m.position); s.add(e); } }
const line=(pts,c)=>{ const g=new T.BufferGeometry().setFromPoints(pts.map(p=>P([p[0],p[1],p[2]+60]))); s.add(new T.Line(g,new T.LineBasicMaterial({color:c}))); };
line(N.routes.main,0xffffff); line(N.routes.west,0x7fe07f); line(N.routes.east,0x7fe07f); line([N.routes.main.at(-1),...N.routes.generator],0xffe060); line([N.routes.main.at(-1),...N.routes.comms],0xffe060);
const dot=(p,c,rad=1.6)=>{ const m=new T.Mesh(new T.SphereGeometry(rad,16,12),new T.MeshBasicMaterial({color:c})); m.position.copy(P([p[0],p[1],p[2]+120])); s.add(m); };
N.spawns.forEach(p=>dot(p,0xff4040)); dot(N.player_start,0x40a0ff,2.2); dot(N.technician_start,0x40e080); dot(N.boss_start,0xb050ff,2.4);
const cam=view==='top'?new T.OrthographicCamera(-1,1,1,-1,1,2000):new T.PerspectiveCamera(42,innerWidth/innerHeight,1,4000);
if(view==='top'){ const a=innerWidth/innerHeight,h=132; Object.assign(cam,{left:-h*a,right:h*a,top:h,bottom:-h}); cam.position.set(0,600,28); cam.up.set(0,0,-1); cam.lookAt(0,0,28); cam.updateProjectionMatrix(); }
else { cam.position.set(-110,95,215); cam.lookAt(5,-8,40); }
r.render(s,cam);
document.getElementById('lg').innerHTML='<b>'+N.name+'</b> · '+(view==='top'?'위에서':'남서쪽에서')+'<br>'+[['pad','받침'],['road','길'],['flank','우회로'],['wall','벽'],['gate','정문'],['generator','발전기'],['comms','통신센터']].map(([k,t])=>'<i style="background:#'+COL[k].toString(16).padStart(6,'0')+'"></i>'+t).join(' &nbsp;')+
 '<br><span style="color:#fff">━ 정면 길</span> &nbsp;<span style="color:#7fe07f">━ 우회로</span> &nbsp;<span style="color:#ffe060">━ 시설 길</span><br><span style="color:#ff4040">●</span> 적 시작 &nbsp;<span style="color:#40a0ff">●</span> 플레이어 &nbsp;<span style="color:#40e080">●</span> 기술자 &nbsp;<span style="color:#b050ff">●</span> 보스';
window.__DONE=true;
</script></body></html>
