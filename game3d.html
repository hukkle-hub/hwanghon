<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 던전 01 지하 훈련장 (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/battle.css">
<style>
/* ===== Phaser 던전: 캔버스(#game) 위에 DOM HUD ===== */
.dg{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#0B0C0F}
#game3d{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:none}
/* 피해 숫자·배너·안내 */
.dmgnum{position:absolute;z-index:7;font-family:var(--f-serif);font-size:20px;color:#F0E4E4;text-shadow:0 1px 4px #000;pointer-events:none;animation:rise .9s forwards;font-variant-numeric:tabular-nums}
.dmgnum.crit{color:#C9A45E;font-size:24px}.dmgnum.counter{color:#D9544E;font-size:30px}.dmgnum.taken{color:#C7332C;font-size:18px}.dmgnum.miss{color:#8A8A8A;font-size:14px;letter-spacing:.2em}
.dmgnum.deflect{color:#CFE4FF;font-size:22px;letter-spacing:.18em;text-shadow:0 0 12px rgba(150,200,255,.8),0 1px 4px #000}
/* 스매시 타점 — 날끝 정타는 금빛으로 크게, 빗맞음은 잿빛으로 작게 (js/swing-point.js) */
.dmgnum.pt-sweet{color:#FFD27A;font-size:15px;letter-spacing:.22em;text-shadow:0 0 10px rgba(255,190,90,.75),0 1px 4px #000}
.dmgnum.pt-glance{color:#9A958E;font-size:13px;letter-spacing:.22em}
@keyframes rise{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-64px);opacity:0}}
.counter{opacity:0;transition:opacity .25s;pointer-events:none}.counter.is-on{opacity:1}.counter.perfect .counter__lb{color:#F0E4E4}
.guide{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:6;font-size:13px;color:#EBD6D6;letter-spacing:.06em;text-shadow:0 1px 4px #000;padding:6px 14px;border:1px solid rgba(255,255,255,.12);background:rgba(6,7,10,.7);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%}
.guide.is-on{opacity:1}.guide b{color:#C9A45E;font-weight:400}
.bosshp,.bttimer{transition:opacity .4s}.bosshp.is-off,.bttimer.is-off{opacity:0}
.ph{font-size:10px;letter-spacing:.2em;color:#C9A45E;margin-top:3px}
/* 미니맵 */
.mini{position:absolute;right:20px;top:64px;z-index:6;border:1px solid var(--line);background:rgba(6,7,10,.7);padding:4px}
.mini canvas{display:block;width:150px;height:45px}
.mini__lb{font-size:9px;letter-spacing:.14em;color:var(--tx-faint);margin-top:2px;text-align:center}
/* 하단 HUD: 왼쪽 스틱 · 오른쪽 행동 버튼 */
.bthud{z-index:9}
.stick{touch-action:none}
.stick i{transition:none}
.stick__lb{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-size:9px;color:var(--tx-faint);letter-spacing:.12em;white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(4,50px);grid-auto-rows:50px;gap:8px;margin-left:auto;align-items:end}
.abtn{border:1px solid rgba(255,255,255,.14);background:rgba(10,11,14,.72);display:grid;place-items:center;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#EBD6D6}
.abtn:active{filter:brightness(1.5)}
.abtn .sk__k{position:absolute;left:3px;top:2px;font-size:9px;color:var(--tx-faint)}
.abtn .sk__cd{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:15px;color:#EBD6D6;font-variant-numeric:tabular-nums}
.abtn .sk__nm{position:absolute;left:0;right:0;bottom:-14px;font-size:8.5px;color:var(--tx-faint);text-align:center;letter-spacing:.04em;white-space:nowrap}
.abtn.is-ready{border-color:rgba(201,164,94,.7);box-shadow:0 0 12px rgba(201,164,94,.3)}
.abtn--atk{grid-column:3/5;grid-row:2/4;width:auto;height:auto;border-color:rgba(199,58,54,.6);background:radial-gradient(circle,rgba(120,20,20,.8),rgba(30,8,8,.85))}
.abtn--atk .ico{width:34px;height:34px}
.abtn--dodge{grid-column:1/3;grid-row:2/3;width:auto;border-color:rgba(123,155,214,.5)}
.abtn--dodge .ico{width:26px;height:26px}
.abtn--ult{grid-column:1/3;grid-row:3/4;width:auto;border-color:rgba(199,58,54,.6)}
.abtn--ult.is-ready{border-color:#C9A45E;box-shadow:0 0 18px rgba(201,164,94,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(201,164,94,.3)}}
.ultg{display:flex;align-items:center;gap:8px;margin-top:6px}.ultg .bar{flex:1;height:6px}.ultg .bar__fill{background:linear-gradient(90deg,#5A2F14,#C9A45E)}
.ultg__v{font-size:9.5px;color:var(--tx-faint);font-variant-numeric:tabular-nums;width:34px;text-align:right}
/* 비네트 — 가장자리를 눌러 눈이 화면 가운데(캐릭터)로 가게. GPU 비용은 합성 한 장뿐이다.
   몬헌·마영전 둘 다 어두운 스테이지에서 쓴다. 이미 어두운 방이라 과하면 답답하므로 약하게.
   (선언만 해 두고 안 쓰던 클래스였다 — 이제 실제로 붙인다.) */
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 78% 74% at 50% 52%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 82%,rgba(0,0,0,.50) 100%)}
.flash{position:absolute;inset:0;z-index:8;background:#A51C1C;opacity:0;pointer-events:none}.flash.is-on{animation:flash .28s}
@keyframes flash{0%{opacity:0;background:#000}40%{opacity:.85;background:#000}55%{opacity:.5;background:#A51C1C}100%{opacity:0}}
.ov{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(6,7,10,.82);backdrop-filter:blur(2px)}.ov.is-on{display:grid}
.ov__box{box-sizing:border-box;width:min(560px,92vw);max-height:90dvh;overflow:auto;text-align:center;padding:20px clamp(12px,3vw,28px);border:1px solid var(--line);background:rgba(11,12,15,.9)}
.ov__k{font-size:11px;letter-spacing:.3em;color:#C9A45E;font-family:var(--f-serif)}.ov__t{font-family:var(--f-serif);font-size:26px;color:var(--tx-hi);margin:8px 0 2px}.ov__l{font-size:12px;color:var(--tx-faint);letter-spacing:.1em}
.ov__line{font-family:var(--f-serif);font-size:14px;color:#EBD6D6;margin:16px 0 4px;line-height:1.6}.ov__hint{font-size:12px;color:var(--tx-dim);margin-bottom:18px}
.ov__stats{display:flex;justify-content:center;gap:22px;margin:14px 0 18px}.ov__stats div{font-size:11px;color:var(--tx-faint)}.ov__stats b{display:block;font-family:var(--f-serif);font-size:22px;color:var(--tx-hi);font-weight:400}
.ov__stats b.g-S{color:#D94A45}.ov__stats b.g-A{color:#C9A45E}.ov__stats b.g-B{color:#7B9BD6}.ov__stats b.g-C{color:#8A8A8A}
.ov .btn{min-width:180px}.ov__ctrl{margin-top:14px;font-size:10.5px;color:var(--tx-faint);letter-spacing:.06em;line-height:1.8}
html.mobile .guide{top:auto;bottom:126px;font-size:12px;padding:4px 10px}
html.mobile .mini{top:56px;right:max(12px,env(safe-area-inset-right))}
html.mobile .mini canvas{width:120px;height:36px}
html.mobile .actions{grid-template-columns:repeat(4,46px);grid-auto-rows:46px;gap:6px}
html.mobile .ov__t{font-size:22px}

.mini{z-index:6}
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:10px 0 14px;font-size:12px;color:var(--tx-dim)}
.ov .setrow .btn{min-width:60px;min-height:44px}.setrow select{min-height:44px;background:#191c22;color:#eee;border:1px solid var(--line);padding:8px}.ov__box>.btn{margin-bottom:8px}
.setrow input[type=range]{width:180px;accent-color:#C9A45E}
.setrow label{letter-spacing:.08em}
.setpair{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

.quest{position:absolute;left:18px;top:130px;z-index:5;font-size:11px;color:var(--tx-dim);letter-spacing:.04em;background:rgba(6,7,10,.55);border-left:2px solid #C9A45E;padding:6px 10px;min-width:150px}
.quest__t{font-family:var(--f-serif);font-size:11px;color:#C9A45E;letter-spacing:.14em;margin-bottom:4px}
.quest div.q{display:flex;justify-content:space-between;gap:10px;padding:1px 0}.quest div.q.done{color:var(--tx-faint);text-decoration:line-through}.quest div.q.cur{color:#F0E4E4}.quest div.q.opt{color:#B9A46E;font-size:10.5px}.quest div.q.opt.done{color:var(--tx-faint)}
.combo{position:absolute;right:200px;top:118px;z-index:6;text-align:right;opacity:0;transition:opacity .2s;pointer-events:none}.combo.is-on{opacity:1}
.combo b{font-family:var(--f-serif);font-size:38px;color:#F0E4E4;text-shadow:0 2px 6px #000;line-height:1}.combo span{display:block;font-size:10px;letter-spacing:.3em;color:#C9A45E}
.combo.big b{color:#D94A45;font-size:46px}
.toasts{position:absolute;left:18px;top:232px;z-index:7;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none}
.toast{font-size:12px;color:#EBD6D6;background:rgba(6,7,10,.7);border:1px solid rgba(201,164,94,.4);padding:4px 12px;letter-spacing:.06em;animation:toast 1.8s forwards}
.toast b{color:#C9A45E;font-weight:400}
.toast .tico{width:18px;height:18px;vertical-align:-5px;margin-right:5px}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.stagger{display:flex;align-items:center;gap:8px;margin:6px auto 0;width:60%}.stagger__lb{font-size:9px;letter-spacing:.2em;color:var(--tx-faint)}.stagger .bar{flex:1;height:5px}.stagger .bar__fill{background:linear-gradient(90deg,#5A3F14,#C9A45E)}
.stagger.is-down .bar__fill{background:#F0E4E4}
.xpg{display:flex;align-items:center;gap:8px;margin-top:6px}.xpg .bar{flex:1;height:5px}.xpg .bar__fill{background:linear-gradient(90deg,#2B3C31,#5FAE9B)}
.dlg{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:min(640px,88%);z-index:25;background:rgba(6,7,10,.92);border:1px solid var(--line);border-left:3px solid #C9A45E;padding:12px 18px;display:none;cursor:pointer}
.dlg.is-on{display:block}.dlg__face{float:left;width:58px;height:58px;margin:0 12px 6px 0;border:1px solid rgba(201,164,94,.5);object-fit:cover;background:#111}.dlg__who{font-family:var(--f-serif);font-size:12px;color:#C9A45E;letter-spacing:.2em;margin-bottom:6px}.dlg__txt{font-size:14px;color:#EBD6D6;line-height:1.6}.dlg__hint{font-size:10px;color:var(--tx-faint);text-align:right;margin-top:6px;letter-spacing:.1em}
.abtn--guard{grid-column:2/3;grid-row:2/3;border-color:rgba(123,155,214,.5)}
.abtn--dodge{grid-column:1/2;grid-row:2/3;width:auto}
.abtn.is-hold{filter:brightness(1.5);box-shadow:inset 0 0 14px rgba(255,255,255,.25)}
html.mobile .quest{left:max(10px,env(safe-area-inset-left));top:118px;font-size:10.5px;min-width:130px}
html.mobile .combo{top:100px;right:170px}
html.mobile .toasts{left:max(10px,env(safe-area-inset-left));top:210px}
.deathov .ov__t{color:#D94A45}
.loading{position:absolute;inset:0;z-index:30;background:#07080B;transition:opacity .6s;overflow:hidden}
.loading__art{position:absolute;inset:0;background:#07080B url(art/title-ain.webp) no-repeat 68% 50%/cover;opacity:.85}
.loading__art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,11,.94) 0%,rgba(7,8,11,.6) 40%,rgba(7,8,11,.1) 70%),linear-gradient(0deg,rgba(7,8,11,.95) 0%,rgba(7,8,11,.2) 40%,rgba(7,8,11,.5) 100%)}
.loading__box{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:min(440px,70vw)}
.loading__k{font-size:11px;letter-spacing:.34em;color:#C9A45E;font-family:var(--f-serif)}
.loading__t{font-family:var(--f-serif);font-size:34px;color:var(--tx-hi);margin-top:4px;letter-spacing:.08em}
.loading__p{font-size:12px;color:var(--tx-faint);letter-spacing:.14em;margin-top:2px}
.loading__bar{height:4px;background:rgba(255,255,255,.08);margin-top:18px;position:relative;overflow:hidden}
.loading__bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#6B1B1B,#D9544E);transition:width .25s;box-shadow:0 0 10px rgba(217,84,78,.6)}
.loading__row{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--tx-faint);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.loading__tip{margin-top:14px;font-size:12.5px;line-height:1.6;color:#B9B2A7;min-height:2.6em;transition:opacity .3s}
.loading__tip b{color:#E4C97F;font-weight:400}
.loading__tip.is-fade{opacity:0}
.loading__logo{position:absolute;right:max(26px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));font-family:var(--f-serif);font-size:15px;letter-spacing:.4em;color:var(--tx-faint)}
.loading.is-err .loading__bar i{background:#8A8A8A}
html.mobile .loading__t{font-size:26px}
html.mobile .loading__box{width:min(400px,62vw);bottom:max(16px,env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left))}
html.mobile .loading__tip{font-size:12px}
.loading.is-off{opacity:0;pointer-events:none}

.exp-interact{position:absolute;left:50%;bottom:155px;transform:translateX(-50%);z-index:15;background:#172729ee;color:#f3dfb8;border:1px solid #bba26d;border-radius:6px;padding:13px 22px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 20px #0008;touch-action:manipulation}
.exp-interact.is-exec{background:#3a1512ee;color:#ffd9a8;border-color:#d9704a;font-size:17px;padding:15px 30px;box-shadow:0 0 26px #d9704a66;animation:execPulse .7s ease-in-out infinite alternate}
@keyframes execPulse{from{box-shadow:0 0 16px #d9704a44;transform:translateX(-50%) scale(1)}to{box-shadow:0 0 34px #ff8a5aaa;transform:translateX(-50%) scale(1.06)}}
.exp-interact[hidden]{display:none}.exp-map{position:absolute;right:20px;top:118px;z-index:7;background:#172024dd;color:#d9d3c2;border:1px solid #697571;padding:8px 12px;cursor:pointer;touch-action:manipulation}.exp-fullmap{width:100%;max-height:48vh;object-fit:contain;background:#101a1c;border:1px solid #354740}.exp-map-key{font-size:12px;color:#b9c7bc;line-height:1.8;margin:8px 0 16px}
.target-cycle{position:absolute;right:20px;top:165px;z-index:7;min-width:150px;max-width:220px;min-height:48px;padding:7px 12px;border:1px solid #987d4b;background:#151a21ed;color:#eed9ab;font:inherit;font-size:12px;cursor:pointer;touch-action:manipulation;text-align:left}.target-cycle small{display:block;color:#b6bcc4;font-size:10px;margin-top:3px}.target-cycle[hidden]{display:none}
.lockon{position:absolute;right:20px;top:220px;z-index:7;padding:7px 12px;border:1px solid #987d4b;background:#151a21ed;color:#eed9ab;font:inherit;font-size:12px;cursor:pointer;touch-action:manipulation}
.lockon.is-off{border-color:#5c6168;color:#8d939b}.lockon[hidden]{display:none}
@media(max-height:640px){.lockon{top:158px;right:12px;font-size:11px;padding:6px 9px}}
@media(max-height:640px){.target-cycle{top:107px;right:12px;min-width:130px;max-width:170px;font-size:11px}}
html.mobile .exp-interact{bottom:128px;font-size:12px;padding:10px 14px}html.mobile .exp-map{top:66px;right:10px;padding:6px 9px;font-size:11px}
</style>
</head>
<body data-landscape data-nonav data-responsive-mobile>
<script src="js/icons.js"></script>
<div class="stage">
  <div class="bt dg" id="dg">
    <canvas id="game3d"></canvas>
    <div class="vignette" id="vig"></div>
    <div class="flash" id="flash"></div>
    <div class="bosshp is-off" id="bosshp">
      <div class="bosshp__nm" id="b-name">—</div>
      <div class="bosshp__bar"><svg class="ico ico--sm" style="color:#C9534E"><use href="#i-skull"/></svg><div class="bar" data-fill="100" id="b-hp"></div><span class="stack" id="b-stack"></span></div>
      <div class="stagger"><span class="stagger__lb">격추</span><div class="bar" data-fill="0" id="b-stag"></div></div>
      <div class="ph" id="b-ph"></div>
    </div>
    <div class="bttimer is-off" id="bttimer"><span class="bttimer__t"><svg class="ico ico--sm"><use href="#i-clock"/></svg><span id="b-timer">00 : 00</span></span><button class="iconbtn" id="btn-pause" aria-label="일시정지"><svg class="ico ico--lg"><use href="#i-pause"/></svg></button></div>
    <div class="btparty" id="btparty"></div>
    <div class="quest" id="quest"></div>
    <button class="exp-interact" id="exp-interact" type="button" hidden>F · 조사</button>
    <button class="exp-map" id="exp-map" type="button" aria-label="임무 지도">M · 지도</button>
    <button class="target-cycle" id="target-cycle" type="button" hidden aria-label="다음 부위 조준"><span id="target-name"></span><small id="target-health"></small></button>
    <button class="lockon" id="lockon" type="button" hidden aria-label="락온 전환">T · 락온 켜짐</button>
    <div class="combo" id="combo"><b id="combo-n">0</b><span>HIT</span></div>
    <div class="toasts" id="toasts"></div>
    <div class="dlg" id="dlg"><img class="dlg__face" id="dlg-face" alt="" hidden><div class="dlg__who" id="dlg-who"></div><div class="dlg__txt" id="dlg-txt"></div><div class="dlg__hint">탭하여 계속</div></div>
    <div class="mini"><canvas id="mini" width="300" height="90"></canvas><div class="mini__lb">지하 훈련장</div></div>
    <div class="counter" id="counter"><div class="counter__lb" id="c-lb">C O U N T E R</div><div class="counter__v" id="c-v">0</div><div class="counter__sub" id="c-sub"></div></div>
    <div class="status" id="status"></div>
    <div class="guide" id="guide"></div>
    <div class="bthud"><div class="bthud__row">
      <div class="stick" id="stick"><i></i><span class="stick__lb">이동</span></div>
      <div class="vitals" id="vitals">
        <div class="vital"><svg class="ico ico--sm vital__ic"><use href="#i-heart"/></svg><div class="bar bar--hp bar--tall" data-fill="100" id="v-hp"></div><span class="vital__v" id="v-hpv"></span></div>
        <div class="vital stamina"><svg class="ico ico--sm vital__ic"><use href="#i-bolt"/></svg><div class="bar bar--tall" data-fill="100" id="v-st"></div><span class="vital__v" id="v-stv"></span></div>
        <div class="xpg"><span class="xs t-faint" style="letter-spacing:.14em" id="xp-lv">LV.1</span><div class="bar" data-fill="0" id="v-xp"></div><span class="ultg__v" id="v-gold">0</span></div>
        <div class="ultg"><span class="xs t-faint" style="letter-spacing:.14em">ULT</span><div class="bar" data-fill="0" id="v-ult"></div><span class="ultg__v" id="v-ultv">0%</span></div>
      </div>
      <div class="actions" id="actions"></div>
    </div></div>
    <div class="ov" id="ov"><div class="ov__box" id="ov-box"></div></div>
    <div class="loading" id="loading">
      <div class="loading__art"></div>
      <div class="loading__box">
        <div class="loading__k">던전 01</div>
        <div class="loading__t">지하 훈련장</div>
        <div class="loading__p">마태오의 인력사무소 지하 벙커</div>
        <div class="loading__bar"><i id="ld-fill"></i></div>
