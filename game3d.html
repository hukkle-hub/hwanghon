<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 던전 01 지하 훈련장 (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/battle.css">
<style>
/* ===== Phaser 던전: 캔버스(#game) 위에 DOM HUD ===== */
.dg{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#0B0C0F}
#game3d{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:none}
/* 피해 숫자·배너·안내 */
.dmgnum{position:absolute;z-index:7;font-family:var(--f-serif);font-size:20px;color:#F0E4E4;text-shadow:0 1px 4px #000;pointer-events:none;animation:rise .9s forwards;font-variant-numeric:tabular-nums}
.dmgnum.crit{color:#C9A45E;font-size:24px}.dmgnum.counter{color:#D9544E;font-size:30px}.dmgnum.taken{color:#C7332C;font-size:18px}.dmgnum.miss{color:#8A8A8A;font-size:14px;letter-spacing:.2em}
.dmgnum.deflect{color:#CFE4FF;font-size:22px;letter-spacing:.18em;text-shadow:0 0 12px rgba(150,200,255,.8),0 1px 4px #000}
/* 스매시 타점 — 날끝 정타는 금빛으로 크게, 빗맞음은 잿빛으로 작게 (js/swing-point.js) */
.dmgnum.pt-sweet{color:#FFD27A;font-size:15px;letter-spacing:.22em;text-shadow:0 0 10px rgba(255,190,90,.75),0 1px 4px #000}
.dmgnum.pt-glance{color:#9A958E;font-size:13px;letter-spacing:.22em}
@keyframes rise{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-64px);opacity:0}}
.counter{opacity:0;transition:opacity .25s;pointer-events:none}.counter.is-on{opacity:1}.counter.perfect .counter__lb{color:#F0E4E4}
.guide{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:6;font-size:13px;color:#EBD6D6;letter-spacing:.06em;text-shadow:0 1px 4px #000;padding:6px 14px;border:1px solid rgba(255,255,255,.12);background:rgba(6,7,10,.7);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%}
.guide.is-on{opacity:1}.guide b{color:#C9A45E;font-weight:400}
.bosshp,.bttimer{transition:opacity .4s}.bosshp.is-off,.bttimer.is-off{opacity:0}
.ph{font-size:10px;letter-spacing:.2em;color:#C9A45E;margin-top:3px}
/* 미니맵 */
.mini{position:absolute;right:20px;top:64px;z-index:6;border:1px solid var(--line);background:rgba(6,7,10,.7);padding:4px}
.mini canvas{display:block;width:150px;height:45px}
.mini__lb{font-size:9px;letter-spacing:.14em;color:var(--tx-faint);margin-top:2px;text-align:center}
/* 하단 HUD: 왼쪽 스틱 · 오른쪽 행동 버튼 */
.bthud{z-index:9}
.stick{touch-action:none}
.stick i{transition:none}
.stick__lb{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-size:9px;color:var(--tx-faint);letter-spacing:.12em;white-space:nowrap}
.abtn{border:1px solid rgba(255,255,255,.14);background:rgba(10,11,14,.72);display:grid;place-items:center;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#EBD6D6}
.abtn:active{filter:brightness(1.5)}
.abtn .sk__k{position:absolute;left:3px;top:2px;font-size:9px;color:var(--tx-faint)}
.abtn .sk__cd{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:15px;color:#EBD6D6;font-variant-numeric:tabular-nums}
.abtn .sk__nm{position:absolute;left:0;right:0;bottom:-14px;font-size:8.5px;color:var(--tx-faint);text-align:center;letter-spacing:.04em;white-space:nowrap}
.abtn.is-ready{border-color:rgba(201,164,94,.7);box-shadow:0 0 12px rgba(201,164,94,.3)}
.abtn--atk .ico{width:34px;height:34px}
.abtn--dodge .ico{width:26px;height:26px}
.abtn--ult.is-ready{border-color:#C9A45E;box-shadow:0 0 18px rgba(201,164,94,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(201,164,94,.3)}}
.ultg{display:flex;align-items:center;gap:8px;margin-top:6px}.ultg .bar{flex:1;height:6px}.ultg .bar__fill{background:linear-gradient(90deg,#5A2F14,#C9A45E)}
.ultg__v{font-size:9.5px;color:var(--tx-faint);font-variant-numeric:tabular-nums;width:34px;text-align:right}
/* 비네트 — 가장자리를 눌러 눈이 화면 가운데(캐릭터)로 가게. GPU 비용은 합성 한 장뿐이다.
   몬헌·마영전 둘 다 어두운 스테이지에서 쓴다. 이미 어두운 방이라 과하면 답답하므로 약하게.
   (선언만 해 두고 안 쓰던 클래스였다 — 이제 실제로 붙인다.) */
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 78% 74% at 50% 52%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 82%,rgba(0,0,0,.50) 100%)}
.flash{position:absolute;inset:0;z-index:8;background:#A51C1C;opacity:0;pointer-events:none}.flash.is-on{animation:flash .28s}
@keyframes flash{0%{opacity:0;background:#000}40%{opacity:.85;background:#000}55%{opacity:.5;background:#A51C1C}100%{opacity:0}}
.ov{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(6,7,10,.82);backdrop-filter:blur(2px)}.ov.is-on{display:grid}
.ov__box{box-sizing:border-box;width:min(560px,92vw);max-height:90dvh;overflow:auto;text-align:center;padding:20px clamp(12px,3vw,28px);border:1px solid var(--line);background:rgba(11,12,15,.9)}
.ov__k{font-size:11px;letter-spacing:.3em;color:#C9A45E;font-family:var(--f-serif)}.ov__t{font-family:var(--f-serif);font-size:26px;color:var(--tx-hi);margin:8px 0 2px}.ov__l{font-size:12px;color:var(--tx-faint);letter-spacing:.1em}
.ov__line{font-family:var(--f-serif);font-size:14px;color:#EBD6D6;margin:16px 0 4px;line-height:1.6}.ov__hint{font-size:12px;color:var(--tx-dim);margin-bottom:18px}
.ov__stats{display:flex;justify-content:center;gap:22px;margin:14px 0 18px}.ov__stats div{font-size:11px;color:var(--tx-faint)}.ov__stats b{display:block;font-family:var(--f-serif);font-size:22px;color:var(--tx-hi);font-weight:400}
.ov__stats b.g-S{color:#D94A45}.ov__stats b.g-A{color:#C9A45E}.ov__stats b.g-B{color:#7B9BD6}.ov__stats b.g-C{color:#8A8A8A}
.ov .btn{min-width:180px}.ov__ctrl{margin-top:14px;font-size:10.5px;color:var(--tx-faint);letter-spacing:.06em;line-height:1.8}
html.mobile .guide{top:auto;bottom:126px;font-size:12px;padding:4px 10px}
html.mobile .mini{top:56px;right:max(12px,env(safe-area-inset-right))}
html.mobile .mini canvas{width:120px;height:36px}
html.mobile .ov__t{font-size:22px}

.mini{z-index:6}
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:10px 0 14px;font-size:12px;color:var(--tx-dim)}
.ov .setrow .btn{min-width:60px;min-height:44px}.setrow select{min-height:44px;background:#191c22;color:#eee;border:1px solid var(--line);padding:8px}.ov__box>.btn{margin-bottom:8px}
.setrow input[type=range]{width:180px;accent-color:#C9A45E}
.setrow label{letter-spacing:.08em}
.setpair{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

.quest{position:absolute;left:18px;top:130px;z-index:5;font-size:11px;color:var(--tx-dim);letter-spacing:.04em;background:rgba(6,7,10,.55);border-left:2px solid #C9A45E;padding:6px 10px;min-width:150px}
.quest__t{font-family:var(--f-serif);font-size:11px;color:#C9A45E;letter-spacing:.14em;margin-bottom:4px}
.quest div.q{display:flex;justify-content:space-between;gap:10px;padding:1px 0}.quest div.q.done{color:var(--tx-faint);text-decoration:line-through}.quest div.q.cur{color:#F0E4E4}.quest div.q.opt{color:#B9A46E;font-size:10.5px}.quest div.q.opt.done{color:var(--tx-faint)}
.combo{position:absolute;right:200px;top:118px;z-index:6;text-align:right;opacity:0;transition:opacity .2s;pointer-events:none}.combo.is-on{opacity:1}
.combo b{font-family:var(--f-serif);font-size:38px;color:#F0E4E4;text-shadow:0 2px 6px #000;line-height:1}.combo span{display:block;font-size:10px;letter-spacing:.3em;color:#C9A45E}
.combo.big b{color:#D94A45;font-size:46px}
.toasts{position:absolute;left:18px;top:232px;z-index:7;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none}
.toast{font-size:12px;color:#EBD6D6;background:rgba(6,7,10,.7);border:1px solid rgba(201,164,94,.4);padding:4px 12px;letter-spacing:.06em;animation:toast 1.8s forwards}
.toast b{color:#C9A45E;font-weight:400}
.toast .tico{width:18px;height:18px;vertical-align:-5px;margin-right:5px}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.stagger{display:flex;align-items:center;gap:8px;margin:6px auto 0;width:60%}.stagger__lb{font-size:9px;letter-spacing:.2em;color:var(--tx-faint)}.stagger .bar{flex:1;height:5px}.stagger .bar__fill{background:linear-gradient(90deg,#5A3F14,#C9A45E)}
.stagger.is-down .bar__fill{background:#F0E4E4}
.xpg{display:flex;align-items:center;gap:8px;margin-top:6px}.xpg .bar{flex:1;height:5px}.xpg .bar__fill{background:linear-gradient(90deg,#2B3C31,#5FAE9B)}
.dlg{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:min(640px,88%);z-index:25;background:rgba(6,7,10,.92);border:1px solid var(--line);border-left:3px solid #C9A45E;padding:12px 18px;display:none;cursor:pointer}
.dlg.is-on{display:block}.dlg__face{float:left;width:58px;height:58px;margin:0 12px 6px 0;border:1px solid rgba(201,164,94,.5);object-fit:cover;background:#111}.dlg__who{font-family:var(--f-serif);font-size:12px;color:#C9A45E;letter-spacing:.2em;margin-bottom:6px}.dlg__txt{font-size:14px;color:#EBD6D6;line-height:1.6}.dlg__hint{font-size:10px;color:var(--tx-faint);text-align:right;margin-top:6px;letter-spacing:.1em}
.abtn.is-hold{filter:brightness(1.5);box-shadow:inset 0 0 14px rgba(255,255,255,.25)}
/* 조작 패드 (디렉터 스케치, docs/design/77) — 왼쪽 세로로 긴 «이동» 패드, 오른쪽은
   구석의 큰 공격 · 그 위로 올라가는 호에 스킬 1→4 · 호 아래 줄에 카운터(방어)·회피·궁극기.
   좌표는 버튼 «중심»(묶음 왼쪽 위 기준, px). 폰에서는 묶음째 줄인다. */
.actions{position:relative;width:340px;height:250px;margin-left:auto;flex:none;transform-origin:100% 100%}
html.mobile .actions{display:block!important;transform:scale(.84);margin-left:-54px}
.actions .abtn{position:absolute;border-radius:50%;width:var(--d);height:var(--d);left:calc(var(--x) - var(--d)/2);top:calc(var(--y) - var(--d)/2)}
.actions .abtn .sk__k{left:50%;top:3px;transform:translateX(-50%)}
.actions .abtn .sk__cd{border-radius:50%}
.abtn--sk1{--x:120px;--y:124px;--d:54px}
.abtn--sk2{--x:174px;--y:82px;--d:54px}
.abtn--sk3{--x:236px;--y:54px;--d:54px}
.abtn--sk4{--x:302px;--y:46px;--d:54px}
.abtn--ult{--x:40px;--y:206px;--d:58px;border-color:rgba(199,58,54,.6)}
.abtn--dodge{--x:112px;--y:206px;--d:62px;border-color:rgba(123,155,214,.5)}
.abtn--guard{--x:186px;--y:206px;--d:62px;border-color:rgba(123,155,214,.6);background:radial-gradient(circle,rgba(40,58,96,.75),rgba(8,10,16,.85))}
.abtn--guard .ico{width:24px;height:24px}
.abtn--atk{--x:286px;--y:188px;--d:96px;border-color:rgba(199,58,54,.6);background:radial-gradient(circle,rgba(120,20,20,.8),rgba(30,8,8,.85))}
.abtn--atk .sk__nm{bottom:-15px}
/* 카운터 뒤 일시 탭 (docs/design/78) — 호와 공격 사이. 금빛으로 뛰고, 링이 남은 시간 */
.abtn--open{--x:286px;--y:112px;--d:58px;border:1px solid rgba(242,223,176,.72);background:radial-gradient(circle at 48% 42%,rgba(170,118,38,.72),rgba(32,20,8,.94) 70%);box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 18px rgba(232,193,112,.42);animation:opportunityArrive .18s cubic-bezier(.2,.85,.28,1.2),openBreathe 1.15s ease-in-out .18s infinite alternate;z-index:2}
.abtn--open[data-kind=grab]{border-color:rgba(224,122,74,.78);background:radial-gradient(circle at 48% 42%,rgba(150,60,24,.76),rgba(34,13,6,.94) 70%);box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 18px rgba(224,122,74,.42)}
.abtn--open[hidden]{display:none}
.abtn--open .open__lb{position:absolute;left:-18px;right:-18px;bottom:-17px;font-family:var(--f-serif);font-size:9px;color:#F2DFB0;text-align:center;letter-spacing:.16em;white-space:nowrap;text-shadow:0 2px 4px #000}
.abtn--open .open__ring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.abtn--open .open__ring circle{fill:none;stroke:#F2DFB0;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;filter:drop-shadow(0 0 3px rgba(242,223,176,.55))}
.abtn--open[data-kind=grab] .open__ring circle{stroke:#E9A06F}
@keyframes openRing{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}
@keyframes opportunityArrive{from{opacity:0;transform:scale(.68)}to{opacity:1;transform:scale(1)}}
@keyframes openBreathe{from{filter:brightness(.94)}to{filter:brightness(1.12)}}
html.mobile .abtn--open .sk__k{display:none}
/* 이동 패드: 세로로 긴 둥근 사각형. 누른 자리가 스틱 중심이 된다(떠 있는 스틱) */
.bthud .stick{width:150px;height:196px;border-radius:30px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12)}
html.mobile .bthud .stick{width:132px;height:172px}
.stick b{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:1px solid rgba(255,255,255,.16);left:50%;top:50%;pointer-events:none;opacity:.55}
.stick i{left:50%;top:50%}
.stick__lb{bottom:10px}
html.mobile .quest{left:max(10px,env(safe-area-inset-left));top:118px;font-size:10.5px;min-width:130px}
html.mobile .combo{top:100px;right:170px}
html.mobile .toasts{left:max(10px,env(safe-area-inset-left));top:210px}
.deathov .ov__t{color:#D94A45}
.loading{position:absolute;inset:0;z-index:30;background:#07080B;transition:opacity .6s;overflow:hidden}
.loading__art{position:absolute;inset:0;background:#07080B url(art/title-ain.webp) no-repeat 68% 50%/cover;opacity:.85}
.loading__art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,11,.94) 0%,rgba(7,8,11,.6) 40%,rgba(7,8,11,.1) 70%),linear-gradient(0deg,rgba(7,8,11,.95) 0%,rgba(7,8,11,.2) 40%,rgba(7,8,11,.5) 100%)}
.loading__box{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:min(440px,70vw)}
.loading__k{font-size:11px;letter-spacing:.34em;color:#C9A45E;font-family:var(--f-serif)}
.loading__t{font-family:var(--f-serif);font-size:34px;color:var(--tx-hi);margin-top:4px;letter-spacing:.08em}
.loading__p{font-size:12px;color:var(--tx-faint);letter-spacing:.14em;margin-top:2px}
.loading__bar{height:4px;background:rgba(255,255,255,.08);margin-top:18px;position:relative;overflow:hidden}
.loading__bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#6B1B1B,#D9544E);transition:width .25s;box-shadow:0 0 10px rgba(217,84,78,.6)}
.loading__row{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--tx-faint);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.loading__tip{margin-top:14px;font-size:12.5px;line-height:1.6;color:#B9B2A7;min-height:2.6em;transition:opacity .3s}
.loading__tip b{color:#E4C97F;font-weight:400}
.loading__tip.is-fade{opacity:0}
.loading__logo{position:absolute;right:max(26px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));font-family:var(--f-serif);font-size:15px;letter-spacing:.4em;color:var(--tx-faint)}
.loading.is-err .loading__bar i{background:#8A8A8A}
html.mobile .loading__t{font-size:26px}
html.mobile .loading__box{width:min(400px,62vw);bottom:max(16px,env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left))}
html.mobile .loading__tip{font-size:12px}
.loading.is-off{opacity:0;pointer-events:none}

.exp-interact{position:absolute;left:50%;bottom:155px;transform:translateX(-50%);z-index:15;background:#172729ee;color:#f3dfb8;border:1px solid #bba26d;border-radius:6px;padding:13px 22px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 20px #0008;touch-action:manipulation}
.exp-interact.is-exec{background:#3a1512ee;color:#ffd9a8;border-color:#d9704a;font-size:17px;padding:15px 30px;box-shadow:0 0 26px #d9704a66;animation:execPulse .7s ease-in-out infinite alternate}
@keyframes execPulse{from{box-shadow:0 0 16px #d9704a44;transform:translateX(-50%) scale(1)}to{box-shadow:0 0 34px #ff8a5aaa;transform:translateX(-50%) scale(1.06)}}
.exp-interact[hidden]{display:none}.exp-map{position:absolute;right:20px;top:118px;z-index:7;background:#172024dd;color:#d9d3c2;border:1px solid #697571;padding:8px 12px;cursor:pointer;touch-action:manipulation}.exp-fullmap{width:100%;max-height:48vh;object-fit:contain;background:#101a1c;border:1px solid #354740}.exp-map-key{font-size:12px;color:#b9c7bc;line-height:1.8;margin:8px 0 16px}
.target-cycle{position:absolute;right:20px;top:165px;z-index:7;min-width:150px;max-width:220px;min-height:48px;padding:7px 12px;border:1px solid #987d4b;background:#151a21ed;color:#eed9ab;font:inherit;font-size:12px;cursor:pointer;touch-action:manipulation;text-align:left}.target-cycle small{display:block;color:#b6bcc4;font-size:10px;margin-top:3px}.target-cycle[hidden]{display:none}
.lockon{position:absolute;right:20px;top:220px;z-index:7;padding:7px 12px;border:1px solid #987d4b;background:#151a21ed;color:#eed9ab;font:inherit;font-size:12px;cursor:pointer;touch-action:manipulation}
.lockon.is-off{border-color:#5c6168;color:#8d939b}.lockon[hidden]{display:none}
@media(max-height:640px){.lockon{top:158px;right:12px;font-size:11px;padding:6px 9px}}
@media(max-height:640px){.target-cycle{top:107px;right:12px;min-width:130px;max-width:170px;font-size:11px}}
html.mobile .exp-interact{bottom:128px;font-size:12px;padding:10px 14px}html.mobile .exp-map{top:66px;right:10px;padding:6px 9px;font-size:11px}

/* ===== 107 — CINEMATIC OPPORTUNITY UX v06 =====
   처형은 중앙 사각 버튼이 아니라 «무너진 적 위에 뜨는 기회 표식»으로 보인다.
   탐색 조사 버튼은 기존 위치를 유지하고, 전투 중 처형일 때만 월드 좌표 투영 위치를 쓴다. */
.exp-interact.is-exec{width:72px;height:72px;min-width:72px;min-height:72px;padding:0;border-radius:50%;border:1px solid rgba(238,157,100,.78);background:radial-gradient(circle at 50% 48%,rgba(115,23,15,.78) 0 43%,rgba(24,7,8,.95) 45% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.76),0 0 22px rgba(220,82,50,.42),inset 0 0 18px rgba(230,100,55,.16);color:transparent;font-size:0;letter-spacing:0;transform:translate(-50%,-50%);animation:execOpportunityGlow 1.05s ease-in-out infinite alternate;overflow:visible;backdrop-filter:blur(1px)}
.exp-interact.is-exec::before{content:'F';position:absolute;inset:13px;display:grid;place-items:center;border-radius:50%;font-family:var(--f-serif);font-size:16px;font-weight:500;color:#FFE0C7;background:rgba(19,8,9,.88);border:1px solid rgba(255,205,169,.55);box-shadow:0 0 10px rgba(220,82,50,.30);text-shadow:0 1px 3px #000}
.exp-interact.is-exec::after{content:'처형';position:absolute;left:50%;top:80px;transform:translateX(-50%);font-family:var(--f-serif);font-size:11px;font-weight:500;letter-spacing:.22em;color:#F4DDCC;text-shadow:0 2px 5px #000;white-space:nowrap}
@keyframes execOpportunityGlow{from{box-shadow:0 0 0 1px rgba(0,0,0,.76),0 0 15px rgba(220,82,50,.28),inset 0 0 16px rgba(230,100,55,.12)}to{box-shadow:0 0 0 1px rgba(0,0,0,.76),0 0 29px rgba(240,96,54,.56),inset 0 0 22px rgba(230,100,55,.20)}}
html.mobile .exp-interact.is-exec{width:66px;height:66px;min-width:66px;min-height:66px;padding:0;bottom:auto;font-size:0}
html.mobile .exp-interact.is-exec::before{content:'✦';inset:12px;font-size:18px}
html.mobile .exp-interact.is-exec::after{top:73px;font-size:10px}
/* L2/L3 카메라 중에는 기회 표식도 화면에서 빠진다. */
.cinema-hud-v1.cinema-l2 .exp-interact.is-exec,.cinema-hud-v1.cinema-l3 .exp-interact.is-exec{opacity:0!important;pointer-events:none!important}
/* 폰 브라우저 안(세로 272 px 안팎, docs/design/84): 스킬 3·4 가 지도·조준 패널 위에, 락온이 공격 버튼 밑에, 의뢰 목록이 스틱 위에,
   체력·기력 묶음이 캐릭터 몸 위에 겹쳤다. 갓 오브 워처럼 캐릭터 둘레는 비우고 정보는 모서리로. */
@media (max-height:360px){

 html.mobile .vital{margin-bottom:2px;gap:4px}html.mobile .vital .bar{height:4px}html.mobile .vital__ic{width:9px;height:9px}
 html.mobile .vital__v{font-size:8px}html.mobile .xpg{display:none}html.mobile .ultg{margin-top:1px;gap:4px}html.mobile .ultg .bar{height:3px}html.mobile .ultg span:first-child{font-size:8px}html.mobile .ultg__v{font-size:8px;width:24px}
 html.mobile .bthud .stick{height:112px}html.mobile .actions{margin-left:auto}
 html.mobile .quest{top:6px;left:50%;transform:translateX(-50%);font-size:9.5px;min-width:0;padding:3px 7px}html.mobile.in-fight .quest{display:none}
 html.mobile .mini{display:none}html.mobile .exp-map{top:44px}html.mobile.in-fight .exp-map{display:none}
 html.mobile .target-cycle{top:44px;right:10px;min-width:0;min-height:0;max-width:150px;padding:3px 8px;font-size:10px}html.mobile .target-cycle small{display:none}

 html.mobile .combo{top:70px;right:40%}
}
/* ===== 88 — 깔끔한 전투 UI (디렉터: 「조작패드도 그렇고 ui도 깔끔하게 하고. 맵은 필요없어」) =====
   명조·몬헌 모바일처럼: 지도 없음, 체력·기력은 왼쪽 위 초상 밑 가는 줄, 스틱은 상자 없이 떠 있는 원,
   버튼은 글자 없이 아이콘만(쿨타임은 부채꼴로 줄어든다), 조준·락온은 작은 알약. 캐릭터 둘레와 화면 가운데는 비운다. */

/* ===== 103 — CINEMATIC COMBAT HUD v02 =====
   목표: 컨셉 시트의 정보 위계를 실제 전투 DOM에 이식하고, L0~L3 시네마틱 연출 단계와 HUD 가시성을 동기화한다.
   전투 판정·입력·버튼 DOM id는 바꾸지 않고, game3d.js가 쓰는 기존 노드를 재배치한다. */
.cinema-hud-v1 .dg::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:

  radial-gradient(ellipse 72% 70% at 50% 48%,rgba(0,0,0,0) 56%,rgba(0,0,0,.24) 100%)}

   L1은 입력을 유지하므로 조작 UI를 보존, L2/L3만 조작 UI를 감춘다. */
.cinema-hud-v1 .btparty,.cinema-hud-v1 .vitals,.cinema-hud-v1 .bosshp,
.cinema-hud-v1 .bttimer,.cinema-hud-v1 .combo,.cinema-hud-v1 .bthud,

/* L1: 받아치기/완벽회피. 입력은 그대로, 정보만 한 박자 뒤로 물린다. */
.cinema-hud-v1.cinema-l1 .quest,.cinema-hud-v1.cinema-l1 .toasts,

.cinema-hud-v1.cinema-l1 .btparty,.cinema-hud-v1.cinema-l1 .vitals{opacity:.72}
.cinema-hud-v1.cinema-l1 .bosshp{filter:drop-shadow(0 3px 14px rgba(0,0,0,.9)) brightness(.92)}
.cinema-hud-v1.cinema-l1 .bthud{opacity:.82}
/* L2: 처형/궁극기 전용 카메라. 조작을 뺏는 동안 컨트롤과 생활 정보는 완전히 비운다. */
.cinema-hud-v1.cinema-l2 .bthud,.cinema-hud-v1.cinema-l2 .combo,
.cinema-hud-v1.cinema-l2 .target-cycle,.cinema-hud-v1.cinema-l2 .lockon,

.cinema-hud-v1.cinema-l2 .quest,.cinema-hud-v1.cinema-l2 .toasts,
.cinema-hud-v1.cinema-l2 .combat-brand{opacity:0!important;pointer-events:none!important}
.cinema-hud-v1.cinema-l2 .btparty,.cinema-hud-v1.cinema-l2 .vitals{opacity:.18}
.cinema-hud-v1.cinema-l2 .bttimer{opacity:.20}
.cinema-hud-v1.cinema-l2 .bosshp{opacity:.52;transform:translateY(-3px)}
.cinema-hud-v1.cinema-l2 .counter{opacity:0!important}
/* L3: 등장/페이즈/격파. 이름과 PHASE만 남겨 장면의 제목처럼 쓴다. */
.cinema-hud-v1.cinema-l3 .btparty,.cinema-hud-v1.cinema-l3 .vitals,
.cinema-hud-v1.cinema-l3 .bttimer,.cinema-hud-v1.cinema-l3 .combo,
.cinema-hud-v1.cinema-l3 .bthud,.cinema-hud-v1.cinema-l3 .target-cycle,

.cinema-hud-v1.cinema-l3 .guide,.cinema-hud-v1.cinema-l3 .counter,
.cinema-hud-v1.cinema-l3 .quest,.cinema-hud-v1.cinema-l3 .toasts,

/* ===== 105 — CINEMATIC L2/L3 PRESENTATION v04 =====
   L2/L3에서 HUD를 단순히 숨기기만 하지 않고, 짧은 영화 프레임과 장면 제목을 제공한다.
   입력/판정과 무관한 DOM 연출이며, 모바일에서는 화면 높이를 과도하게 먹지 않도록 얇게 유지한다. */
.cine-matte{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .18s ease}
.cine-matte::before,.cine-matte::after{content:"";position:absolute;left:0;right:0;height:0;background:#020305;transition:height .24s cubic-bezier(.2,.75,.2,1);box-shadow:0 0 26px rgba(0,0,0,.5)}
.cine-matte::before{top:0}.cine-matte::after{bottom:0}
.cinema-hud-v1.cinema-l2 .cine-matte,.cinema-hud-v1.cinema-l3 .cine-matte{opacity:1}
.cinema-hud-v1.cinema-l2 .cine-matte::before,.cinema-hud-v1.cinema-l2 .cine-matte::after{height:min(3.2vh,24px)}
.cinema-hud-v1.cinema-l3 .cine-matte::before,.cinema-hud-v1.cinema-l3 .cine-matte::after{height:min(5vh,38px)}
.cine-caption{position:absolute;left:50%;top:23%;z-index:12;transform:translate(-50%,10px);min-width:min(520px,66vw);text-align:center;pointer-events:none;opacity:0;filter:blur(2px);transition:opacity .20s ease,transform .26s ease,filter .24s ease;color:#F1E9DE;text-shadow:0 3px 14px #000}
.cine-caption__k{font-family:var(--f-serif);font-size:9px;letter-spacing:.45em;color:#D7B778;text-transform:uppercase}
.cine-caption__t{font-family:var(--f-serif);font-size:28px;letter-spacing:.16em;font-weight:400;margin-top:5px}
.cine-caption__s{font-family:var(--f-serif);font-size:9px;letter-spacing:.34em;color:rgba(232,221,207,.64);margin-top:5px}
.cinema-hud-v1.cinema-l3 .cine-caption,.cinema-hud-v1.cinema-l2[data-cinema-id="poiseBreak"] .cine-caption{opacity:1;transform:translate(-50%,0);filter:none}
.cinema-hud-v1.cinema-l2[data-cinema-id="poiseBreak"] .cine-caption{top:18%}
.cinema-hud-v1.cinema-l2[data-cinema-id="poiseBreak"] .cine-caption__k{color:#E66B5C}
.cinema-hud-v1.cinema-l2[data-cinema-id="poiseBreak"] .cine-caption__t{font-size:22px}
/* 실행/궁극기는 텍스트를 띄우지 않고 화면 자체에 집중. */
.cinema-hud-v1.cinema-l2[data-cinema-id="execute"] .bosshp,.cinema-hud-v1.cinema-l2[data-cinema-id="ult"] .bosshp{opacity:.12}
.cinema-hud-v1.cinema-l2[data-cinema-id="execute"] .btparty,.cinema-hud-v1.cinema-l2[data-cinema-id="execute"] .vitals,.cinema-hud-v1.cinema-l2[data-cinema-id="ult"] .btparty,.cinema-hud-v1.cinema-l2[data-cinema-id="ult"] .vitals{opacity:0}
/* 자세 붕괴는 다음 행동 결정을 위해 보스 정보만 남긴다. */
.cinema-hud-v1.cinema-l2[data-cinema-id="poiseBreak"] .bosshp{opacity:.68}
.cinema-hud-v1.cinema-l2[data-cinema-id="poiseBreak"] .bosshp__bar{opacity:.40}
/* L3 종류별 장면 제목. phase에서는 보스 HP 막대를 없애고 phase 문자열만 남긴다. */
.cinema-hud-v1.cinema-l3[data-cinema-id="victory"] .bosshp{opacity:0}
.cinema-hud-v1.cinema-l3[data-cinema-id="bossIntro"] .bosshp,.cinema-hud-v1.cinema-l3[data-cinema-id="phase"] .bosshp{opacity:.72}
/* minimal은 매트/캡션도 억제해 조작 중심으로. */
.cinema-hud-v1[data-cinema-hud="minimal"] .cine-matte,.cinema-hud-v1[data-cinema-hud="minimal"] .cine-caption{display:none!important}
@media(max-width:900px),(max-height:520px){
 .cine-caption{top:17%;min-width:58vw}.cine-caption__t{font-size:19px}.cine-caption__k,.cine-caption__s{font-size:7px}

.cinema-hud-v1 .dmgnum.crit{font-size:21px;color:#E9C77B;text-shadow:0 0 10px rgba(226,177,80,.34),0 2px 6px #000}
.cinema-hud-v1 .dmgnum.counter{font-size:24px;color:#F08A73;text-shadow:0 0 12px rgba(230,81,65,.34),0 2px 6px #000}

@keyframes riseV5{0%{transform:translate(-50%,8px) scale(.92);opacity:0}16%{opacity:1;transform:translate(-50%,0) scale(1)}72%{opacity:.92}100%{transform:translate(-50%,-42px) scale(.98);opacity:0}}

/* 카운터 결과는 중앙을 가리지 않는 짧은 타이포그래피로. */
.cinema-hud-v1 .counter{top:27%;min-width:220px;padding:7px 22px 8px;background:linear-gradient(90deg,rgba(4,5,7,0),rgba(4,5,7,.58) 22%,rgba(4,5,7,.58) 78%,rgba(4,5,7,0));filter:drop-shadow(0 3px 12px rgba(0,0,0,.55));transition:opacity .12s ease,transform .18s ease}

.cinema-hud-v1 .counter__lb{font-size:9px;letter-spacing:.46em;color:#EA7468;text-transform:uppercase}
.cinema-hud-v1 .counter__v{font-size:32px;line-height:1.08;letter-spacing:.035em;color:#F5EEE5;text-shadow:0 0 10px rgba(219,56,50,.20),0 2px 6px #000}
.cinema-hud-v1 .counter__sub{font-family:var(--f-serif);font-size:9px;letter-spacing:.18em;color:#D9BE82;margin-top:1px}
.cinema-hud-v1 .counter.perfect .counter__lb{color:#F1D491}.cinema-hud-v1 .counter.perfect .counter__v{text-shadow:0 0 12px rgba(232,205,141,.22),0 2px 6px #000}
@keyframes counterV5{0%{transform:translateX(-50%) translateY(8px) scale(.97);filter:blur(2px);opacity:0}18%{transform:translateX(-50%) translateY(0) scale(1);filter:none;opacity:1}78%{opacity:1}100%{opacity:.12}}

/* 콤보는 숫자만 남기고 전투 장면보다 앞서지 않게. */
.cinema-hud-v1 .combo{right:max(28px,env(safe-area-inset-right));top:41%;filter:drop-shadow(0 2px 7px #000)}
.cinema-hud-v1 .combo b{font-size:29px;font-weight:400;color:rgba(244,238,229,.88);text-shadow:0 2px 5px #000}
.cinema-hud-v1 .combo span{font-size:7px;letter-spacing:.38em;color:rgba(217,190,130,.64)}
.cinema-hud-v1 .combo.big b{font-size:38px;color:#F08B78;text-shadow:0 0 10px rgba(224,76,62,.22),0 2px 6px #000}

/* 상태 이상은 카드가 아니라 얇은 정보선. */
.cinema-hud-v1 .status{width:138px;gap:3px}
.cinema-hud-v1 .stline{border:0;border-left:1px solid rgba(220,193,137,.42);background:linear-gradient(90deg,rgba(5,6,8,.58),rgba(5,6,8,.12));padding:3px 7px 3px 8px;font-size:9px;letter-spacing:.04em;color:rgba(225,219,209,.70);backdrop-filter:blur(2px)}

/* ===== 108 — CINEMATIC TARGET / LOCK UX v07 =====
   3D lockRing이 실제 조준 위치를 말하고, DOM은 선택 부위와 락온 상태만 작게 보조한다.
   우측의 큰 텍스트 알약은 제거한다. */
.cinema-hud-v1 .target-cycle{
  left:50%;right:auto;top:max(62px,calc(env(safe-area-inset-top) + 62px));transform:translateX(-50%);
  min-width:0;max-width:38vw;min-height:0;padding:4px 12px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-top:1px solid rgba(231,211,174,.28);border-radius:0;background:linear-gradient(90deg,rgba(5,7,10,0),rgba(5,7,10,.54) 20%,rgba(5,7,10,.54) 80%,rgba(5,7,10,0));
  color:#E9DED0;font-family:var(--f-serif);font-size:10px;letter-spacing:.10em;text-align:center;backdrop-filter:none;
  opacity:.88;transition:opacity .15s ease,filter .15s ease;
}
.cinema-hud-v1 .target-cycle::before{content:'◎';font-family:system-ui,sans-serif;font-size:11px;color:#D9C18A;opacity:.82}
.cinema-hud-v1 .target-cycle[data-lock="off"]{opacity:.46;filter:saturate(.6)}
.cinema-hud-v1 .target-cycle #target-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cinema-hud-v1 .target-cycle small{display:inline;margin:0;font-family:var(--f-serif);font-size:8px;letter-spacing:.06em;color:rgba(219,207,187,.62);white-space:nowrap}
.cinema-hud-v1 .lockon{
  top:max(62px,calc(env(safe-area-inset-top) + 62px));right:max(18px,env(safe-area-inset-right));left:auto;
  width:34px;height:34px;min-width:34px;padding:0;border-radius:50%;border:1px solid rgba(222,207,179,.30);
  background:rgba(6,8,11,.38);color:transparent;font-size:0;display:grid;place-items:center;backdrop-filter:blur(2px);
  opacity:.88;transition:opacity .15s ease,border-color .15s ease,transform .12s ease;
}
.cinema-hud-v1 .lockon::before{content:'◎';font-family:system-ui,sans-serif;font-size:17px;line-height:1;color:#E5D4AF;text-shadow:0 1px 4px #000}
.cinema-hud-v1 .lockon::after{content:'T';position:absolute;right:-2px;bottom:-7px;font-family:var(--f-serif);font-size:7px;color:rgba(225,215,198,.50);text-shadow:0 1px 3px #000}
.cinema-hud-v1 .lockon.is-off{opacity:.42;border-color:rgba(150,154,160,.22)}
.cinema-hud-v1 .lockon.is-off::before{content:'○';color:#A5A9AE}
.cinema-hud-v1 .lockon:active{transform:scale(.93)}
.cinema-hud-v1.cinema-l1 .target-cycle,.cinema-hud-v1.cinema-l1 .lockon,
.cinema-hud-v1.cinema-l2 .target-cycle,.cinema-hud-v1.cinema-l2 .lockon,
.cinema-hud-v1.cinema-l3 .target-cycle,.cinema-hud-v1.cinema-l3 .lockon{opacity:0!important;pointer-events:none!important}
@media(max-width:900px),(max-height:520px){
  html.mobile .cinema-hud-v1 .target-cycle{top:max(48px,calc(env(safe-area-inset-top) + 48px));max-width:42vw;padding:3px 8px;gap:6px;font-size:8.5px}
  html.mobile .cinema-hud-v1 .target-cycle small{font-size:7px}
  html.mobile .cinema-hud-v1 .lockon{top:max(48px,calc(env(safe-area-inset-top) + 48px));right:max(8px,env(safe-area-inset-right));width:30px;height:30px;min-width:30px}
  html.mobile .cinema-hud-v1 .lockon::before{font-size:15px}
  html.mobile .cinema-hud-v1 .lockon::after{display:none}
}
@media(max-height:360px){
  html.mobile .cinema-hud-v1 .target-cycle{top:max(40px,calc(env(safe-area-inset-top) + 40px));max-width:36vw}
  html.mobile .cinema-hud-v1 .lockon{top:max(40px,calc(env(safe-area-inset-top) + 40px))}
}

<script>
/* 104·105 — HUD ↔ Cinematic Director bridge.
   연출 감독은 판정 확정 뒤 단계/id/duration만 공개하고 HUD는 정보량·캡션만 다룬다. */
(function(){
  var root=document.body, timer=0, tiers=['cinema-l1','cinema-l2','cinema-l3'];
  var cap={box:document.getElementById('cine-caption'),k:document.getElementById('cine-cap-k'),t:document.getElementById('cine-cap-t'),s:document.getElementById('cine-cap-s')};
  var fallback={
    poiseBreak:{k:'BREAK',t:'자세 붕괴',s:'OPENING'},
    bossIntro:{k:'BOSS',t:'',s:'ENGAGED'},
    phase:{k:'PHASE',t:'',s:'ESCALATION'},
    victory:{k:'격파',t:'',s:'TARGET ELIMINATED'}
  };
  function bossName(){var n=document.getElementById('b-name');return n&&n.textContent&&n.textContent!=='—'?n.textContent.trim():'';}
  function clear(){ tiers.forEach(function(c){root.classList.remove(c);}); if(timer){clearTimeout(timer);timer=0;} root.removeAttribute('data-cinema-id'); if(cap.k)cap.k.textContent='';if(cap.t)cap.t.textContent='';if(cap.s)cap.s.textContent=''; }
  function caption(detail){
    var id=String(detail.id||''), f=fallback[id]||{};
    var title=detail.title!=null?String(detail.title):String(f.t||'');
    var kicker=detail.kicker!=null?String(detail.kicker):String(f.k||'');
    var sub=detail.subtitle!=null?String(detail.subtitle):String(f.s||'');
    if((id==='bossIntro'||id==='victory')&&!title) title=bossName();
    if(id==='phase'){ var ph=detail.phase!=null?String(detail.phase):''; kicker=detail.kicker||('PHASE'+(ph?' '+ph:'')); if(!title)title=bossName(); }
    if(cap.k)cap.k.textContent=kicker;if(cap.t)cap.t.textContent=title;if(cap.s)cap.s.textContent=sub;
  }
  function set(detail){
    detail=detail||{}; var tier=String(detail.tier||'').toUpperCase(); clear();
    if(tier==='L1'||tier==='L2'||tier==='L3') root.classList.add('cinema-'+tier.toLowerCase());
    if(detail.id) root.setAttribute('data-cinema-id',String(detail.id));
    caption(detail);
    var dur=Number(detail.duration||detail.dur||0); if(dur>0) timer=setTimeout(clear,Math.max(80,dur));
  }
  function mode(m){root.setAttribute('data-cinema-hud',m==='minimal'?'minimal':'default');}
  window.addEventListener('tw:cinematic',function(e){set(e.detail);});
  window.addEventListener('tw:cinematic:end',clear);
  try{var st=JSON.parse(localStorage.getItem('tw:settings')||'{}');mode(st.cine||'normal');}catch(e){mode('normal');}
  window.TW_CINEMATIC_HUD={set:set,clear:clear,get tier(){return root.classList.contains('cinema-l3')?'L3':root.classList.contains('cinema-l2')?'L2':root.classList.contains('cinema-l1')?'L1':'L0';},setMode:mode};
})();
</script>

<script>
/* 105 — 피해 숫자 클러터 가드. 전투 수치는 건드리지 않고 DOM 표기 수만 제한한다. */
(function(){
  var root=document.getElementById('dg'); if(!root||!window.MutationObserver) return;
  function trim(){
    var mobile=document.documentElement.classList.contains('mobile')||innerHeight<520;
    var cap=mobile?6:9, nodes=[].slice.call(root.querySelectorAll('.dmgnum'));
    if(nodes.length<=cap) return;
    var keep=function(n){ return n.classList.contains('crit')||n.classList.contains('counter')||n.classList.contains('taken')||n.classList.contains('deflect'); };
    var removable=nodes.filter(function(n){return !keep(n);});
    while(nodes.length>cap&&removable.length){ var n=removable.shift(); if(n&&n.parentNode){n.remove();nodes.splice(nodes.indexOf(n),1);} }
    while(nodes.length>cap){ var n=nodes.shift(); if(n&&n.parentNode)n.remove(); }
  }
  new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++) if(ms[i].addedNodes&&ms[i].addedNodes.length){trim();break;} }).observe(root,{childList:true});
})();
</script>
