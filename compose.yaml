services:
  game:
    build: .
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /app/data
      MAX_PLAYERS: "100"
      MAX_ROOMS: "32"
    volumes:
      - party-data:/app/data
    restart: unless-stopped
    stop_grace_period: 10s
volumes:
  party-data:
