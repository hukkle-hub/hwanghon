<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>황혼 · 아인 시네마틱 모션 v01</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0c0f;color:#eef;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:24px;top:20px;padding:15px 17px;background:#0a0d12cc;border:1px solid #38414b;border-radius:10px;min-width:300px;backdrop-filter:blur(8px)}
#hud h1{font-size:18px;margin:0 0 6px}#name{font-size:26px;font-weight:800;letter-spacing:-.04em}#desc{color:#aab2bd;font-size:13px;max-width:360px;line-height:1.45;margin-top:4px}
#phase{height:4px;background:#20262d;margin-top:12px;border-radius:4px;overflow:hidden}#phase i{display:block;height:100%;background:#d34a4f;width:0}
#legend{position:absolute;right:22px;bottom:20px;background:#0a0d12bb;border:1px solid #303842;border-radius:9px;padding:10px 13px;font-size:12px;color:#b8c0ca;line-height:1.55;text-align:right}
.badge{display:inline-block;border:1px solid #586471;padding:2px 6px;border-radius:4px;color:#d8dde3;font-size:11px;margin-right:5px}
</style></head><body><canvas id="c"></canvas><div id="hud"><h1>AIN · CINEMATIC MOTION v01</h1><div id="name">LOADING</div><div id="desc"></div><div id="phase"><i></i></div></div><div id="legend"><span class="badge">실제 ain_anim.glb</span><span class="badge">실제 낫</span><br>판정 시간/이동 거리 불변 · 자세·관성 레이어만 추가</div>
<script type="module">
import * as T from './vendor/three/three.module.js';
import {GLTFLoader} from './vendor/three/GLTFLoader.js';
import {repairAinBind,repairAinClips} from './js/ain-bind-repair.js';
import {mountAinScythe} from './js/ain-scythe-mount.js';
import {makeAinRigAdapter} from './js/ain-two-hand.js';
import {createCharacterCinema,transitionFor} from './js/character-cinema.js';

const canvas=document.querySelector('#c'),renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(0x0a0c0f);scene.fog=new T.Fog(0x0a0c0f,7,14);
const camera=new T.PerspectiveCamera(34,1,.05,30);camera.position.set(3.0,1.65,5.0);camera.lookAt(0,1.05,0);
scene.add(new T.HemisphereLight(0xc7d8f0,0x201916,1.8));const key=new T.DirectionalLight(0xffffff,3.4);key.position.set(3,5,4);key.castShadow=true;scene.add(key);const rim=new T.DirectionalLight(0x8aa8ff,2.1);rim.position.set(-4,3,-3);scene.add(rim);
const ground=new T.Mesh(new T.CircleGeometry(4.7,80),new T.MeshStandardMaterial({color:0x12161b,roughness:.92,metalness:.05}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const ring=new T.Mesh(new T.RingGeometry(1.6,1.62,96),new T.MeshBasicMaterial({color:0x35404a,transparent:true,opacity:.65,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.004;scene.add(ring);

const STATES=[
 ['combat_idle','idle','전투 대기 · 낮은 중심, 비대칭 호흡, 시선이 먼저 움직인다'],
 ['idle_variation','idle2','대기 변화 · 완전 정지를 피하고 쇄골/목의 작은 긴장을 유지'],
 ['walk_forward','walk','전진 보행 · 골반보다 흉곽이 늦게 따라오는 조용한 접근'],
 ['run_forward','run','달리기 · 상체를 낮추되 머리는 안정시켜 목표를 놓치지 않는다'],
 ['strafe_left','run','좌측 흘림 · 몸은 목표를 보며 중심만 옆으로 미끄러진다'],
 ['strafe_right','run','우측 흘림 · 반대 실루엣, 같은 균형'],
 ['backstep','dodgeB','백스텝 · 구르기보다 낮게 접고 거리를 떼는 무협식 회피'],
 ['evade_left','dodgeL','좌 회피 · 골반이 먼저 빠지고 흉곽이 한 박자 늦게 풀린다'],
 ['evade_right','dodgeR','우 회피 · 칼날 선에서 몸만 비켜나는 짧은 스텝'],
 ['turn_90','idle','90° 전환 · 발/골반 → 흉곽 → 머리 순서의 관성'],
 ['hit_light','hit','약 피격 · 중심→가슴→머리 순으로 충격 전달'],
 ['hit_heavy','hit2','강 피격 · 크게 밀리되 회복 자세가 다음 행동으로 이어진다'],
 ['moon_cut_1','attack1','기본 1타 · 준비선이 읽히고 접점에서 짧게 폭발한 뒤 흐른다'],
 ['reverse_cut_2','attack2','기본 2타 · 역방향 호로 연결해 같은 방향 반복을 없앤다'],
 ['pierce_3','attack3','기본 3타 · 직선 관통 후 바로 다음 판단이 가능한 짧은 회수'],
 ['counter','counter','카운터 · 받아내기→맞댐→밀어내기가 한 호흡으로 연결'],
 ['blood_spin','skill3','피의 회전 · 큰 원호지만 중심이 떠오르지 않는 회전'],
 ['twilight','ult','낫의 황혼 · 긴 준비, 폭발적 접점, 긴 여운의 피니시']
];
let model,mixer,clips={},slot,weapon,rig,cinema,current=null,currentAction=null,currentIndex=0;
const loader=new GLTFLoader();
const load=url=>new Promise((res,rej)=>loader.load(url,res,undefined,rej));
const [cg,wg]=await Promise.all([load('./art/3d/ain_anim.glb'),load('./art/3d/ain_scythe_tex.glb')]);
model=cg.scene;model.scale.setScalar(1.14);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}if(o.isBone&&/RightHandSlot/.test(o.name))slot=o;});scene.add(model);
const repaired=repairAinClips(cg.animations,repairAinBind(model));repaired.forEach(c=>clips[c.name]=c);mixer=new T.AnimationMixer(model);
weapon=mountAinScythe(wg.scene);weapon.traverse(o=>{if(o.isMesh)o.castShadow=true;});slot.add(weapon);weapon.position.set(0,0,0);
rig=makeAinRigAdapter(model,model,slot);cinema=createCharacterCinema(model,model,'ain');

function fit(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',fit);fit();
function select(i,fade=true){
 currentIndex=(i+STATES.length)%STATES.length;const [label,clip]=STATES[currentIndex];current={label,clip};
 const a=mixer.clipAction(clips[clip]||clips.idle);if(!fade)mixer.stopAllAction();a.reset().enabled=true;a.setEffectiveWeight(1);a.setLoop(T.LoopRepeat,Infinity);const tr=transitionFor('ain',clip);
 if(currentAction&&currentAction!==a&&fade)a.crossFadeFrom(currentAction,tr.base,true);a.play();currentAction=a;
 document.querySelector('#name').textContent=label.toUpperCase().replaceAll('_',' ');document.querySelector('#desc').textContent=STATES[currentIndex][2];
}
function stateParams(label,phase){
 const clip=current.clip, moving=['walk','run'].includes(clip), speed=moving?1:0;let localX=0,localZ=moving?1:0;
 if(label==='strafe_left'){localX=-1;localZ=0}if(label==='strafe_right'){localX=1;localZ=0}
 const isAttack=/attack|skill|ult|counter|exec|smash/.test(clip),a=isAttack?{id:1,clip,kind:'attack',duration:clips[clip].duration,elapsed:clips[clip].duration*phase}:null;
 return {clip,moving,speed,localX,localZ,guard:false,action:a};
}
function renderState(i,phase=0.5){
 select(i,false);const [label,clip]=STATES[currentIndex],c=clips[clip]||clips.idle,t=c.duration*phase;
 cinema.restore();rig.restore();mixer.setTime(t);
 if(label==='turn_90')model.rotation.y=(phase-.5)*Math.PI/2;else model.rotation.y=0;
 const q=stateParams(label,phase);rig.apply(q.action,q.moving,false,1/60,clip,null);cinema.apply({...q,dt:1/60,clipTime:phase});renderer.render(scene,camera);
 document.querySelector('#phase i').style.width=(phase*100).toFixed(1)+'%';
 return {label,clip,phase,diag:cinema.diagnostics};
}
function renderTimeline(sec){
 const per=1.55,i=Math.floor(sec/per)%STATES.length,u=(sec%per)/per;
 // 짧은 양끝 hold를 둬 실루엣을 읽게 하고 가운데에서 동작한다.
 const phase=u<.12?0:u>.90?1:smooth((u-.12)/.78);return renderState(i,phase);
}
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
window.REVIEW={STATES,renderState,renderTimeline,select,get ready(){return !!model}};
select(0,false);renderState(0,.35);document.documentElement.dataset.ready='1';
</script></body></html>
