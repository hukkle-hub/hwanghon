# GitHub Pages 배포: main 에 푸시될 때마다 저장소 루트를 그대로 게시한다.
# configure-pages 의 enablement 로 Pages 를 자동 활성화하므로 설정 화면을 만질 필요가 없다.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 관문: 테스트가 하나라도 실패하면 배포하지 않는다 (docs/design/89). 서버 테스트가 Node 22 기능을 쓴다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 빌드 스탬프: sw.js / ui.js 의 __BUILD__ 를 커밋 해시로 치환 → 배포마다 새 SW 버전이 자동 설치된다
      - name: Stamp build id
        run: |
          B="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$B/g" sw.js js/ui.js
          printf '{"build":"%s","at":"%s"}\n' "$B" "$(date -u +%FT%TZ)" > version.json
          grep -q "$B" sw.js && grep -q "$B" js/ui.js && cat version.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
