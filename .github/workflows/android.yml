name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - run: npm ci
      - run: bash tools/build-www.sh
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hwanghon-${GITHUB_SHA::7}.apk && cp hwanghon-${GITHUB_SHA::7}.apk hwanghon.apk
      - uses: actions/upload-artifact@v4
        with: { name: hwanghon-apk, path: hwanghon-*.apk }
      - name: Publish release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 황혼 APK (최신)
          body: "빌드 ${{ github.sha }} · 설치 후 같은 서명이라 덮어쓰기 업데이트가 됩니다."
          prerelease: true
          files: |
            hwanghon.apk
            hwanghon-*.apk
