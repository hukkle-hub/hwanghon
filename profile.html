<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="art/face-ain.webp">
<title>황혼 — 플레이어 프로필 / 기술 등급</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/mobile.css">
<style>
.pf{display:grid;grid-template-columns:54px 440px 1fr;gap:14px;padding:12px 20px;flex:1;min-height:0}
.rail{display:flex;flex-direction:column;gap:10px}
.railbtn{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--tx-faint);background:rgba(0,0,0,.28);cursor:pointer;transition:.15s}
.railbtn:hover{color:var(--tx);border-color:var(--line-hard)}
.railbtn.is-on{color:#D9A9A7;border-color:var(--line-red);background:rgba(165,28,28,.16)}

/* 좌측 아트 */
.pf__art{display:flex;flex-direction:column;gap:11px;min-height:0}
.pfart{flex:1;min-height:0;position:relative;border:1px solid var(--line-soft)}
.seasonbar{display:grid;grid-template-columns:auto auto auto 1fr;gap:18px;align-items:center;
  padding:10px 13px;border:1px solid var(--line);background:rgba(0,0,0,.3)}
.sb__rank{display:flex;align-items:center;gap:10px}
.sb__rank .ico{color:var(--gold-dim)}
.sb__num{font-family:var(--f-serif);font-size:24px;color:var(--tx-hi);line-height:1}
.sb__k{font-size:10.5px;color:var(--tx-faint);white-space:nowrap}
.sb__v{font-size:12px;color:var(--tx-dim);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 우측 */
.pf__r{display:grid;grid-template-rows:auto auto 1fr auto;gap:11px;min-height:0}
.idrow{display:grid;grid-template-columns:1fr 296px;gap:11px}
.idcard{display:flex;align-items:center;gap:14px;padding:13px 15px}
.idcard__face{width:62px;height:62px;border:1px solid var(--line);flex:none}
.idcard__tt{font-size:11.5px;color:var(--tx-faint);letter-spacing:.04em}
.idcard__nm{font-family:var(--f-serif);font-size:22px;color:var(--tx-hi);letter-spacing:.03em;margin-top:2px}
.lvline{display:flex;align-items:center;gap:10px;margin-top:8px}
.lvline b{font-size:13px;color:var(--tx);font-weight:500}
.cpbox{display:flex;align-items:center;gap:12px;padding:13px 15px}
.cpbox .ico{width:30px;height:30px;color:var(--gold-dim)}
.cpbox__v{font-family:var(--f-serif);font-size:24px;color:var(--red-lit);letter-spacing:.02em}

/* 숙련도 */
.midrow{display:grid;grid-template-columns:1fr 380px;gap:11px;min-height:0}
.gauges{display:grid;grid-template-columns:repeat(5,1fr);place-items:center;padding:6px 0}
/* 시트는 링마다 칸이 나뉘어 있고, 숙련도 %는 가는 선 아래에 놓인다 */
.gauges>.gwrap+.gwrap{border-left:1px solid var(--line-soft)}
.gauges>.gwrap{width:100%;padding:0 5px}
.gwrap__p{padding-top:6px;border-top:1px solid var(--line-soft);width:100%;text-align:center}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:7px}
.gwrap__t{font-size:12px;color:var(--tx-dim);letter-spacing:.04em}
.gwrap__p{font-size:11px;color:var(--tx-faint)}
.brow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.brow:last-child{border:0}
.brow__th{width:34px;height:34px;border:1px solid var(--line);flex:none}
.brow__n{font-size:12px;color:var(--tx);flex:1}
.brow__t{font-size:11.5px;color:var(--tx-dim);font-variant-numeric:tabular-nums}
.brow__g{width:22px;text-align:center;font-family:var(--f-serif);font-size:14px;font-weight:700}

/* 하단 */
.botrow{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:11px;min-height:0}
.rolebox{display:flex;gap:11px;padding:7px 0;align-items:flex-start}
.rolebox__ic{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);
  background:rgba(0,0,0,.3);color:#9AA0AC;flex:none}
.quote{font-size:11.5px;color:var(--tx-dim);line-height:1.9;font-style:italic}
.eqsum{display:flex;align-items:center;gap:10px}
.eqsum__main .itart{width:34px;height:34px}
.eqsum__main{width:44px;height:44px;border:1px solid rgba(201,138,43,.5);flex:none;display:grid;place-items:center;color:#C89A4A}
.actrow{display:flex;justify-content:flex-end;gap:10px}
.actrow .btn{width:196px;height:38px}
</style>
</head>
<body>
<script src="js/icons.js"></script>

<div class="stage">
  <header class="topbar">
    <svg class="topbar__sigil"><use href="#i-sigil"/></svg>
    <div>
      <h1 class="topbar__title">플레이어 프로필 / 기술 등급</h1>
      <div class="topbar__sub">타 플레이어의 전투 이력과 기술 숙련도를 확인하고, 파티 초대를 진행할 수 있습니다.</div>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__right">
      <span class="currency"><svg class="ico"><use href="#i-coin"/></svg><span class="num">75,300</span></span>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-mail"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-book"/></svg></button>
      <button class="iconbtn"><svg class="ico ico--lg"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <main class="pf" data-mdefault="정보">
    <!-- 아이콘 레일 -->
    <div class="rail" data-pick data-mpane="캐릭터">
      <button class="railbtn is-on" data-pickitem><svg class="ico ico--lg"><use href="#i-skull"/></svg></button>
      <button class="railbtn" data-pickitem><svg class="ico ico--lg"><use href="#i-user"/></svg></button>
      <button class="railbtn" data-pickitem><svg class="ico ico--lg"><use href="#i-hammer"/></svg></button>
      <button class="railbtn" data-pickitem><svg class="ico ico--lg"><use href="#i-medal"/></svg></button>
    </div>

    <!-- 캐릭터 아트 + 시즌 -->
    <div class="pf__art" data-mpane="캐릭터">
      <div class="pfart art art--top">
        <img src="art/char-profile.webp" alt="아인">
      </div>
      <div class="seasonbar" id="season"></div>
    </div>

    <!-- 우측 정보 -->
    <div class="pf__r" data-mpane="정보">
      <!-- 신원 -->
      <div class="idrow">
        <section class="panel panel--framed">
          <div class="idcard">
            <div class="idcard__face art art--avatar" data-portrait="me"><img src="art/face-ain.webp" alt="ain"></div>
            <div class="fill" id="idcard"></div>
          </div>
        </section>

        <div class="flex col g2">
          <section class="panel panel--framed fill">
            <div class="cpbox">
              <svg class="ico"><use href="#i-sigil"/></svg>
              <div class="fill">
                <div class="xs t-faint">종합 전투력</div>
                <div class="cpbox__v num mt1" id="pf-cp">76,420</div>
              </div>
            </div>
          </section>
          <section class="panel panel--framed">
            <div class="panel__body panel__body--tight">
              <div class="flex ac jb">
                <span class="xs t-faint">길드</span>
                <span class="sm t-hi" id="pf-guild">황혼의 인력사무소</span>
              </div>
              <div class="flex ac jb mt2">
                <span class="xs t-faint">직책</span>
                <span class="xs t-dim" id="pf-pos">정예 요원</span>
              </div>
            </div>
          </section>
        </div>
      </div>

      <!-- 숙련도 / 보스 기록 -->
      <div class="midrow">
        <section class="panel panel--framed">
          <div class="panel__head">
            <span class="panel__title">전투 숙련도</span>
            <span class="panel__meta">시즌 01 기준</span>
          </div>
          <div class="panel__body">
            <div class="gauges" id="gauges"></div>
          </div>
        </section>

        <section class="panel panel--framed">
          <div class="panel__head">
            <span class="panel__title">최근 보스 기록</span>
            <span class="panel__meta">시즌 01</span>
          </div>
          <div class="panel__body panel__body--tight scroll" id="recent"></div>
        </section>
      </div>

      <!-- 이력 / 역할 / 소개 -->
      <div class="botrow">
        <section class="panel panel--framed">
          <div class="panel__head">
            <span class="panel__title">클리어 이력</span>
            <span class="panel__meta">시즌 01</span>
          </div>
          <div class="panel__body panel__body--tight scroll" id="history"></div>
        </section>

        <section class="panel panel--framed">
          <div class="panel__head"><span class="panel__title">선호 역할</span></div>
          <div class="panel__body panel__body--tight scroll" id="roles"></div>
        </section>

        <div class="flex col g2" style="min-height:0">
          <section class="panel panel--framed fill">
            <div class="panel__head"><span class="panel__title">자기소개</span></div>
            <div class="panel__body panel__body--tight" id="intro"></div>
          </section>
          <section class="panel panel--framed">
            <div class="panel__head"><span class="panel__title">장비 요약</span></div>
            <div class="panel__body panel__body--tight" id="eqsum"></div>
          </section>
        </div>
      </div>

      <!-- 액션 -->
      <div class="actrow">
        <button class="btn">차단</button>
        <button class="btn">귓속말</button>
        <button class="btn btn--primary" data-primary>파티 신청</button>
      </div>
    </div>
  </main>
</div>
<script src="js/items.js"></script>
<script src="js/save.js"></script>
<script src="js/gear.js"></script>
<script src="js/world.js"></script>
<script src="js/grade.js"></script>
<script>
/* 플레이어 프로필 — world.js PROFILE 에서 렌더 (게이지는 ui.js 부팅 시 그려지므로 그 전에 마크업 생성) */
(function(){
  var W=window.TW_WORLD, T=window.TW_ITEMS, P=W.PROFILE, $=function(s){return document.querySelector(s);};
  var GR=window.TW_GRADE, AG=GR?GR.agent():null, TG=GR?GR.tech():null;
  $('#idcard').innerHTML='<div class="idcard__tt">'+P.title+'</div><div class="idcard__nm">'+P.handle+'<span class="t-faint" style="font-size:15px">'+P.tag+'</span></div>'+
    '<div class="lvline"><b>'+(AG?'요원 등급 <span class="'+GR.cls(AG.g)+'">'+AG.g+'</span>':'Lv. '+P.lv)+'</b><div class="bar bar--exp fill" data-fill="'+(AG?AG.pct:Math.round(P.exp[0]/P.exp[1]*100))+'"></div></div>'+
    '<div class="flex ac jb mt2"><span class="xs t-faint">경험 <span class="num">'+(AG?W.fmt(AG.xp)+' / '+(AG.next?W.fmt(AG.next):'MAX'):W.fmt(P.exp[0])+' / '+W.fmt(P.exp[1]))+'</span></span><span class="chip chip--red">카운터 등급 &nbsp;<b style="color:#E08A86">'+(TG?TG.counter.g:P.counterTier)+'</b></span></div>';
  $('#pf-cp').textContent=W.fmt(P.cp); $('#pf-guild').textContent=P.guild; $('#pf-pos').textContent=P.position;
  var MAST=TG?[ ['카운터 등급',TG.counter.g,TG.counter.pct,'#D94A45'], ['파괴 등급',TG.break.g,TG.break.pct,'#7B9BD6'], ['정제 등급',TG.refine.g,TG.refine.pct,'#5FAE9B'], ['드랍 등급',TG.drop.g,TG.drop.pct,'#C9A45E'], ['제작 등급',TG.craft.g,TG.craft.pct,'#B08CD6'] ]:P.mastery;
  $('#gauges').innerHTML=MAST.map(function(m){ return '<div class="gwrap"><span class="gwrap__t">'+m[0]+'</span><div class="gauge" data-gauge="'+m[2]+'" data-color="'+m[3]+'"><span class="gauge__ring"></span><span class="gauge__sig"></span><span class="gauge__mark" style="color:'+m[3]+'">'+m[1]+'</span></div><span class="gwrap__p">숙련도 '+m[2]+'%</span></div>'; }).join('');
  $('#recent').innerHTML=P.recent.map(function(r){ return '<div class="brow"><span class="brow__th art'+(/portrait/.test(r[3])?' art--top':'')+'"><img src="art/'+r[3]+'.webp" alt=""></span><span class="brow__n">'+r[0]+'</span><span class="brow__t">'+r[1]+'</span><span class="brow__g g-'+r[2].toLowerCase()+'">'+r[2]+'</span></div>'; }).join('');
  var h=P.history;
  $('#history').innerHTML='<div class="stat"><span class="stat__k">총 탐사 횟수</span><span class="stat__v num">'+h.total+'회</span></div><div class="stat"><span class="stat__k">완료한 탐사</span><span class="stat__v num">'+h.done+'회</span></div><div class="stat"><span class="stat__k">완료율</span><span class="stat__v num">'+h.rate+'</span></div><div class="hr"></div><div class="label-ko">난이도별 클리어</div>'+
    h.byRisk.map(function(r){ return '<div class="stat"><span class="stat__k flex ac g1">위험도 '+W.riskBadge(r[0])+'</span><span class="stat__v num">'+r[1]+'회</span></div>'; }).join('');
  $('#roles').innerHTML=P.roles.map(function(r,i){ return (i?'<div class="hr"></div><div class="label-ko">보조 역할</div>':'')+'<div class="rolebox"><span class="rolebox__ic"><svg class="ico ico--sm"><use href="#i-'+r[0]+'"/></svg></span><div><div class="sm t-hi">'+r[1]+'</div><div class="xs t-faint mt1" style="line-height:1.7">'+r[2]+'</div></div></div>'; }).join('');
  $('#intro').innerHTML='<p class="quote" style="margin:0">'+P.intro[0]+'</p><p class="xs t-faint" style="line-height:1.9;margin:10px 0 0">'+P.intro[1]+'</p>';
  var G=window.TW_GEAR, gs=G&&G.state(); if(gs&&gs.equipped.main){ P.equip.main=gs.equipped.main; P.equip.enh='+'+G.enhOf(gs.equipped.main); P.equip.cp=G.itemCp(gs.equipped.main); P.equip.slots=['chest','legs','gloves','boots','acc'].map(function(k){ return gs.equipped[k]; }).filter(Boolean); }
  var m=T.get(P.equip.main);
  $('#eqsum').innerHTML='<div class="eqsum"><span class="eqsum__main">'+T.artHTML(m.id)+'</span><div class="fill"><div class="flex ac jb"><span class="sm" style="color:'+T.RARITY[m.rarity].color+'">'+m.name+'</span><span class="xs t-faint">강화 '+P.equip.enh+'</span></div><div class="xs t-faint mt1">전투력 <span class="num t-dim">'+W.fmt(P.equip.cp)+'</span></div></div></div>'+
    '<div class="slotgrid mt3" style="--cols:5;gap:5px;max-width:212px">'+P.equip.slots.map(function(id){ return T.slotHTML(id,{noTag:true}); }).join('')+'</div>';
  var sn=P.season;
  $('#season').innerHTML='<div class="sb__rank"><svg class="ico ico--xl"><use href="#i-sigil"/></svg><div><div class="sb__num num">'+sn.rank+'</div><div class="sb__k mt1">시즌 랭킹 · 상위 '+sn.top+'</div></div></div>'+
    '<div><div class="sb__k">총 플레이 시간</div><div class="sb__v">'+sn.playtime+'</div></div><div><div class="sb__k">마지막 접속</div><div class="sb__v">'+sn.last+'</div></div><button class="btn btn--sm btn--ghost" style="justify-self:end">상세 시즌 기록</button>';
})();
</script>
<script src="js/pose-fix.js"></script>
<script src="js/mat-fix.js"></script>
<script src="js/looks.js"></script>
<script type="module" src="js/portrait3d.js"></script>
<script src="js/ui.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
